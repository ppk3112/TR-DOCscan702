<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบจัดส่งเอกสาร</title>
    
    <meta name="apple-mobile-web-app-title" content="สแกนส่งบิล">
    <meta name="application-name" content="สแกนส่งบิล">
    
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/SxDzdXD5/79162.jpg">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/SxDzdXD5/79162.jpg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <!-- 🟢 เพิ่ม Firebase SDK ผ่าน CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- TVA Fonts + Original Prompt Font for Thai Text -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=VT323&family=Space+Mono:wght@400;700&family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            margin: 0;
            padding-bottom: env(safe-area-inset-bottom);
            background-color: #2c1e16; /* พื้นหลังสีน้ำตาลเข้ม (โต๊ะ TVA) */
            min-height: 100vh;
            color: #22c55e;
        }

        /* ฟอนต์พิเศษสำหรับ UI ตัวเลข/ภาษาอังกฤษตกแต่ง */
        .font-tva { font-family: 'Anton', 'Prompt', sans-serif; letter-spacing: 1px; }
        .font-mono-tva { font-family: 'Space Mono', 'Prompt', monospace; }
        .font-crt { font-family: 'VT323', 'Prompt', monospace; }

        /* หน้าจอ CRT ของ TempPad */
        .temppad-screen {
            background-color: #050a06;
            position: relative;
            box-shadow: inset 0 0 1rem rgba(0,0,0,0.9);
        }
        .temppad-screen::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            z-index: 50;
            background-size: 100% 4px;
            pointer-events: none; /* ยอมให้กดทะลุได้ */
        }

        /* กรอบกระจกเดิม เปลี่ยนเป็นเส้นขอบสไตล์ CRT/Terminal */
        .glass-card, .glass-inner-border {
            background: #0a110c;
            border: 2px solid #15803d;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
        }

        .glass-input {
            background: #020604;
            border: 2px solid #15803d;
            color: #22c55e;
            font-family: 'VT323', 'Prompt', monospace;
            font-size: 1.1rem;
        }
        .glass-input:focus {
            background: #050a06;
            border-color: #eab308;
            outline: none;
            box-shadow: inset 0 0 5px rgba(234, 179, 8, 0.3);
        }
        .glass-input::placeholder {
            color: #15803d;
            font-family: 'Prompt', sans-serif;
            font-size: 0.9rem;
        }

        /* ปุ่มกด Physical Hardware */
        .hw-button {
            box-shadow: inset 2px 2px 0px rgba(255,255,255,0.1), 
                        inset -2px -2px 0px rgba(0,0,0,0.5),
                        0 4px 0px #1a1311, 
                        0 5px 5px rgba(0,0,0,0.5);
            transition: all 0.1s;
        }
        .hw-button:active, .hw-button.active {
            transform: translateY(4px);
            box-shadow: inset 2px 2px 0px rgba(0,0,0,0.5), 
                        inset -2px -2px 0px rgba(255,255,255,0.1),
                        0 0px 0px #1a1311;
        }

        /* ปุ่มภายในจอ CRT */
        .btn-bouncy {
            transition: all 0.1s;
            text-transform: uppercase;
            font-family: 'Prompt', sans-serif;
            border-radius: 4px; /* ลบความโค้งมนออก ให้ดูเหลี่ยมๆ ยุคเก่า */
        }
        .btn-bouncy:active {
            transform: scale(0.96);
            background-color: #eab308;
            color: #000;
            border-color: #eab308;
        }

        /* Scrollbar สไตล์เหลี่ยมและสีเขียว/ทอง */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #050a06; border-left: 1px solid #15803d; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #15803d; border-radius: 0; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #eab308; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ตัวเลือกปฏิทิน (Date Picker) รองรับ Dark Mode/TVA */
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="month"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8) sepia(1) saturate(5) hue-rotate(80deg);
            cursor: pointer;
        }
        
        /* แอนิเมชันกระพริบเตือนภัย Nexus Event */
        @keyframes pulse-orange {
            0% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.7); border-color: #f97316; }
            50% { box-shadow: 0 0 0 10px rgba(249, 115, 22, 0); border-color: #ea580c; }
            100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); border-color: #f97316; }
        }
        .nexus-alert { animation: pulse-orange 2s infinite; }
    </style>
</head>
<body class="text-[#22c55e]">
    <div id="root"></div>

    <script type="text/babel" data-presets="react,env">
        window.addEventListener('error', (event) => {
            document.getElementById('root').innerHTML = `
                <div style="padding: 20px; color: #f97316; font-family: 'Prompt', sans-serif; text-align: center; margin-top: 50px; background: #050a06; border: 4px solid #f97316; height: 100vh;">
                    <i class="fa-solid fa-triangle-exclamation" style="font-size: 50px; margin-bottom: 20px;"></i>
                    <h3 style="font-size: 20px; font-weight: bold; margin-bottom: 10px;">พบข้อผิดพลาดของระบบ</h3>
                    <p style="font-size: 14px; margin-bottom: 15px;">ระบบอาจโดนบล็อกการทำงาน หรือแคชมีปัญหา</p>
                    <pre style="text-align: left; background: #1a0505; padding: 15px; border-radius: 4px; font-size: 12px; overflow-x: auto; color: #ef4444; border: 1px solid #f97316;">${event.message}</pre>
                    <button onclick="window.location.reload(true)" style="margin-top: 20px; padding: 12px 24px; background: #f97316; color: black; border: 2px solid black; font-family: 'Prompt'; font-weight: bold; text-transform: uppercase;">รีเฟรชหน้าเว็บ</button>
                </div>
            `;
        });

        const { useState, useEffect, useRef, useCallback } = React;
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyYAYulOU-9KV7t4y08pz_GhicwWL2S9laTWsRkTqHvo5Fk_UIbGPF_EI0-kHzyY1P57A/exec';

        // 🟢 ตั้งค่า Firebase ด้วย Config ของคุณ
        const firebaseConfig = {
            apiKey: "AIzaSyAbqUh6x0KiIL5rK3VhWc1ECE4R5X_gq2w",
            authDomain: "bill-pj.firebaseapp.com",
            databaseURL: "https://bill-pj-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bill-pj",
            storageBucket: "bill-pj.firebasestorage.app",
            messagingSenderId: "99092363681",
            appId: "1:99092363681:web:629ddf90c27a1d0db333e0"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        const CustomAlertModal = ({ message, onClose }) => {
            if (!message) return null;
            return (
                <div className="fixed inset-0 bg-black/80 z-[200] flex items-center justify-center p-4 transition-opacity animate-in fade-in duration-200">
                    <div className="bg-[#050a06] border-4 border-[#eab308] p-8 w-full max-w-sm text-center shadow-[0_0_20px_rgba(234,179,8,0.3)]">
                        <div className="w-16 h-16 bg-[#eab308]/20 border-2 border-[#eab308] text-[#eab308] rounded-full flex items-center justify-center mx-auto mb-5">
                            <i className="fa-solid fa-circle-exclamation text-3xl"></i>
                        </div>
                        <h3 className="text-xl font-bold text-[#eab308] mb-2 tracking-wide">แจ้งเตือน</h3>
                        <p className="text-[#22c55e] font-medium mb-6 whitespace-pre-wrap font-mono-tva">{message}</p>
                        <button onClick={onClose} className="btn-bouncy w-full py-3 bg-[#eab308] text-black border-2 border-black font-bold text-lg shadow-[2px_2px_0px_#15803d]">
                            ตกลง
                        </button>
                    </div>
                </div>
            );
        };

        // 🟢 ฟังก์ชันป้องกันบั้ก Timezone ของ Safari (Parse Date อย่างปลอดภัย)
        const parseDateSafe = (dateString) => {
            if (!dateString) return new Date();
            if (dateString.includes('-')) {
                const [y, m, d] = dateString.split('-');
                return new Date(parseInt(y, 10), parseInt(m, 10) - 1, parseInt(d, 10));
            }
            return new Date(dateString);
        };

        const formatThaiDate = (dateString) => {
            const d = parseDateSafe(dateString);
            if (isNaN(d.getTime())) return dateString;
            return new Intl.DateTimeFormat('th-TH', { year: 'numeric', month: 'short', day: 'numeric' }).format(d);
        };

        const checkIsUrgent = (dateStr) => {
            if (!dateStr) return false;
            const targetDate = parseDateSafe(dateStr); 
            targetDate.setHours(0, 0, 0, 0);
            const today = new Date(); 
            today.setHours(0, 0, 0, 0);
            const tomorrow = new Date(today); 
            tomorrow.setDate(today.getDate() + 1);
            return targetDate.getTime() <= tomorrow.getTime();
        };

        const playBeep = () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();
                osc.type = 'square'; // เปลี่ยนเป็นเสียงเครื่องอิเล็กทรอนิกส์
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                gainNode.gain.setValueAtTime(0.05, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.connect(gainNode); gainNode.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            } catch (e) {}
        };

        const playDuplicateVoice = () => {
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance('บิลซ้ำค่ะ');
                    utterance.lang = 'th-TH'; 
                    const voices = window.speechSynthesis.getVoices();
                    const thaiVoice = voices.find(voice => voice.lang.includes('th'));
                    if (thaiVoice) utterance.voice = thaiVoice;
                    utterance.pitch = 0.8; // ทำเสียงเข้มขึ้นแบบ TVA
                    utterance.rate = 1.0;
                    window.speechSynthesis.speak(utterance);
                }
            } catch (e) {}
        };

        // 🟢 อัปเกรดระบบ Copy ให้รองรับอุปกรณ์ใหม่ๆ และมี Fallback
        const handleCopyTextGlobal = async (text, onSuccess, onError) => {
            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(text);
                    if (onSuccess) onSuccess();
                    return;
                } catch (err) {
                    console.warn("Clipboard API failed, falling back to execCommand");
                }
            }
            
            // Fallback for older browsers
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed"; 
            textArea.style.top = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try { 
                document.execCommand('copy'); 
                if (onSuccess) onSuccess(); 
            } catch (err) { 
                if (onError) onError(); 
            }
            document.body.removeChild(textArea);
        };

        const ScannerTab = ({ isActive, userProfile, onSaveSuccess }) => {
            const [currentItems, setCurrentItems] = useState([]);
            
            const [inputValue, setInputValue] = useState('');
            const [dueDate, setDueDate] = useState(() => {
                const now = new Date(); now.setDate(now.getDate() + 2);
                return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            });
            
            const [deliveryType, setDeliveryType] = useState('DC');
            const [deliveryZone, setDeliveryZone] = useState('NORMAL'); 
            const [showZoneDropdown, setShowZoneDropdown] = useState(false); 
            
            const [allSentCodesCache, setAllSentCodesCache] = useState(new Set());
            const [duplicateWarning, setDuplicateWarning] = useState(null);
            const [alertMsg, setAlertMsg] = useState(null); 
            
            const [isScanning, setIsScanning] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [saveSuccess, setSaveSuccess] = useState(false);
            const [isFlashlightOn, setIsFlashlightOn] = useState(false);

            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [showClearConfirmModal, setShowClearConfirmModal] = useState(false);
            const [showCopyModal, setShowCopyModal] = useState(false);
            const [lineMessageToCopy, setLineMessageToCopy] = useState('');
            const [lastSavedMessage, setLastSavedMessage] = useState(() => {
                try { return localStorage.getItem('last_saved_message') || ''; } catch (e) { return ''; }
            });
            
            const [editingIndex, setEditingIndex] = useState(null);
            const [editDueDate, setEditDueDate] = useState('');
            const [editIsFactory, setEditIsFactory] = useState(false);
            const [editIsUpcountry, setEditIsUpcountry] = useState(false); 
            const [editRemark, setEditRemark] = useState(''); 

            const [showUrgencyModal, setShowUrgencyModal] = useState(false);
            const [pendingItem, setPendingItem] = useState(null);

            const html5QrCodeRef = useRef(null);
            const lastScannedRef = useRef(null);
            const dueDateRef = useRef(dueDate);
            const deliveryTypeRef = useRef(deliveryType);
            const deliveryZoneRef = useRef(deliveryZone);
            const currentItemsRef = useRef(currentItems);
            const allSentCodesCacheRef = useRef(allSentCodesCache);
            const showUrgencyModalRef = useRef(false);

            useEffect(() => { dueDateRef.current = dueDate; }, [dueDate]);
            useEffect(() => { deliveryTypeRef.current = deliveryType; }, [deliveryType]);
            useEffect(() => { deliveryZoneRef.current = deliveryZone; }, [deliveryZone]);
            useEffect(() => { currentItemsRef.current = currentItems; }, [currentItems]);
            useEffect(() => { allSentCodesCacheRef.current = allSentCodesCache; }, [allSentCodesCache]);
            useEffect(() => { showUrgencyModalRef.current = showUrgencyModal; }, [showUrgencyModal]);

            const updateCartInFirebase = (newItems) => {
                if (userProfile && userProfile.userId) {
                    database.ref('carts/' + userProfile.userId).set(newItems);
                }
            };

            useEffect(() => {
                if (userProfile && userProfile.userId) {
                    const cartRef = database.ref('carts/' + userProfile.userId);
                    cartRef.on('value', (snapshot) => {
                        const data = snapshot.val();
                        setCurrentItems(data || []);
                    });
                    return () => cartRef.off();
                } else {
                    setCurrentItems([]);
                }
            }, [userProfile]);

            useEffect(() => {
                const fetchAllCodes = async () => {
                    try {
                        const cachedCodes = localStorage.getItem('all_sent_codes_backup');
                        if (cachedCodes) setAllSentCodesCache(new Set(JSON.parse(cachedCodes)));
                    } catch(e) {}
                    try {
                        const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getAllCodes`);
                        const text = await res.text();
                        if (text.trim().startsWith('<')) return;
                        const json = JSON.parse(text);
                        if (json.status === 'success' && json.data) {
                            const uppercaseCodes = json.data.map(code => String(code).trim().toUpperCase());
                            setAllSentCodesCache(new Set(uppercaseCodes));
                            try { 
                                // ป้องกัน LocalStorage ขยะล้น โดยเก็บแค่ 10,000 รายการล่าสุด
                                const slicedCache = uppercaseCodes.slice(-10000); 
                                localStorage.setItem('all_sent_codes_backup', JSON.stringify(slicedCache)); 
                            } catch(e) {}
                        }
                    } catch (e) {}
                };
                fetchAllCodes();
                return () => { if (html5QrCodeRef.current && isScanning) html5QrCodeRef.current.stop().catch(() => {}); }
            }, []);

            const checkDuplicate = useCallback((code) => {
                const cleanCode = String(code).trim().toUpperCase(); 
                if (currentItemsRef.current.some(item => String(item.code).trim().toUpperCase() === cleanCode)) {
                    playDuplicateVoice();
                    setDuplicateWarning(`บิล ${cleanCode} สแกนไปแล้วในตะกร้า!`);
                    setTimeout(() => setDuplicateWarning(null), 5000); 
                    return true;
                }
                if (allSentCodesCacheRef.current.has(cleanCode)) {
                    playDuplicateVoice();
                    setDuplicateWarning(`บิล ${cleanCode} เคยถูกส่งไปแล้วในระบบ!`);
                    setTimeout(() => setDuplicateWarning(null), 5000); 
                    return true;
                }
                return false;
            }, []);

            const processNewItem = (finalCode, itemDueDate) => {
                if (checkDuplicate(finalCode)) return;
                if (checkIsUrgent(itemDueDate)) {
                    setPendingItem({ code: finalCode, dueDate: itemDueDate });
                    setShowUrgencyModal(true);
                } else {
                    playBeep();
                    const newItems = [{ code: finalCode, dueDate: itemDueDate, urgencyTag: null, remark: '' }, ...currentItemsRef.current];
                    updateCartInFirebase(newItems);
                }
            };

            const handleConfirmUrgency = (tag) => {
                if (pendingItem) {
                    playBeep();
                    const newItems = [{ ...pendingItem, urgencyTag: tag, remark: '' }, ...currentItemsRef.current];
                    updateCartInFirebase(newItems);
                }
                setShowUrgencyModal(false);
                setPendingItem(null);
            };

            const handleTypeToggle = (type) => {
                if (deliveryType === type) setShowZoneDropdown(!showZoneDropdown);
                else { setDeliveryType(type); setDeliveryZone('NORMAL'); setShowZoneDropdown(false); }
            };

            const startScanner = async () => {
                if (!window.Html5Qrcode) { setAlertMsg('ระบบสแกนกำลังโหลด...'); return; }
                const isLineApp = navigator.userAgent.indexOf("Line") > -1;
                if (isLineApp) setAlertMsg("ตรวจพบการใช้งานผ่านแอป LINE\nกรุณากดไอคอน '3 จุด' แล้วเลือก 'เปิดใน Safari / Browser'");

                // 🟢 ปลดล็อก Audio Policy บน iOS ตอนผู้ใช้กดปุ่มเปิดกล้อง
                try {
                    const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
                    tempCtx.resume();
                    if ('speechSynthesis' in window) {
                        const utterance = new SpeechSynthesisUtterance('');
                        utterance.volume = 0;
                        window.speechSynthesis.speak(utterance);
                    }
                } catch(e) {}

                setIsScanning(true);
                setTimeout(() => {
                    const html5QrCode = new window.Html5Qrcode("reader");
                    html5QrCodeRef.current = html5QrCode;
                    const config = {
                        fps: 10,
                        qrbox: (vw, vh) => ({ width: Math.min(250, vw * 0.8), height: 150 }),
                        aspectRatio: 1.0, 
                        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
                    };

                    html5QrCode.start(
                        { facingMode: "environment" }, config,
                        (decodedText) => {
                            if (showUrgencyModalRef.current) return;
                            if (lastScannedRef.current !== decodedText) {
                                lastScannedRef.current = decodedText;
                                
                                let rawCode = decodedText.trim();
                                const yy = String(new Date().getFullYear()).slice(-2);
                                
                                if (rawCode.length !== 10 || !rawCode.startsWith(yy)) {
                                    setAlertMsg(`บาร์โค้ดไม่ถูกต้อง!\nต้องมี 10 หลัก และขึ้นต้นด้วยปี ${yy} เท่านั้น\n(คุณสแกนได้: ${rawCode})`);
                                    setTimeout(() => { lastScannedRef.current = null }, 3000);
                                    return;
                                }

                                let finalCode = deliveryTypeRef.current === 'FACTORY' ? `${rawCode}(รับโรงตัด)` : rawCode;
                                if (deliveryZoneRef.current === 'UPCOUNTRY') finalCode += '(ตจว.)';
                                processNewItem(finalCode, dueDateRef.current);
                                setTimeout(() => { lastScannedRef.current = null }, 1500);
                            }
                        }, 
                        (err) => {}
                    ).catch((err) => { setIsScanning(false); setAlertMsg("ไม่สามารถเปิดกล้องได้"); });
                }, 300);
            };

            const stopScanner = () => {
                if (html5QrCodeRef.current) {
                    html5QrCodeRef.current.stop().then(() => {
                        html5QrCodeRef.current.clear(); 
                        setIsScanning(false); setIsFlashlightOn(false);
                    }).catch(() => setIsScanning(false));
                } else setIsScanning(false);
            };

            const toggleFlashlight = async () => {
                if (html5QrCodeRef.current && isScanning) {
                    try {
                        const newState = !isFlashlightOn;
                        await html5QrCodeRef.current.applyVideoConstraints({ advanced: [{ torch: newState }] });
                        setIsFlashlightOn(newState);
                    } catch (error) { setAlertMsg("อุปกรณ์ไม่รองรับไฟฉายผ่านเว็บ"); }
                }
            };

            const handleManualAdd = (e) => {
                e.preventDefault();
                let val = inputValue.trim();
                if (!val) return;

                if (val.length !== 4 && val.length !== 10) {
                    setAlertMsg("กรุณาพิมพ์เลขเที่ยว 4 หลัก หรือ 10 หลัก เท่านั้นครับ");
                    return;
                }
                
                const now = new Date();
                const yy = String(now.getFullYear()).slice(-2);
                
                if (val.length === 10 && !val.startsWith(yy)) {
                    setAlertMsg(`เลขบิล 10 หลักต้องขึ้นต้นด้วยปีปัจจุบัน (${yy}) เท่านั้นครับ`);
                    return;
                }

                if (val.length === 4) {
                    const mm = String(now.getMonth() + 1).padStart(2, '0');
                    val = `${yy}${mm}00${val}`; 
                }

                let finalCode = deliveryType === 'FACTORY' ? `${val}(รับโรงตัด)` : val;
                if (deliveryZone === 'UPCOUNTRY') finalCode += '(ตจว.)';
                processNewItem(finalCode, dueDate);
                setInputValue('');
            };

            const saveEditItem = () => {
                if (editingIndex === null) return;
                const newItems = [...currentItemsRef.current];
                let baseCode = newItems[editingIndex].code.replace('(รับโรงตัด)', '').replace('(ตจว.)', '').trim();
                
                let finalCode = editIsFactory ? `${baseCode}(รับโรงตัด)` : baseCode;
                if (editIsUpcountry) finalCode += '(ตจว.)';
                
                // 🟢 แก้บั้กแก้ไขบิลทะลุการตรวจสอบฐานข้อมูล
                const upperFinalCode = finalCode.toUpperCase();
                const isDuplicateInCart = newItems.some((item, idx) => idx !== editingIndex && String(item.code).trim().toUpperCase() === upperFinalCode);
                const isDuplicateInHistory = allSentCodesCacheRef.current.has(upperFinalCode);
                
                if (isDuplicateInCart || isDuplicateInHistory) { 
                    playDuplicateVoice();
                    setDuplicateWarning(`แก้ไขไม่ได้! บิลนี้ซ้ำกับในระบบหรือในตะกร้าแล้ว`);
                    setTimeout(() => setDuplicateWarning(null), 5000); 
                    return; 
                }

                const existingTag = newItems[editingIndex].urgencyTag || null;
                newItems[editingIndex] = { ...newItems[editingIndex], code: finalCode, dueDate: editDueDate, urgencyTag: existingTag, remark: editRemark.trim() };
                
                updateCartInFirebase(newItems);
                setEditingIndex(null);
            };

            const executeSaveBatch = async () => {
                if (currentItemsRef.current.length === 0) return;
                setIsSaving(true); setSaveSuccess(false);

                const now = new Date();
                const currentDateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                const currentTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

                const newBatch = {
                    id: "BATCH-" + Date.now().toString().slice(-6),
                    items: [...currentItemsRef.current], date: currentDateStr, time: currentTimeStr, 
                    dueDate: dueDate, timestamp: now.getTime(),
                    userId: userProfile ? userProfile.userId : null
                };

                try {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(newBatch)
                    });

                    const text = await response.text();
                    if (text.trim().startsWith('<')) { setAlertMsg("เซิร์ฟเวอร์ตอบกลับผิดพลาด (URL อาจหมดอายุ)"); setIsSaving(false); return; }

                    const result = JSON.parse(text);
                    if (result.status === 'error') {
                        if (result.message === 'DUPLICATE_FOUND') { setAlertMsg(`ตรวจพบการซ้ำซ้อนในฐานข้อมูล!\nบิลเลขที่: ${result.duplicateCode}`); } 
                        else { setAlertMsg("เกิดข้อผิดพลาด: " + result.message); }
                        setIsSaving(false); return; 
                    }

                    updateCartInFirebase([]); 
                    try { localStorage.removeItem('delivery_basket'); } catch(e) {}
                    setSaveSuccess(true);
                    
                    if (window.confetti) {
                        confetti({
                            particleCount: 150, spread: 80, origin: { y: 0.6 },
                            colors: ['#22c55e', '#eab308', '#f97316', '#15803d', '#ffffff'] // สีตามธีม TVA
                        });
                    }
                    
                    if (result.lineMessage) {
                        setLineMessageToCopy(result.lineMessage);
                        setLastSavedMessage(result.lineMessage); 
                        try { localStorage.setItem('last_saved_message', result.lineMessage); } catch(e) {}
                        setTimeout(() => { setShowCopyModal(true); }, 1500); 
                    }
                    
                    onSaveSuccess();
                    
                    const newCodesSet = new Set(allSentCodesCache);
                    newBatch.items.forEach(item => newCodesSet.add(item.code.trim().toUpperCase()));
                    setAllSentCodesCache(newCodesSet);
                    try {
                        const updatedArray = Array.from(newCodesSet).slice(-10000);
                        localStorage.setItem('all_sent_codes_backup', JSON.stringify(updatedArray));
                    } catch(e) {}

                    setTimeout(() => setSaveSuccess(false), 3000);
                } catch (error) { 
                    setAlertMsg(`การเชื่อมต่อล้มเหลว`); 
                } finally { 
                    setIsSaving(false); 
                }
            };

            return (
                <div className={`pt-2 px-2 pb-[100px] h-full flex flex-col space-y-4 ${isActive ? 'block' : 'hidden'} overflow-y-auto hide-scrollbar relative z-10`}>
                    <CustomAlertModal message={alertMsg} onClose={() => setAlertMsg(null)} />

                    {/* Modals and Overlays */}
                    {saveSuccess && (
                        <div className="fixed inset-0 bg-black/80 z-[150] flex flex-col items-center justify-center transition-opacity animate-in fade-in duration-200">
                            <div className="bg-[#050a06] border-4 border-[#22c55e] p-8 text-center shadow-[0_0_30px_rgba(34,197,94,0.5)]">
                                <i className="fa-solid fa-check-circle text-6xl text-[#22c55e] mb-4"></i>
                                <h2 className="font-tva text-3xl text-[#22c55e] mb-2 tracking-widest">สำเร็จ!</h2>
                                <p className="font-mono-tva text-[#eab308] font-bold">ข้อมูลถูกส่งเข้าระบบเรียบร้อย</p>
                            </div>
                        </div>
                    )}

                    {duplicateWarning && (
                        <div className="absolute top-0 left-0 right-0 z-[110] bg-[#f97316] text-black p-3 flex items-center gap-3 border-b-4 border-black font-bold font-mono-tva transition-opacity animate-in fade-in duration-200">
                            <i className="fa-solid fa-triangle-exclamation text-xl"></i>
                            <div className="flex-1 text-sm uppercase">{duplicateWarning}</div>
                        </div>
                    )}

                    {showUrgencyModal && pendingItem && (
                        <div className="fixed inset-0 bg-black/80 z-[160] flex items-center justify-center p-4 transition-opacity animate-in fade-in duration-200">
                            <div className="bg-[#050a06] border-4 border-[#f97316] p-6 w-full max-w-sm nexus-alert">
                                <div className="text-center mb-6">
                                    <i className="fa-solid fa-triangle-exclamation text-5xl text-[#f97316] mb-2"></i>
                                    <h3 className="text-xl font-bold text-[#f97316] font-mono-tva">ระบุสาเหตุงานด่วน</h3>
                                    <p className="text-2xl font-bold text-[#eab308] mt-2 font-crt">{pendingItem.code}</p>
                                </div>
                                <div className="flex flex-col gap-3 mb-5">
                                    <button onClick={() => handleConfirmUrgency('ด่วนมาก')} className="btn-bouncy w-full py-3 bg-transparent border-2 border-[#f97316] text-[#f97316] hover:bg-[#f97316] hover:text-black font-bold flex items-center justify-center gap-2">
                                        <i className="fa-solid fa-fire text-xl"></i> ด่วนมาก
                                    </button>
                                    <button onClick={() => handleConfirmUrgency('ขายพึ่งลง TMS')} className="btn-bouncy w-full py-3 bg-transparent border-2 border-[#eab308] text-[#eab308] hover:bg-[#eab308] hover:text-black font-bold flex items-center justify-center gap-2">
                                        <i className="fa-solid fa-clock-rotate-left text-xl"></i> ขายพึ่งลง TMS
                                    </button>
                                </div>
                                <button onClick={() => { setShowUrgencyModal(false); setPendingItem(null); }} className="btn-bouncy w-full py-3 bg-black border-2 border-gray-700 text-gray-500 font-semibold hover:bg-gray-900">
                                    ยกเลิก (ไม่เพิ่มบิลนี้)
                                </button>
                            </div>
                        </div>
                    )}

                    {showCopyModal && (
                        <div className="fixed inset-0 bg-black/80 z-[160] flex items-center justify-center p-4 transition-opacity animate-in fade-in duration-200">
                            <div className="bg-[#050a06] border-4 border-[#22c55e] p-6 w-full max-w-sm shadow-[0_0_20px_rgba(34,197,94,0.3)]">
                                <div className="text-center mb-5 border-b-2 border-[#15803d] pb-3">
                                    <i className="fa-regular fa-copy text-3xl text-[#22c55e] mb-2"></i>
                                    <h3 className="text-2xl font-bold text-[#22c55e] font-tva tracking-widest">คัดลอกข้อความ</h3>
                                </div>
                                <div className="bg-black border-2 border-[#15803d] p-3 mb-6 max-h-[40vh] overflow-y-auto custom-scrollbar text-left">
                                    <pre className="text-xs text-[#eab308] whitespace-pre-wrap font-crt leading-relaxed">{lineMessageToCopy}</pre>
                                </div>
                                <div className="flex gap-4">
                                    <button onClick={() => setShowCopyModal(false)} className="btn-bouncy flex-1 py-3 bg-transparent border-2 border-gray-600 text-gray-400 font-semibold shadow-[2px_2px_0px_#374151]">ปิดหน้าต่าง</button>
                                    <button onClick={() => handleCopyTextGlobal(lineMessageToCopy, () => setAlertMsg("คัดลอกข้อความสำเร็จ!"), () => setAlertMsg("ไม่สามารถคัดลอกได้"))} className="btn-bouncy flex-1 py-3 bg-[#22c55e] text-black border-2 border-black font-bold flex justify-center items-center gap-2 shadow-[2px_2px_0px_#15803d]"><i className="fa-solid fa-copy"></i> คัดลอกเลย</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showClearConfirmModal && (
                        <div className="fixed inset-0 bg-black/80 z-[160] flex items-center justify-center p-4 transition-opacity animate-in fade-in duration-200">
                            <div className="bg-[#050a06] border-4 border-[#ef4444] p-6 w-full max-w-sm shadow-[0_0_20px_rgba(239,68,68,0.4)]">
                                <div className="text-center mb-6">
                                    <i className="fa-solid fa-trash-can text-5xl text-[#ef4444] mb-4"></i>
                                    <h3 className="text-2xl font-bold text-[#ef4444] font-tva tracking-widest">ล้างตะกร้า?</h3>
                                    <p className="text-sm text-[#eab308] mt-2 font-mono-tva font-bold">ข้อมูลที่สแกนมาจะหายหมดเลยนะ</p>
                                </div>
                                <div className="flex gap-4 font-mono-tva">
                                    <button onClick={() => setShowClearConfirmModal(false)} className="btn-bouncy flex-1 py-3 bg-transparent border-2 border-gray-600 text-gray-400 font-bold">เปลี่ยนใจ</button>
                                    <button onClick={() => { updateCartInFirebase([]); setShowClearConfirmModal(false); }} className="btn-bouncy flex-1 py-3 bg-[#ef4444] text-black border-2 border-black font-bold shadow-[2px_2px_0px_#991b1b]">ล้างทั้งหมด</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {editingIndex !== null && (
                        <div className="fixed inset-0 bg-black/90 z-[160] flex items-center justify-center p-4 transition-opacity animate-in fade-in duration-200">
                            <div className="bg-[#050a06] border-4 border-[#eab308] p-6 w-full max-w-sm">
                                <div className="flex justify-between items-center border-b-2 border-[#eab308] pb-3 mb-4">
                                    <h3 className="text-xl font-bold text-[#eab308] flex items-center gap-2 font-tva tracking-widest"><i className="fa-solid fa-pen-to-square"></i> แก้ไขบิล</h3>
                                    <button onClick={() => setEditingIndex(null)} className="btn-bouncy text-gray-400 hover:text-white"><i className="fa-solid fa-xmark text-2xl"></i></button>
                                </div>
                                <div className="space-y-4 mb-6 font-mono-tva">
                                    <div>
                                        <label className="text-sm font-bold text-[#22c55e] mb-1.5 block">> ประเภทการรับ_</label>
                                        <div className="flex gap-2">
                                            <button type="button" onClick={() => setEditIsFactory(false)} className={`btn-bouncy flex-1 py-2 text-sm font-bold border-2 ${!editIsFactory ? 'bg-[#22c55e] text-black border-[#22c55e]' : 'bg-transparent text-gray-500 border-gray-700'}`}><i className="fa-solid fa-warehouse mr-1"></i> รับ DC</button>
                                            <button type="button" onClick={() => setEditIsFactory(true)} className={`btn-bouncy flex-1 py-2 text-sm font-bold border-2 ${editIsFactory ? 'bg-[#f97316] text-black border-[#f97316]' : 'bg-transparent text-gray-500 border-gray-700'}`}><i className="fa-solid fa-scissors mr-1"></i> โรงตัด</button>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-sm font-bold text-[#22c55e] mb-1.5 block">> โซนพื้นที่_</label>
                                        <div className="flex gap-2">
                                            <button type="button" onClick={() => setEditIsUpcountry(false)} className={`btn-bouncy flex-1 py-2 text-sm font-bold border-2 ${!editIsUpcountry ? 'bg-[#22c55e] text-black border-[#22c55e]' : 'bg-transparent text-gray-500 border-gray-700'}`}>พื้นที่ปกติ</button>
                                            <button type="button" onClick={() => setEditIsUpcountry(true)} className={`btn-bouncy flex-1 py-2 text-sm font-bold border-2 ${editIsUpcountry ? 'bg-[#818cf8] text-black border-[#818cf8]' : 'bg-transparent text-gray-500 border-gray-700'}`}><i className="fa-solid fa-truck-fast mr-1"></i> งาน ตจว.</button>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-sm font-bold text-[#22c55e] mb-1.5 block">> วันที่กำหนดส่ง_</label>
                                        <input type="date" value={editDueDate} onChange={(e) => setEditDueDate(e.target.value)} className="w-full px-3 py-2 bg-black border-2 border-[#15803d] text-[#eab308] font-crt outline-none text-lg" />
                                    </div>
                                    <div>
                                        <label className="text-sm font-bold text-[#22c55e] mb-1.5 block">> หมายเหตุ (ถ้ามี)_</label>
                                        <input type="text" value={editRemark} onChange={(e) => setEditRemark(e.target.value)} placeholder="เช่น ลูกค้าขอรับเช้า, ลังแตก" className="w-full px-3 py-2 bg-black border-2 border-[#15803d] text-[#22c55e] font-mono-tva outline-none placeholder-[#15803d] text-sm" />
                                    </div>
                                </div>
                                <button onClick={saveEditItem} className="btn-bouncy w-full py-3 bg-[#eab308] text-black border-2 border-black font-tva text-xl tracking-widest shadow-[2px_2px_0px_#854d0e]">บันทึกการแก้ไข</button>
                            </div>
                        </div>
                    )}

                    {showConfirmModal && (
                        <div className="fixed inset-0 bg-black/80 z-[160] flex items-center justify-center p-4 transition-opacity animate-in fade-in duration-200">
                            <div className="bg-[#050a06] border-4 border-[#22c55e] p-6 w-full max-w-sm shadow-[0_0_20px_rgba(34,197,94,0.3)]">
                                <div className="text-center mb-6">
                                    <i className="fa-solid fa-paper-plane text-5xl text-[#22c55e] mb-4"></i>
                                    <h3 className="text-2xl font-bold text-[#22c55e] font-tva tracking-widest">ส่งข้อมูล?</h3>
                                    <p className="text-lg text-[#eab308] mt-2 font-mono-tva">จำนวนทั้งหมด <span className="font-bold text-white text-xl mx-1 font-crt">{currentItems.length}</span> เที่ยว</p>
                                </div>
                                <div className="flex gap-4 font-mono-tva">
                                    <button onClick={() => setShowConfirmModal(false)} className="btn-bouncy flex-1 py-3 bg-transparent border-2 border-gray-600 text-gray-400 font-bold">ไว้ก่อน</button>
                                    <button onClick={() => { setShowConfirmModal(false); executeSaveBatch(); }} className="btn-bouncy flex-1 py-3 bg-[#22c55e] text-black border-2 border-black font-bold shadow-[2px_2px_0px_#15803d]">ยืนยันการส่ง</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Main UI */}
                    <div className="flex flex-col gap-4 lg:flex-row h-full">
                        {/* Control Panel (Top on mobile, Left on Desktop) */}
                        <div className="lg:w-1/2 flex flex-col space-y-4">
                            <div className="border-2 border-[#15803d] bg-[#020604] p-3 shadow-[0_4px_0_rgba(0,0,0,0.5)] flex flex-col">
                                <div className="flex justify-between items-center mb-3 border-b border-[#15803d] pb-1 font-mono-tva text-xs text-[#22c55e]">
                                    <span>[ SYS: SCAN_MODULE ]</span>
                                </div>
                                
                                {isScanning ? (
                                    <div className="relative border-2 border-[#eab308] bg-black mb-3 h-[250px] overflow-hidden flex items-center justify-center">
                                        <div id="reader" className="w-full h-full"></div>
                                        <div className="absolute inset-0 border-[4px] border-[#eab308] pointer-events-none opacity-50 flex justify-center items-center">
                                            <div className="w-[80%] h-[60%] border-2 border-dashed border-[#f97316]"></div>
                                        </div>
                                        <button onClick={stopScanner} className="absolute top-2 right-2 bg-red-600 text-white w-8 h-8 font-bold border-2 border-black z-10"><i className="fa-solid fa-xmark"></i></button>
                                        <button onClick={toggleFlashlight} className={`absolute top-2 left-2 w-8 h-8 font-bold border-2 border-black z-10 ${isFlashlightOn ? 'bg-yellow-400 text-black' : 'bg-gray-700 text-white'}`}><i className="fa-solid fa-bolt"></i></button>
                                    </div>
                                ) : (
                                    <div className="flex flex-col gap-3 mb-3">
                                        <button onClick={startScanner} className="btn-bouncy w-full h-[80px] bg-[#eab308] text-black border-2 border-[#b45309] font-tva text-3xl flex items-center justify-center gap-3 shadow-[inset_0_-4px_0_rgba(0,0,0,0.2)]">
                                            <i className="fa-solid fa-camera"></i> สแกนกล้อง
                                        </button>
                                        <form onSubmit={handleManualAdd} className="flex">
                                            <span className="bg-[#15803d] text-black px-3 flex items-center font-bold text-xl border-y-2 border-l-2 border-[#15803d]">{'>'}</span>
                                            <input type="text" value={inputValue} onChange={(e) => setInputValue(e.target.value)} placeholder="พิมพ์เลขบิล 4 หรือ 10 หลัก..." className="flex-1 px-3 py-3 glass-input outline-none font-crt text-xl placeholder-[#15803d]" />
                                            <button type="submit" className="btn-bouncy w-[60px] bg-[#22c55e] text-black border-2 border-[#22c55e] font-bold text-xl shadow-sm"><i className="fa-solid fa-plus"></i></button>
                                        </form>
                                    </div>
                                )}

                                <div className="h-px bg-[#15803d]/50 my-2"></div>

                                <div className="mb-3 relative font-mono-tva">
                                    <div className="flex gap-2 text-sm font-bold">
                                        <button onClick={() => handleTypeToggle('DC')} className={`btn-bouncy flex-1 py-3 border-2 flex justify-center items-center gap-2 ${deliveryType === 'DC' ? 'bg-[#22c55e] border-[#22c55e] text-black' : 'bg-transparent border-[#15803d] text-[#15803d]'}`}>
                                            <i className="fa-solid fa-warehouse hidden sm:block"></i> รับ DC {deliveryType === 'DC' && deliveryZone === 'UPCOUNTRY' && '(ตจว.)'}
                                            {deliveryType === 'DC' && <i className={`fa-solid fa-chevron-down text-[10px] ml-1 transition-transform ${showZoneDropdown ? 'rotate-180' : ''}`}></i>}
                                        </button>
                                        <button onClick={() => handleTypeToggle('FACTORY')} className={`btn-bouncy flex-1 py-3 border-2 flex justify-center items-center gap-2 ${deliveryType === 'FACTORY' ? 'bg-[#f97316] border-[#f97316] text-black' : 'bg-transparent border-[#15803d] text-[#15803d]'}`}>
                                            <i className="fa-solid fa-scissors hidden sm:block"></i> โรงตัด {deliveryType === 'FACTORY' && deliveryZone === 'UPCOUNTRY' && '(ตจว.)'}
                                            {deliveryType === 'FACTORY' && <i className={`fa-solid fa-chevron-down text-[10px] ml-1 transition-transform ${showZoneDropdown ? 'rotate-180' : ''}`}></i>}
                                        </button>
                                    </div>
                                    {showZoneDropdown && (
                                        <div className="absolute top-full left-0 right-0 mt-1 p-2 bg-[#050a06] border-2 border-[#15803d] shadow-[0_4px_0_#000] z-20 flex gap-2">
                                            <button onClick={() => { setDeliveryZone('NORMAL'); setShowZoneDropdown(false); }} className={`btn-bouncy flex-1 py-2 text-sm font-bold border-2 ${deliveryZone === 'NORMAL' ? 'bg-[#eab308] text-black border-[#eab308]' : 'bg-transparent text-gray-400 border-gray-700'}`}>พื้นที่ปกติ</button>
                                            <button onClick={() => { setDeliveryZone('UPCOUNTRY'); setShowZoneDropdown(false); }} className={`btn-bouncy flex-1 py-2 text-sm font-bold border-2 ${deliveryZone === 'UPCOUNTRY' ? 'bg-[#818cf8] text-black border-[#818cf8]' : 'bg-transparent text-gray-400 border-gray-700'}`}><i className="fa-solid fa-truck-fast"></i> งาน ตจว.</button>
                                        </div>
                                    )}
                                </div>

                                <div className={`relative p-1 border-2 transition-colors duration-300 ${checkIsUrgent(dueDate) ? 'border-[#f97316] bg-[#f97316]/10' : 'border-[#15803d]'}`}>
                                    {checkIsUrgent(dueDate) && <span className="absolute -top-3 right-4 bg-[#f97316] text-black text-[10px] px-2 py-0.5 font-bold z-10 border border-black uppercase font-mono-tva"><i className="fa-solid fa-bolt"></i> ด่วนพิเศษ</span>}
                                    <input type="date" required value={dueDate} onChange={(e) => setDueDate(e.target.value)} className={`w-full px-3 py-2 bg-transparent outline-none font-crt text-xl text-center ${checkIsUrgent(dueDate) ? 'text-[#f97316]' : 'text-[#eab308]'}`} />
                                </div>
                            </div>
                            
                            {lastSavedMessage && (
                                <div className="border-2 border-[#22c55e] bg-[#020604] p-3 shadow-[0_4px_0_rgba(0,0,0,0.5)] flex flex-col gap-2">
                                    <div className="flex items-center gap-2 text-[#22c55e] font-mono-tva font-bold text-sm">
                                        <i className="fa-solid fa-clock-rotate-left"></i> ข้อความแจ้งเตือนล่าสุด
                                    </div>
                                    <p className="text-[10px] text-[#15803d] font-mono-tva truncate">กดเพื่อดูสรุปข้อความที่ส่งเข้าระบบครั้งล่าสุด</p>
                                    <button onClick={() => { setLineMessageToCopy(lastSavedMessage); setShowCopyModal(true); }} className="btn-bouncy w-full py-2 bg-transparent border-2 border-[#22c55e] text-[#22c55e] font-mono-tva font-bold text-sm shadow-[2px_2px_0px_#15803d]">
                                        <i className="fa-solid fa-copy"></i> ดูข้อความ / คัดลอก
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* Cart Area (Bottom on mobile, Right on Desktop) */}
                        <div className="lg:w-1/2 flex flex-col border-2 border-[#15803d] bg-[#050a06] min-h-0 flex-1 shadow-[0_4px_0_rgba(0,0,0,0.5)]">
                            <div className="flex justify-between items-center p-2 bg-[#15803d] text-black font-tva tracking-widest text-lg">
                                <span className="flex items-center gap-2"><i className="fa-solid fa-box-open"></i> ตะกร้าบิล</span>
                                <div className="flex items-center gap-2">
                                    {currentItems.length > 0 && <button onClick={() => setShowClearConfirmModal(true)} className="btn-bouncy text-white text-[10px] bg-red-800 px-2 py-1 border border-black"><i className="fa-solid fa-trash-can"></i> ล้าง</button>}
                                    <span className="bg-black text-[#22c55e] px-2 py-1 font-crt">{currentItems.length} เที่ยว</span>
                                </div>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-2 relative min-h-[150px]">
                                {isSaving && <div className="absolute inset-0 bg-black/80 z-50 flex flex-col items-center justify-center font-crt text-[#eab308] text-2xl animate-pulse">กำลังส่งข้อมูล...</div>}
                                
                                {currentItems.length === 0 ? (
                                    <div className="absolute inset-0 flex flex-col items-center justify-center text-[#15803d] opacity-50 font-mono-tva font-bold">
                                        <i className="fa-solid fa-inbox text-5xl mb-2"></i>
                                        <p>ตะกร้ายังว่างเปล่า</p>
                                    </div>
                                ) : (
                                    currentItems.map((item, index) => {
                                        const isUrgent = checkIsUrgent(item.dueDate);
                                        const isFactory = item.code.includes('(รับโรงตัด)');
                                        const isUpcountry = item.code.includes('(ตจว.)');
                                        
                                        return (
                                            <div key={index} className={`border-l-4 p-2 flex justify-between bg-[#0a100d] ${isUrgent ? 'border-[#f97316]' : 'border-[#22c55e]'}`}>
                                                <div className="flex flex-col justify-center overflow-hidden">
                                                    <span className={`font-crt text-2xl tracking-wider ${isFactory ? 'text-[#f97316]' : 'text-[#eab308]'}`}>{item.code}</span>
                                                    <span className="text-[10px] font-mono-tva font-bold mt-1 flex flex-wrap gap-1 text-[#15803d]">
                                                        <span>ดิว: {formatThaiDate(item.dueDate)}</span> 
                                                        
                                                        {item.urgencyTag === 'ด่วนมาก' && <span className="text-red-500 border border-red-900 bg-red-950/50 px-1"><i className="fa-solid fa-fire"></i> ด่วนมาก</span>}
                                                        {item.urgencyTag === 'ขายพึ่งลง TMS' && <span className="text-amber-500 border border-amber-900 bg-amber-950/50 px-1"><i className="fa-solid fa-clock-rotate-left"></i> ขายพึ่งลง TMS</span>}
                                                        {!item.urgencyTag && isUrgent && <span className="text-red-500 border border-red-900 bg-red-950/50 px-1"><i className="fa-solid fa-bolt"></i></span>}
                                                        {isUpcountry && <span className="text-indigo-400 border border-indigo-900 bg-indigo-950/50 px-1"><i className="fa-solid fa-truck-fast"></i> ตจว.</span>}
                                                        {item.remark && <span className="text-[#eab308] px-1 truncate max-w-[100px]">/* {item.remark} */</span>}
                                                    </span>
                                                </div>
                                                <div className="flex gap-1 items-start shrink-0 ml-1">
                                                    <button onClick={() => { setEditingIndex(index); setEditDueDate(item.dueDate); setEditIsFactory(isFactory); setEditIsUpcountry(isUpcountry); setEditRemark(item.remark || ''); }} className="btn-bouncy w-8 h-8 bg-gray-800 text-gray-300 border border-gray-600 flex items-center justify-center"><i className="fa-solid fa-pen-to-square"></i></button>
                                                    <button onClick={() => updateCartInFirebase(currentItemsRef.current.filter((_, i) => i !== index))} className="btn-bouncy w-8 h-8 bg-red-900 text-red-300 border border-red-700 flex items-center justify-center"><i className="fa-solid fa-trash-can"></i></button>
                                                </div>
                                            </div>
                                        )
                                    })
                                )}
                            </div>
                            
                            <div className="p-2 border-t border-[#15803d] bg-[#020604]">
                                <button onClick={() => setShowConfirmModal(true)} disabled={currentItems.length === 0 || isSaving} className="btn-bouncy w-full py-3 bg-[#22c55e] text-black font-tva text-xl tracking-widest border-2 border-black disabled:bg-gray-800 disabled:text-gray-500 disabled:border-gray-700 shadow-[2px_2px_0px_#15803d] disabled:shadow-none flex justify-center items-center gap-2">
                                    <i className="fa-solid fa-paper-plane"></i> ส่งข้อมูลเข้าระบบ
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const HistoryTab = ({ isActive, refreshTrigger }) => {
            const [selectedMonth, setSelectedMonth] = useState(new Date().toLocaleDateString('en-CA').substring(0, 7));
            const [summaryDate, setSummaryDate] = useState(new Date().toLocaleDateString('en-CA'));
            const [monthHistoryData, setMonthHistoryData] = useState([]);
            const [isLoadingHistory, setIsLoadingHistory] = useState(false);
            const [isExporting, setIsExporting] = useState(false);
            const [isFetchingSummary, setIsFetchingSummary] = useState(false); 
            const [alertMsg, setAlertMsg] = useState(null);
            
            const [showCopyModal, setShowCopyModal] = useState(false);
            const [lineMessageToCopy, setLineMessageToCopy] = useState('');
            const [lastFetchedMonth, setLastFetchedMonth] = useState(null);

            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (!isActive) return;

                const fetchHistory = async () => {
                    setIsLoadingHistory(true);
                    const cacheKey = `history_data_${selectedMonth}`;
                    try {
                        const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getHistory&month=${selectedMonth}`);
                        const text = await res.text();
                        if (text.trim().startsWith('<')) throw new Error("เซิร์ฟเวอร์ส่งกลับเป็นหน้า HTML");
                        const json = JSON.parse(text);
                        if (json.status === 'success' && json.data) {
                            setMonthHistoryData(json.data);
                            try { localStorage.setItem(cacheKey, JSON.stringify(json.data)); } catch(e){}
                        }
                    } catch (error) { 
                        try {
                            const cachedData = localStorage.getItem(cacheKey);
                            if (cachedData) { setMonthHistoryData(JSON.parse(cachedData)); }
                        } catch(e) {}
                    } finally { 
                        setIsLoadingHistory(false); 
                        setLastFetchedMonth(selectedMonth);
                    }
                };

                if (selectedMonth !== lastFetchedMonth || refreshTrigger > 0) {
                    const cacheKey = `history_data_${selectedMonth}`;
                    try {
                        const cachedData = localStorage.getItem(cacheKey);
                        if (cachedData && selectedMonth !== lastFetchedMonth) setMonthHistoryData(JSON.parse(cachedData));
                    } catch(e) {}
                    fetchHistory();
                }
            }, [isActive, selectedMonth, refreshTrigger]);

            const getMonthlyStats = () => {
                const year = parseInt(selectedMonth.split('-')[0]);
                const month = parseInt(selectedMonth.split('-')[1]);
                const daysInMonth = new Date(year, month, 0).getDate();
                
                const stats = Array.from({length: daysInMonth}, () => ({ 
                    morning:0, afternoon:0, evening:0, 
                    urgent:0, total:0, 
                    before1Day: 0, before2DaysPlus: 0, sameDay: 0, afterDue: 0,
                    evening_before1Day: 0, evening_before2Days: 0, evening_before3DaysPlus: 0, evening_afterDue: 0
                }));
                
                let totalMonthCount = 0;
                let todayTotal = 0, todayMorning = 0, todayAfternoon = 0, todayEvening = 0;
                const todayStr = new Date().toLocaleDateString('en-CA');

                monthHistoryData.forEach(item => {
                    const day = parseInt(item.date.split('-')[2]) - 1;
                    const count = Number(item.count) || 0;
                    
                    if (day >= 0 && day < daysInMonth) {
                        totalMonthCount += count;
                        stats[day].total += count;

                        const hour = parseInt(item.time.split(':')[0], 10);
                        if (hour < 12) stats[day].morning += count;
                        else if (hour < 18) stats[day].afternoon += count;
                        else stats[day].evening += count;

                        const scanDateObj = parseDateSafe(item.date);
                        const dueDateObj = parseDateSafe(item.dueDate);
                        
                        const diffTime = dueDateObj.getTime() - scanDateObj.getTime();
                        const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

                        if (hour < 18) {
                            if (diffDays === 1) stats[day].before1Day += count; 
                            else if (diffDays >= 2) stats[day].before2DaysPlus += count; 
                            else if (diffDays === 0) stats[day].sameDay += count;    
                            else if (diffDays < 0) stats[day].afterDue += count;   
                        } else {
                            if (diffDays === 1) stats[day].evening_before1Day += count;
                            else if (diffDays === 2) stats[day].evening_before2Days += count;
                            else if (diffDays >= 3) stats[day].evening_before3DaysPlus += count;
                            else if (diffDays < 0) stats[day].evening_afterDue += count;
                        }
                    }

                    if (item.date === todayStr) {
                        todayTotal += count;
                        const hour = parseInt(item.time.split(':')[0], 10);
                        if (hour < 12) todayMorning += count;
                        else if (hour < 18) todayAfternoon += count;
                        else todayEvening += count;
                    }
                });
                return { stats, daysInMonth, totalMonthCount, todayTotal, todayMorning, todayAfternoon, todayEvening };
            };

            const { stats, daysInMonth, totalMonthCount, todayTotal, todayMorning, todayAfternoon, todayEvening } = getMonthlyStats();

            useEffect(() => {
                if (!isActive || !chartRef.current || !window.Chart) return;
                if (chartInstance.current) chartInstance.current.destroy();
                
                const ctx = chartRef.current.getContext('2d');
                const labels = Array.from({length: daysInMonth}, (_, i) => i + 1);
                const dataTotals = stats.map(d => d.total);

                // เปลี่ยนสีกราฟเป็นสีเขียว TVA
                const gradient = ctx.createLinearGradient(0, 0, 0, 300);
                gradient.addColorStop(0, 'rgba(34, 197, 94, 0.8)');   
                gradient.addColorStop(1, 'rgba(34, 197, 94, 0.1)');   

                Chart.defaults.color = '#15803d'; // สีตัวอักษรแกน
                Chart.defaults.font.family = "'Space Mono', 'Prompt', monospace";

                chartInstance.current = new window.Chart(ctx, {
                    type: 'bar',
                    data: { labels: labels, datasets: [{ label: 'รวมเที่ยวส่ง', data: dataTotals, backgroundColor: gradient, borderColor: '#22c55e', borderWidth: 1, borderRadius: 0 }] },
                    options: { 
                        responsive: true, maintainAspectRatio: false, 
                        plugins: { legend: { display: false } }, 
                        scales: { 
                            y: { beginAtZero: true, ticks: { stepSize: 1 }, grid: { color: 'rgba(21,128,61,0.2)' } }, 
                            x: { grid: { display: false } } 
                        }, 
                        animation: { duration: 500 } 
                    }
                });
            }, [stats, isActive, daysInMonth]);

            const handleExportExcel = async () => {
                if (!window.ExcelJS) { setAlertMsg('ระบบสร้างไฟล์กำลังโหลด...'); return; }
                setIsExporting(true);
                try {
                    const workbook = new window.ExcelJS.Workbook();
                    const sheet = workbook.addWorksheet('สรุปยอดส่งบิล');
                    const year = parseInt(selectedMonth.split('-')[0]);
                    const month = parseInt(selectedMonth.split('-')[1]);
                    const thaiMonth = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"][month-1];
                    const thaiYear = year + 543;

                    const compHeader = ['วันที่'];
                    const compTotal = ['จำนวนเที่ยวทั้งหมด'];
                    const compBefore1Day = ['ส่งบิลก่อนวันนัดส่ง 1 วัน (งานด่วน)'];
                    const compBefore2DaysPlus = ['ส่งบิลก่อนดิวส่ง 2 วันขึ้นไป'];
                    const compSameDay = ['ส่งบิลในวันนัดส่ง'];
                    const compAfterDue = ['ส่งบิลหลังคิวส่ง (ล่าช้า)'];
                    const compEvening = ['ส่งบิลหลัง 18.00 น. (รวม)'];
                    const compEvening_b1 = ['    - ดิวส่งล่วงหน้า 1 วัน'];
                    const compEvening_b2 = ['    - ดิวส่งล่วงหน้า 2 วัน'];
                    const compEvening_b3p = ['    - ดิวส่งล่วงหน้า 3 วันขึ้นไป'];
                    const compEvening_after = ['    - ดิวส่งล่าช้า (หลังคิวส่ง)'];

                    let sumTotal=0, sumCompBefore1Day=0, sumCompBefore2DaysPlus=0, sumCompSameDay=0, sumCompAfterDue=0;
                    let sumEvening=0, sumCompEvening_b1=0, sumCompEvening_b2=0, sumCompEvening_b3p=0, sumCompEvening_after=0;

                    for(let i=0; i<daysInMonth; i++) {
                        compHeader.push(i+1);
                        compTotal.push(stats[i].total); sumTotal += stats[i].total;
                        compBefore1Day.push(stats[i].before1Day); sumCompBefore1Day += stats[i].before1Day;
                        compBefore2DaysPlus.push(stats[i].before2DaysPlus); sumCompBefore2DaysPlus += stats[i].before2DaysPlus;
                        compSameDay.push(stats[i].sameDay); sumCompSameDay += stats[i].sameDay;
                        compAfterDue.push(stats[i].afterDue); sumCompAfterDue += stats[i].afterDue;
                        compEvening.push(stats[i].evening); sumEvening += stats[i].evening;
                        compEvening_b1.push(stats[i].evening_before1Day); sumCompEvening_b1 += stats[i].evening_before1Day;
                        compEvening_b2.push(stats[i].evening_before2Days); sumCompEvening_b2 += stats[i].evening_before2Days;
                        compEvening_b3p.push(stats[i].evening_before3DaysPlus); sumCompEvening_b3p += stats[i].evening_before3DaysPlus;
                        compEvening_after.push(stats[i].evening_afterDue); sumCompEvening_after += stats[i].evening_afterDue;
                    }

                    compHeader.push('Total');
                    compTotal.push(sumTotal);
                    compBefore1Day.push(sumCompBefore1Day);
                    compBefore2DaysPlus.push(sumCompBefore2DaysPlus);
                    compSameDay.push(sumCompSameDay);
                    compAfterDue.push(sumCompAfterDue);
                    compEvening.push(sumEvening);
                    compEvening_b1.push(sumCompEvening_b1);
                    compEvening_b2.push(sumCompEvening_b2);
                    compEvening_b3p.push(sumCompEvening_b3p);
                    compEvening_after.push(sumCompEvening_after);

                    sheet.addRow([`เดือน ${thaiMonth} ${thaiYear}`]);
                    const titleCell = sheet.getCell('A1');
                    titleCell.font = { name: 'Angsana New', bold: true, size: 16 };
                    sheet.mergeCells('A1:C1');

                    const rComp1 = sheet.addRow(compHeader);
                    const rComp2 = sheet.addRow(compTotal);
                    const rComp3 = sheet.addRow(compBefore1Day); 
                    const rComp4 = sheet.addRow(compBefore2DaysPlus); 
                    const rComp5 = sheet.addRow(compSameDay);
                    const rComp6 = sheet.addRow(compAfterDue);
                    const rComp7 = sheet.addRow(compEvening);
                    const rComp7_1 = sheet.addRow(compEvening_b1);
                    const rComp7_2 = sheet.addRow(compEvening_b2);
                    const rComp7_3 = sheet.addRow(compEvening_b3p);
                    const rComp7_4 = sheet.addRow(compEvening_after);

                    const styleCompRow = (row, bgArgb, fontColorArgb, isBold = false) => {
                        row.eachCell((cell, colNumber) => {
                            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bgArgb } };
                            cell.font = { name: 'Angsana New', size: 12, color: { argb: fontColorArgb }, bold: isBold };
                            cell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
                            cell.alignment = { vertical: 'middle', horizontal: colNumber === 1 ? 'left' : 'center' };
                        });
                        const lastColNumber = daysInMonth + 2;
                        const lastCell = row.getCell(lastColNumber);
                        lastCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFF00' } };
                        lastCell.font = { name: 'Angsana New', size: 12, color: { argb: fontColorArgb }, bold: true };
                    };

                    rComp1.eachCell((cell, colNumber) => {
                        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFB4C6E7' } };
                        cell.font = { name: 'Angsana New', size: 12, color: { argb: 'FF000000' }, bold: true };
                        cell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
                        cell.alignment = { vertical: 'middle', horizontal: 'center' };
                    });

                    styleCompRow(rComp2, 'FFFFFFFF', 'FFFF0000', true); 
                    rComp2.getCell(1).font = { name: 'Angsana New', size: 12, color: { argb: 'FF000000' }, bold: true }; 

                    styleCompRow(rComp3, 'FFFFFFFF', 'FF000000');
                    styleCompRow(rComp4, 'FFFFFFFF', 'FF000000');
                    styleCompRow(rComp5, 'FFFFFFFF', 'FF000000');
                    styleCompRow(rComp6, 'FFFFFFFF', 'FF000000');

                    styleCompRow(rComp7, 'FFEFF6FF', 'FF1E40AF', true); 
                    styleCompRow(rComp7_1, 'FFFFFFFF', 'FF475569'); 
                    styleCompRow(rComp7_2, 'FFFFFFFF', 'FF475569');
                    styleCompRow(rComp7_3, 'FFFFFFFF', 'FF475569');
                    styleCompRow(rComp7_4, 'FFFFFFFF', 'FF475569');
                    
                    rComp7_1.getCell(1).alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
                    rComp7_2.getCell(1).alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
                    rComp7_3.getCell(1).alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
                    rComp7_4.getCell(1).alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };

                    sheet.getColumn(1).width = 40; 
                    for(let i=2; i<=daysInMonth+1; i++) sheet.getColumn(i).width = 5; 
                    sheet.getColumn(daysInMonth+2).width = 8;

                    const buffer = await workbook.xlsx.writeBuffer();
                    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    window.saveAs(blob, `สรุปยอดส่งบิล_${thaiMonth}_${thaiYear}.xlsx`);
                } catch (err) { setAlertMsg('เกิดข้อผิดพลาดในการสร้างไฟล์ Excel'); } finally { setIsExporting(false); }
            };

            const handleGetDailySummary = async () => {
                setIsFetchingSummary(true);
                try {
                    const targetDateStr = summaryDate || new Date().toLocaleDateString('en-CA');
                    const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getDailySummaryText&date=${targetDateStr}`);
                    const text = await response.text();
                    if (text.trim().startsWith('<')) { setAlertMsg("เซิร์ฟเวอร์ตอบกลับผิดพลาด"); return; }
                    
                    const result = JSON.parse(text);
                    if (result.status === 'success') {
                        setLineMessageToCopy(result.data);
                        setShowCopyModal(true);
                    } else { setAlertMsg("เกิดข้อผิดพลาดจากเซิร์ฟเวอร์"); }
                } catch (error) { setAlertMsg("ไม่สามารถดึงข้อมูลสรุปได้"); } finally { setIsFetchingSummary(false); }
            };

            const forceRefresh = () => {
                setLastFetchedMonth(null); 
            };

            return (
                <div className={`pt-2 px-2 pb-[100px] h-full flex flex-col space-y-4 ${isActive ? 'block' : 'hidden'} overflow-y-auto hide-scrollbar relative z-10`}>
                    
                    <CustomAlertModal message={alertMsg} onClose={() => setAlertMsg(null)} />

                    {showCopyModal && (
                        <div className="fixed inset-0 bg-black/80 z-[160] flex items-center justify-center p-4 transition-opacity animate-in fade-in duration-200">
                            <div className="bg-[#050a06] border-4 border-[#eab308] p-6 w-full max-w-sm shadow-[0_0_20px_rgba(234,179,8,0.3)]">
                                <div className="text-center mb-5 border-b-2 border-[#b45309] pb-3">
                                    <i className="fa-regular fa-copy text-3xl text-[#eab308] mb-2"></i>
                                    <h3 className="text-2xl font-bold text-[#eab308] font-tva tracking-widest">คัดลอกสรุปยอด</h3>
                                </div>
                                <div className="bg-black border-2 border-[#15803d] p-3 mb-6 max-h-[40vh] overflow-y-auto custom-scrollbar text-left">
                                    <pre className="text-xs text-[#22c55e] whitespace-pre-wrap font-crt leading-relaxed">{lineMessageToCopy}</pre>
                                </div>
                                <div className="flex gap-4">
                                    <button onClick={() => setShowCopyModal(false)} className="btn-bouncy flex-1 py-3 bg-transparent border-2 border-gray-600 text-gray-400 font-bold font-mono-tva shadow-[2px_2px_0px_#374151]">ปิด</button>
                                    <button onClick={() => handleCopyTextGlobal(lineMessageToCopy, () => setAlertMsg("คัดลอกข้อความสำเร็จ!"), () => setAlertMsg("ไม่สามารถคัดลอกได้"))} className="btn-bouncy flex-1 py-3 bg-[#eab308] text-black border-2 border-black font-bold font-mono-tva shadow-[2px_2px_0px_#854d0e] flex justify-center items-center gap-2"><i className="fa-solid fa-copy"></i> คัดลอก</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="border-2 border-[#15803d] bg-[#020604] p-3 shadow-[0_4px_0_rgba(0,0,0,0.5)] flex flex-col gap-3 font-mono-tva">
                        <div className="flex justify-between items-end border-b border-[#15803d] pb-2">
                            <div>
                                <label className="text-[10px] text-[#15803d] block mb-1">เลือกวันที่ดึงสรุปยอด</label>
                                <input type="date" value={summaryDate} onChange={(e) => setSummaryDate(e.target.value)} className="bg-transparent text-[#eab308] font-crt text-xl outline-none" />
                            </div>
                            <button onClick={handleGetDailySummary} disabled={isFetchingSummary} className="btn-bouncy px-4 py-2 bg-transparent border-2 border-[#eab308] text-[#eab308] font-bold text-xs flex items-center gap-2">
                                {isFetchingSummary ? <i className="fa-solid fa-circle-notch animate-spin"></i> : <i className="fa-solid fa-magic"></i>} ดึงข้อความ
                            </button>
                        </div>
                        <div className="flex justify-between items-end">
                            <div>
                                <label className="text-[10px] text-[#15803d] block mb-1">เลือกเดือนที่ต้องการ</label>
                                <input type="month" value={selectedMonth} onChange={(e) => setSelectedMonth(e.target.value)} className="bg-transparent text-[#22c55e] font-crt text-xl outline-none" />
                            </div>
                            <button onClick={handleExportExcel} disabled={isLoadingHistory || isExporting} className="btn-bouncy px-4 py-2 bg-[#15803d] text-black border-2 border-black font-bold text-xs flex items-center gap-2">
                                {isExporting ? <i className="fa-solid fa-circle-notch animate-spin"></i> : <i className="fa-solid fa-file-excel"></i>} โหลดไฟล์ Excel
                            </button>
                        </div>
                    </div>

                    <div className="relative border-2 border-[#15803d] bg-[#111812] p-4 text-center shadow-[0_4px_0_rgba(0,0,0,0.5)] overflow-hidden">
                        <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] opacity-10 pointer-events-none"></div>
                        <div className="relative z-10">
