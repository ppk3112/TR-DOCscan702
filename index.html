<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบจัดส่งเอกสาร</title>
    
    <meta name="apple-mobile-web-app-title" content="สแกนส่งบิล">
    <meta name="application-name" content="สแกนส่งบิล">
    
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/SxDzdXD5/79162.jpg">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/SxDzdXD5/79162.jpg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            margin: 0;
            padding-bottom: env(safe-area-inset-bottom);
            background-color: #f1f5f9;
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 1);
            box-shadow: 0 10px 30px -5px rgba(31, 38, 135, 0.15);
        }

        .glass-inner-border {
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 1);
            border-color: #a18cd1;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(161, 140, 209, 0.5); border-radius: 20px; }
        
        .btn-bouncy {
            transition: all 0.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .btn-bouncy:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="text-slate-800">
    <div id="root"></div>

    <script type="text/babel" data-presets="react,env">
        window.addEventListener('error', (event) => {
            document.getElementById('root').innerHTML = `
                <div style="padding: 20px; color: #b91c1c; font-family: 'Prompt', sans-serif; text-align: center; margin-top: 50px;">
                    <i class="fa-solid fa-triangle-exclamation" style="font-size: 50px; margin-bottom: 20px;"></i>
                    <h3 style="font-size: 20px; font-weight: bold; margin-bottom: 10px;">พบข้อผิดพลาดของระบบ</h3>
                    <p style="font-size: 14px; margin-bottom: 15px;">ระบบอาจโดนบล็อกการทำงาน หรือแคชมีปัญหา</p>
                    <pre style="text-align: left; background: #fee2e2; padding: 15px; border-radius: 10px; font-size: 12px; overflow-x: auto;">${event.message}</pre>
                    <button onclick="window.location.reload(true)" style="margin-top: 20px; padding: 12px 24px; background: #b91c1c; color: white; border: none; border-radius: 20px; font-family: 'Prompt';">โหลดใหม่</button>
                </div>
            `;
        });

        const { useState, useEffect, useRef, useCallback } = React;
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyYAYulOU-9KV7t4y08pz_GhicwWL2S9laTWsRkTqHvo5Fk_UIbGPF_EI0-kHzyY1P57A/exec';

        const firebaseConfig = {
            apiKey: "AIzaSyAbqUh6x0KiIL5rK3VhWc1ECE4R5X_gq2w",
            authDomain: "bill-pj.firebaseapp.com",
            databaseURL: "https://bill-pj-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bill-pj",
            storageBucket: "bill-pj.firebasestorage.app",
            messagingSenderId: "99092363681",
            appId: "1:99092363681:web:629ddf90c27a1d0db333e0"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        const CustomAlertModal = ({ message, onClose }) => {
            if (!message) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[200] flex items-center justify-center p-4 transition-opacity animate-in fade-in duration-200">
                    <div className="bg-white rounded-[2.5rem] p-8 w-full max-w-sm shadow-xl text-center glass-inner-border">
                        <div className="w-20 h-20 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-5">
                            <i className="fa-solid fa-circle-exclamation text-4xl"></i>
                        </div>
                        <h3 className="text-xl font-bold text-slate-800 mb-2">แจ้งเตือน</h3>
                        <p className="text-slate-600 font-medium mb-6 whitespace-pre-wrap">{message}</p>
                        <button onClick={onClose} className="btn-bouncy w-full py-4 bg-slate-800 text-white rounded-[1.5rem] font-bold text-lg shadow-sm">
                            ตกลง
                        </button>
                    </div>
                </div>
            );
        };

        const formatThaiDate = (dateString) => {
            const d = new Date(dateString);
            if (isNaN(d.getTime())) return dateString;
            return new Intl.DateTimeFormat('th-TH', { year: 'numeric', month: 'short', day: 'numeric' }).format(d);
        };

        const checkIsUrgent = (dateStr) => {
            if (!dateStr) return false;
            const targetDate = new Date(dateStr); targetDate.setHours(0, 0, 0, 0);
            const today = new Date(); today.setHours(0, 0, 0, 0);
            const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
            return targetDate.getTime() <= tomorrow.getTime();
        };

        const playBeep = () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime);
                gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.connect(gainNode); gainNode.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            } catch (e) {}
        };

        const playDuplicateVoice = () => {
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance('บิลซ้ำค่ะ');
                    utterance.lang = 'th-TH'; 
                    const voices = window.speechSynthesis.getVoices();
                    const thaiVoice = voices.find(voice => voice.lang.includes('th'));
                    if (thaiVoice) utterance.voice = thaiVoice;
                    utterance.pitch = 1.3; utterance.rate = 1.0;
                    window.speechSynthesis.speak(utterance);
                }
            } catch (e) {}
        };

        const handleCopyTextGlobal = (text, onSuccess, onError) => {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try { document.execCommand('copy'); if (onSuccess) onSuccess(); } catch (err) { if (onError) onError(); }
            document.body.removeChild(textArea);
        };

        const ScannerTab = ({ isActive, userProfile, onSaveSuccess }) => {
            const [currentItems, setCurrentItems] = useState([]);
            
            const [inputValue, setInputValue] = useState('');
            const [dueDate, setDueDate] = useState(() => {
                const now = new Date(); now.setDate(now.getDate() + 2);
                return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            });
            
            const [deliveryType, setDeliveryType] = useState('DC');
            const [deliveryZone, setDeliveryZone] = useState('NORMAL'); 
            const [showZoneDropdown, setShowZoneDropdown] = useState(false); 
            
            const [allSentCodesCache, setAllSentCodesCache] = useState(new Set());
            const [duplicateWarning, setDuplicateWarning] = useState(null);
            const [alertMsg, setAlertMsg] = useState(null); 
            
            const [isScanning, setIsScanning] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [saveSuccess, setSaveSuccess] = useState(false);
            const [isFlashlightOn, setIsFlashlightOn] = useState(false);

            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [showClearConfirmModal, setShowClearConfirmModal] = useState(false);
            const [showCopyModal, setShowCopyModal] = useState(false);
            const [lineMessageToCopy, setLineMessageToCopy] = useState('');
            const [lastSavedMessage, setLastSavedMessage] = useState(() => {
                try { return localStorage.getItem('last_saved_message') || ''; } catch (e) { return ''; }
            });
            
            const [editingIndex, setEditingIndex] = useState(null);
            const [editDueDate, setEditDueDate] = useState('');
            const [editIsFactory, setEditIsFactory] = useState(false);
            const [editIsUpcountry, setEditIsUpcountry] = useState(false); 
            const [editRemark, setEditRemark] = useState(''); 

            const [showUrgencyModal, setShowUrgencyModal] = useState(false);
            const [pendingItem, setPendingItem] = useState(null);

            const html5QrCodeRef = useRef(null);
            const scanningTimeoutRef = useRef(null);
            const dueDateRef = useRef(dueDate);
            const deliveryTypeRef = useRef(deliveryType);
            const deliveryZoneRef = useRef(deliveryZone);
            const currentItemsRef = useRef(currentItems);
            const allSentCodesCacheRef = useRef(allSentCodesCache);
            const showUrgencyModalRef = useRef(false);
            const isProcessingRef = useRef(false);

            useEffect(() => { dueDateRef.current = dueDate; }, [dueDate]);
            useEffect(() => { deliveryTypeRef.current = deliveryType; }, [deliveryType]);
            useEffect(() => { deliveryZoneRef.current = deliveryZone; }, [deliveryZone]);
            useEffect(() => { currentItemsRef.current = currentItems; }, [currentItems]);
            useEffect(() => { allSentCodesCacheRef.current = allSentCodesCache; }, [allSentCodesCache]);
            useEffect(() => { showUrgencyModalRef.current = showUrgencyModal; }, [showUrgencyModal]);

            // ✅ FIX #2: Promise-based Firebase update + Realtime sync
            const updateCartInFirebase = useCallback((newItems) => {
                if (userProfile && userProfile.userId) {
                    return new Promise((resolve) => {
                        database.ref('carts/' + userProfile.userId).set(newItems, (error) => {
                            if (!error) {
                                console.log('Firebase update success');
                            }
                            resolve();
                        });
                    });
                }
                return Promise.resolve();
            }, [userProfile]);

            // ✅ Realtime sync from Firebase
            useEffect(() => {
                if (userProfile && userProfile.userId) {
                    const cartRef = database.ref('carts/' + userProfile.userId);
                    cartRef.on('value', (snapshot) => {
                        const data = snapshot.val();
                        setCurrentItems(Array.isArray(data) ? data : []);
                    });
                    return () => cartRef.off();
                } else {
                    setCurrentItems([]);
                }
            }, [userProfile]);

            useEffect(() => {
                const fetchAllCodes = async () => {
                    try {
                        const cachedCodes = localStorage.getItem('all_sent_codes_backup');
                        if (cachedCodes) setAllSentCodesCache(new Set(JSON.parse(cachedCodes)));
                    } catch(e) {}
                    try {
                        const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getAllCodes`);
                        const text = await res.text();
                        if (text.trim().startsWith('<')) return;
                        const json = JSON.parse(text);
                        if (json.status === 'success' && json.data) {
                            const uppercaseCodes = json.data.map(code => String(code).trim().toUpperCase());
                            setAllSentCodesCache(new Set(uppercaseCodes));
                            try { localStorage.setItem('all_sent_codes_backup', JSON.stringify(uppercaseCodes)); } catch(e) {}
                        }
                    } catch (e) {}
                };
                fetchAllCodes();
                return () => { if (html5QrCodeRef.current && isScanning) html5QrCodeRef.current.stop().catch(() => {}); }
            }, []);

            // ✅ FIX #4 & #5: Enhanced duplicate check with sent-codes
            const checkDuplicate = (code) => {
                const cleanCode = String(code).trim().toUpperCase(); 
                if (currentItemsRef.current.some(item => String(item.code).trim().toUpperCase() === cleanCode)) {
                    playDuplicateVoice();
                    setDuplicateWarning(`บิล ${cleanCode} สแกนไปแล้วในตะกร้า!`);
                    setTimeout(() => setDuplicateWarning(null), 5000); 
                    return true;
                }
                if (allSentCodesCacheRef.current.has(cleanCode)) {
                    playDuplicateVoice();
                    setDuplicateWarning(`บิล ${cleanCode} เคยถูกส่งไปแล้วในระบบ!`);
                    setTimeout(() => setDuplicateWarning(null), 5000); 
                    return true;
                }
                return false;
            };

            // ✅ FIX #1 & #3: Debounced processing with isProcessing flag
            const processNewItem = async (finalCode, itemDueDate) => {
                if (isProcessingRef.current) return;
                
                if (checkDuplicate(finalCode)) return;
                
                isProcessingRef.current = true;
                
                try {
                    if (checkIsUrgent(itemDueDate)) {
                        setPendingItem({ code: finalCode, dueDate: itemDueDate });
                        setShowUrgencyModal(true);
                    } else {
                        playBeep();
                        const newItems = [{ code: finalCode, dueDate: itemDueDate, urgencyTag: null, remark: '' }, ...currentItemsRef.current];
                        await updateCartInFirebase(newItems);
                    }
                } finally {
                    isProcessingRef.current = false;
                    // ✅ FIX #1: Reset after proper delay
                    if (scanningTimeoutRef.current) clearTimeout(scanningTimeoutRef.current);
                    scanningTimeoutRef.current = setTimeout(() => {
                        isProcessingRef.current = false;
                    }, 800);
                }
            };

            const handleConfirmUrgency = async (tag) => {
                if (pendingItem) {
                    playBeep();
                    const newItems = [{ ...pendingItem, urgencyTag: tag, remark: '' }, ...currentItemsRef.current];
                    await updateCartInFirebase(newItems);
                }
                setShowUrgencyModal(false);
                setPendingItem(null);
                isProcessingRef.current = false;
            };

            const handleTypeToggle = (type) => {
                if (deliveryType === type) setShowZoneDropdown(!showZoneDropdown);
                else { setDeliveryType(type); setDeliveryZone('NORMAL'); setShowZoneDropdown(false); }
            };

            const startScanner = async () => {
                if (!window.Html5Qrcode) { setAlertMsg('ระบบสแกนกำลังโหลด...'); return; }
                const isLineApp = navigator.userAgent.indexOf("Line") > -1;
                if (isLineApp) { setAlertMsg("ตรวจพบการใช้งานผ่านแอป LINE\nกรุณากดไอคอน '3 จุด' แล้วเลือก 'เปิดในเบราว์เซอร์'"); return; }

                setIsScanning(true);
                isProcessingRef.current = false;
                
                setTimeout(() => {
                    try {
                        const html5QrCode = new window.Html5Qrcode("reader");
                        html5QrCodeRef.current = html5QrCode;
                        const config = {
                            fps: 15,
                            qrbox: (vw, vh) => ({ width: Math.min(300, vw * 0.8), height: 200 }),
                            aspectRatio: 1.0, 
                            experimentalFeatures: { useBarCodeDetectorIfSupported: true }
                        };

                        html5QrCode.start(
                            { facingMode: "environment" }, config,
                            (decodedText) => {
                                if (showUrgencyModalRef.current || isProcessingRef.current) return;
                                
                                let rawCode = decodedText.trim();
                                const yy = String(new Date().getFullYear()).slice(-2);
                                
                                if (rawCode.length !== 10 || !rawCode.startsWith(yy)) {
                                    setAlertMsg(`บาร์โค้ดไม่ถูกต้อง!\nต้องมี 10 หลัก และขึ้นต้นด้วยปี ${yy}`);
                                    return;
                                }

                                let finalCode = deliveryTypeRef.current === 'FACTORY' ? `${rawCode}(รับโรงตัด)` : rawCode;
                                if (deliveryZoneRef.current === 'UPCOUNTRY') finalCode += '(ตจว.)';
                                
                                processNewItem(finalCode, dueDateRef.current);
                            }, 
                            (err) => {}
                        ).catch((err) => { 
                            setIsScanning(false); 
                            setAlertMsg("ไม่สามารถเปิดกล้องได้\n" + err.message); 
                        });
                    } catch (e) {
                        setIsScanning(false);
                        setAlertMsg("เกิดข้อผิดพลาด: " + e.message);
                    }
                }, 300);
            };

            const stopScanner = () => {
                if (html5QrCodeRef.current) {
                    html5QrCodeRef.current.stop().then(() => {
                        html5QrCodeRef.current.clear(); 
                        setIsScanning(false); 
                        setIsFlashlightOn(false);
                        isProcessingRef.current = false;
                    }).catch(() => {
                        setIsScanning(false);
                        isProcessingRef.current = false;
                    });
                } else {
                    setIsScanning(false);
                    isProcessingRef.current = false;
                }
            };

            const toggleFlashlight = async () => {
                if (html5QrCodeRef.current && isScanning) {
                    try {
                        const newState = !isFlashlightOn;
                        await html5QrCodeRef.current.applyVideoConstraints({ advanced: [{ torch: newState }] });
                        setIsFlashlightOn(newState);
                    } catch (error) { setAlertMsg("อุปกรณ์ไม่รองรับไฟฉายผ่านเว็บ"); }
                }
            };

            const handleManualAdd = (e) => {
                e.preventDefault();
                if (isProcessingRef.current) return;
                
                let val = inputValue.trim();
                if (!val) return;

                if (val.length !== 4 && val.length !== 10) {
                    setAlertMsg("กรุณาพิมพ์เลขเที่ยว 4 หลัก หรือ 10 หลัก เท่านั้นครับ");
                    return;
                }
                
                const now = new Date();
                const yy = String(now.getFullYear()).slice(-2);
                
                if (val.length === 10 && !val.startsWith(yy)) {
                    setAlertMsg(`เลขบิล 10 หลักต้องขึ้นต้นด้วยปีปัจจุบัน (${yy}) เท่านั้นครับ`);
                    return;
                }

                if (val.length === 4) {
                    const mm = String(now.getMonth() + 1).padStart(2, '0');
                    val = `${yy}${mm}00${val}`; 
                }

                let finalCode = deliveryType === 'FACTORY' ? `${val}(รับโรงตัด)` : val;
                if (deliveryZone === 'UPCOUNTRY') finalCode += '(ตจว.)';
                
                processNewItem(finalCode, dueDate);
                setInputValue('');
            };

            const saveEditItem = async () => {
                if (editingIndex === null) return;
                const newItems = [...currentItemsRef.current];
                let baseCode = newItems[editingIndex].code.replace('(รับโรงตัด)', '').replace('(ตจว.)', '').trim();
                
                let finalCode = editIsFactory ? `${baseCode}(รับโรงตัด)` : baseCode;
                if (editIsUpcountry) finalCode += '(ตจว.)';
                
                const isDuplicate = newItems.some((item, idx) => idx !== editingIndex && String(item.code).trim().toUpperCase() === finalCode.toUpperCase());
                
                if (isDuplicate) { 
                    playDuplicateVoice();
                    setDuplicateWarning(`แก้ประเภทไม่ได้! บิลนี้มีอยู่ในตะกร้าแล้ว`);
                    setTimeout(() => setDuplicateWarning(null), 5000); 
                    return; 
                }

                // ✅ FIX #4: Check against sent codes too
                const cleanCode = finalCode.trim().toUpperCase();
                if (allSentCodesCacheRef.current.has(cleanCode)) {
                    playDuplicateVoice();
                    setDuplicateWarning(`ไม่สามารถแก้ไข! บิลนี้เคยถูกส่งแล้ว`);
                    setTimeout(() => setDuplicateWarning(null), 5000);
                    return;
                }

                const existingTag = newItems[editingIndex].urgencyTag || null;
                newItems[editingIndex] = { ...newItems[editingIndex], code: finalCode, dueDate: editDueDate, urgencyTag: existingTag, remark: editRemark.trim() };
                
                await updateCartInFirebase(newItems);
                setEditingIndex(null);
            };

            // ✅ FIX #7: Submit lock mechanism
            const executeSaveBatch = async () => {
                if (currentItemsRef.current.length === 0) return;
                if (isSaving) return;
                
                setIsSaving(true); 
                setSaveSuccess(false);

                const now = new Date();
                const currentDateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                const currentTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

                const newBatch = {
                    id: "BATCH-" + Date.now().toString().slice(-6),
                    items: [...currentItemsRef.current], 
                    date: currentDateStr, 
                    time: currentTimeStr, 
                    dueDate: dueDate, 
                    timestamp: now.getTime(),
                    userId: userProfile ? userProfile.userId : null
                };

                try {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(newBatch)
                    });

                    const text = await response.text();
                    if (text.trim().startsWith('<')) { 
                        setAlertMsg("เซิร์ฟเวอร์ตอบกลับผิดพลาด (URL อาจหมดอายุ)"); 
                        setIsSaving(false);
                        return;
                    }

                    const result = JSON.parse(text);
                    if (result.status === 'error') {
                        if (result.message === 'DUPLICATE_FOUND') { 
                            setAlertMsg(`ตรวจพบการซ้ำซ้อนในฐานข้อมูล!\nบิลเลขที่: ${result.duplicateCodes || ''}`);
                        } else { 
                            setAlertMsg("เกิดข้อผิดพลาด: " + result.message); 
                        }
                        setIsSaving(false); 
                        return; 
                    }

                    await updateCartInFirebase([]); 
                    try { localStorage.removeItem('delivery_basket'); } catch(e) {}
                    setSaveSuccess(true);
                    
                    if (window.confetti) {
                        confetti({
                            particleCount: 150, spread: 80, origin: { y: 0.6 },
                            colors: ['#a18cd1', '#fbc2eb', '#ff9a9e', '#fecfef', '#ffffff', '#22d3ee', '#10b981']
                        });
                    }
                    
                    if (result.lineMessage) {

                            <div className="flex-1 w-full">
                                <h4 className="text-base font-bold text-indigo-800 flex items-center gap-2">
                                    <i className="fa-solid fa-clock-rotate-left"></i> ข้อความแจ้งเตือนล่าสุด
                                </h4>
                                <p className="text-xs text-slate-500 mt-1 truncate max-w-[250px] sm:max-w-md">กดเพื่อดูสรุปข้อความที่ส่งเข้า</p>
                            </div>
                            <button onClick={() => { setLineMessageToCopy(lastSavedMessage); setShowCopyModal(true); }} className="btn-bouncy w-full sm:w-auto px-6 py-3.5 bg-gradient-to-r from-blue-50 to-indigo-50 text-indigo-600 rounded-[2rem] font-semibold border border-indigo-200 hover:bg-indigo-50 shadow-sm">
                                <i className="fa-solid fa-copy mr-1"></i> ดูข้อความ / คัดลอก
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        // History Tab component (partial - focusing on Scanner fixes first)
        const HistoryTab = ({ isActive, refreshTrigger }) => {
            return (
                <div className={`pt-6 px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto space-y-6 ${isActive ? 'block' : 'hidden'}`}>
                    <div className="glass-card p-8 rounded-[2.5rem] text-center">
                        <i className="fa-solid fa-chart-bar text-5xl text-slate-400 mb-4"></i>
                        <p className="text-slate-600 font-semibold">โหลดข้อมูลประวัติ...</p>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('scanner');
            const [userProfile, setUserProfile] = useState(null);
            const [refreshTrigger, setRefreshTrigger] = useState(0);

            useEffect(() => {
                const initLineSDK = async () => {
                    try {
                        if (typeof window !== 'undefined' && window.liff) {
                            const liffId = "1666903949-O4j3NwG2";
                            await window.liff.init({ liffId });
                            if (window.liff.isLoggedIn()) {
                                const profile = await window.liff.getProfile();
                                setUserProfile({ userId: profile.userId, displayName: profile.displayName });
                            } else {
                                window.liff.login();
                            }
                        }
                    } catch (e) {
                        console.error('LINE SDK error:', e);
                        setUserProfile({ userId: 'guest-' + Date.now(), displayName: 'Guest' });
                    }
                };
                initLineSDK();
            }, []);

            const handleSaveSuccess = () => {
                setRefreshTrigger(prev => prev + 1);
            };

            if (!userProfile) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-600">
                        <div className="text-center text-white">
                            <div className="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-6 backdrop-blur-md">
                                <i className="fa-solid fa-gear text-4xl animate-spin"></i>
                            </div>
                            <p className="text-xl font-semibold">กำลังโหลดระบบ...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100">
                    <div className="sticky top-0 z-40 backdrop-blur-md bg-white/50 border-b border-white/20">
                        <div className="max-w-4xl mx-auto px-4 py-4">
                            <div className="flex justify-between items-center mb-4">
                                <h1 className="text-2xl font-bold text-slate-800">📦 สแกนส่งบิล</h1>
                                <div className="text-sm text-slate-600 font-semibold">{userProfile.displayName}</div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setActiveTab('scanner')} className={`btn-bouncy px-6 py-3 rounded-[1.5rem] font-semibold transition-all ${activeTab === 'scanner' ? 'bg-gradient-to-r from-indigo-500 to-purple-500 text-white shadow-lg' : 'bg-white text-slate-600 border border-slate-200'}`}>
                                    <i className="fa-solid fa-camera mr-2"></i>สแกน
                                </button>
                                <button onClick={() => setActiveTab('history')} className={`btn-bouncy px-6 py-3 rounded-[1.5rem] font-semibold transition-all ${activeTab === 'history' ? 'bg-gradient-to-r from-indigo-500 to-purple-500 text-white shadow-lg' : 'bg-white text-slate-600 border border-slate-200'}`}>
                                    <i className="fa-solid fa-history mr-2"></i>ประวัติ
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="pb-10">
                        <ScannerTab isActive={activeTab === 'scanner'} userProfile={userProfile} onSaveSuccess={handleSaveSuccess} />
                        <HistoryTab isActive={activeTab === 'history'} refreshTrigger={refreshTrigger} />
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
