<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบจัดส่งเอกสาร</title>
    
    <meta name="apple-mobile-web-app-title" content="สแกนส่งบิล">
    <meta name="application-name" content="สแกนส่งบิล">
    
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/SxDzdXD5/79162.jpg">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/SxDzdXD5/79162.jpg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <!-- 🟢 เพิ่ม Firebase SDK ผ่าน CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ฟอนต์ธีม TVA -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=VT323&family=Space+Mono:wght@400;700&family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* TVA Color Palette (Dark Theme) */
            --tva-bg: #0c0a09;         
            --tva-card: #1c1714;       
            --tva-orange: #d96a29;     
            --tva-orange-dim: #9c4919; 
            --tva-cream: #f0e6d3;      
            --tva-green: #22c55e;      
            --tva-border: #3b322a;     
        }

        body { 
            font-family: 'Prompt', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            margin: 0;
            background-color: var(--tva-bg); 
            color: var(--tva-cream);
            min-height: 100vh;
            padding-bottom: calc(env(safe-area-inset-bottom) + 80px); /* รองรับขอบจอด้านล่างและ Floating Dock */
        }

        /* Fonts */
        .font-tva { font-family: 'Anton', 'Prompt', sans-serif; letter-spacing: 0.05em; }
        .font-mono-tva { font-family: 'Space Mono', 'Prompt', monospace; }
        .font-crt { font-family: 'VT323', 'Prompt', monospace; }

        /* Brutalist UI Components */
        .tva-box {
            background: var(--tva-card);
            border: 2px solid var(--tva-border);
            border-radius: 6px;
        }

        .tva-box-accent {
            background: var(--tva-card);
            border: 2px solid var(--tva-orange);
            border-radius: 6px;
        }

        .tva-input {
            background: #26201c;
            border: 2px solid var(--tva-border);
            color: var(--tva-cream);
            outline: none;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .tva-input:focus {
            border-color: var(--tva-orange);
            background: #1c1714;
        }
        .tva-input::placeholder { color: #5a4f46; }

        /* Mechanical Buttons */
        .tva-btn {
            background: var(--tva-orange);
            color: #110e0c;
            border: 2px solid #110e0c;
            box-shadow: 0px 4px 0px var(--tva-orange-dim);
            border-radius: 6px;
            font-weight: bold;
            transition: all 0.1s;
        }
        .tva-btn:active {
            transform: translateY(4px);
            box-shadow: 0px 0px 0px var(--tva-orange-dim);
        }
        .tva-btn:disabled {
            background: #3b322a;
            color: #5a4f46;
            box-shadow: 0px 4px 0px #1c1714;
        }

        .tva-btn-outline {
            background: transparent;
            color: var(--tva-orange);
            border: 2px solid var(--tva-orange);
            border-radius: 6px;
            font-weight: bold;
            transition: all 0.1s;
        }
        .tva-btn-outline.active {
            background: var(--tva-orange);
            color: #110e0c;
        }
        .tva-btn-outline:active {
            transform: scale(0.97);
        }

        /* Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #110e0c; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: var(--tva-border); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: var(--tva-orange); }

        /* Calendar Icon in Date Input */
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="month"]::-webkit-calendar-picker-indicator {
            filter: invert(0.7) sepia(0.8) saturate(5) hue-rotate(340deg) brightness(0.9);
            cursor: pointer;
        }

        /* Yggdrasil Animation */
        @keyframes yggdrasil-pulse {
            0% { opacity: 0.8; filter: brightness(1); }
            50% { opacity: 1; filter: brightness(1.2); }
            100% { opacity: 0.8; filter: brightness(1); }
        }
        .animate-yggdrasil {
            animation: yggdrasil-pulse 4s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react,env">
        window.addEventListener('error', (event) => {
            document.getElementById('root').innerHTML = `
                <div style="padding: 20px; color: #d96a29; font-family: 'Prompt', sans-serif; text-align: center; margin-top: 50px;">
                    <i class="fa-solid fa-triangle-exclamation" style="font-size: 50px; margin-bottom: 20px;"></i>
                    <h3 style="font-size: 20px; font-weight: bold; margin-bottom: 10px;">พบข้อผิดพลาดของระบบ</h3>
                    <p style="font-size: 14px; margin-bottom: 15px;">ระบบอาจโดนบล็อกการทำงาน หรือแคชมีปัญหา</p>
                    <pre style="text-align: left; background: #1c1714; padding: 15px; font-size: 12px; overflow-x: auto; color: #ef4444; border: 1px solid #d96a29; border-radius: 4px;">${event.message}</pre>
                    <button onclick="window.location.reload(true)" style="margin-top: 20px; padding: 12px 24px; background: #d96a29; color: black; border: none; font-family: 'Prompt'; font-weight: bold; border-radius: 4px;">รีเฟรชหน้าเว็บ</button>
                </div>
            `;
        });

        const { useState, useEffect, useRef, useCallback } = React;
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyYAYulOU-9KV7t4y08pz_GhicwWL2S9laTWsRkTqHvo5Fk_UIbGPF_EI0-kHzyY1P57A/exec';

        const firebaseConfig = {
            apiKey: "AIzaSyAbqUh6x0KiIL5rK3VhWc1ECE4R5X_gq2w",
            authDomain: "bill-pj.firebaseapp.com",
            databaseURL: "https://bill-pj-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bill-pj",
            storageBucket: "bill-pj.firebasestorage.app",
            messagingSenderId: "99092363681",
            appId: "1:99092363681:web:629ddf90c27a1d0db333e0"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        const CustomAlertModal = ({ message, onClose }) => {
            if (!message) return null;
            return (
                <div className="fixed inset-0 bg-black/80 z-[200] flex items-center justify-center p-4">
                    <div className="tva-box-accent p-6 w-full max-w-sm text-center bg-[#1c1714]">
                        <div className="w-16 h-16 border-2 border-[#d96a29] text-[#d96a29] flex items-center justify-center mx-auto mb-5 rounded-sm">
                            <i className="fa-solid fa-circle-exclamation text-3xl animate-pulse"></i>
                        </div>
                        <h3 className="text-xl font-bold font-tva text-[#d96a29] tracking-widest mb-2">แจ้งเตือน</h3>
                        <p className="text-[#f0e6d3] font-mono-tva mb-6 whitespace-pre-wrap">{message}</p>
                        <button onClick={onClose} className="tva-btn w-full py-3 font-tva text-xl tracking-widest">
                            ตกลง
                        </button>
                    </div>
                </div>
            );
        };

        const parseDateSafe = (dateString) => {
            if (!dateString) return new Date();
            if (dateString.includes('-')) {
                const [y, m, d] = dateString.split('-');
                return new Date(parseInt(y, 10), parseInt(m, 10) - 1, parseInt(d, 10));
            }
            return new Date(dateString);
        };

        const formatThaiDate = (dateString) => {
            const d = parseDateSafe(dateString);
            if (isNaN(d.getTime())) return dateString;
            return new Intl.DateTimeFormat('th-TH', { year: 'numeric', month: 'short', day: 'numeric' }).format(d);
        };

        const checkIsUrgent = (dateStr) => {
            if (!dateStr) return false;
            const targetDate = parseDateSafe(dateStr); 
            targetDate.setHours(0, 0, 0, 0);
            const today = new Date(); 
            today.setHours(0, 0, 0, 0);
            const tomorrow = new Date(today); 
            tomorrow.setDate(today.getDate() + 1);
            return targetDate.getTime() <= tomorrow.getTime();
        };

        const playBeep = () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();
                osc.type = 'square'; osc.frequency.setValueAtTime(600, ctx.currentTime);
                gainNode.gain.setValueAtTime(0.05, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.connect(gainNode); gainNode.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            } catch (e) {}
        };

        const playDuplicateVoice = () => {
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance('บิลซ้ำค่ะ');
                    utterance.lang = 'th-TH'; 
                    const voices = window.speechSynthesis.getVoices();
                    const thaiVoice = voices.find(voice => voice.lang.includes('th'));
                    if (thaiVoice) utterance.voice = thaiVoice;
                    utterance.pitch = 0.8; utterance.rate = 1.0;
                    window.speechSynthesis.speak(utterance);
                }
            } catch (e) {}
        };

        const handleCopyTextGlobal = async (text, onSuccess, onError) => {
            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(text);
                    if (onSuccess) onSuccess();
                    return;
                } catch (err) {
                    console.warn("Clipboard API failed, falling back to execCommand");
                }
            }
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed"; 
            textArea.style.top = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try { 
                document.execCommand('copy'); 
                if (onSuccess) onSuccess(); 
            } catch (err) { 
                if (onError) onError(); 
            }
            document.body.removeChild(textArea);
        };

        const ScannerTab = ({ isActive, userProfile, onSaveSuccess }) => {
            const [currentItems, setCurrentItems] = useState([]);
            
            const [inputValue, setInputValue] = useState('');
            const [dueDate, setDueDate] = useState(() => {
                const now = new Date(); now.setDate(now.getDate() + 2);
                return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            });
            
            const [deliveryType, setDeliveryType] = useState('DC');
            const [deliveryZone, setDeliveryZone] = useState('NORMAL'); 
            const [showZoneDropdown, setShowZoneDropdown] = useState(false); 
            
            const [allSentCodesCache, setAllSentCodesCache] = useState(new Set());
            const [duplicateWarning, setDuplicateWarning] = useState(null);
            const [alertMsg, setAlertMsg] = useState(null); 
            
            const [isScanning, setIsScanning] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [saveSuccess, setSaveSuccess] = useState(false);
            const [isFlashlightOn, setIsFlashlightOn] = useState(false);

            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [showClearConfirmModal, setShowClearConfirmModal] = useState(false);
            const [showCopyModal, setShowCopyModal] = useState(false);
            const [lineMessageToCopy, setLineMessageToCopy] = useState('');
            const [lastSavedMessage, setLastSavedMessage] = useState(() => {
                try { return localStorage.getItem('last_saved_message') || ''; } catch (e) { return ''; }
            });
            
            const [editingIndex, setEditingIndex] = useState(null);
            const [editDueDate, setEditDueDate] = useState('');
            const [editIsFactory, setEditIsFactory] = useState(false);
            const [editIsUpcountry, setEditIsUpcountry] = useState(false); 
            const [editRemark, setEditRemark] = useState(''); 

            const [showUrgencyModal, setShowUrgencyModal] = useState(false);
            const [pendingItem, setPendingItem] = useState(null);

            const html5QrCodeRef = useRef(null);
            const lastScannedRef = useRef(null);
            const dueDateRef = useRef(dueDate);
            const deliveryTypeRef = useRef(deliveryType);
            const deliveryZoneRef = useRef(deliveryZone);
            const currentItemsRef = useRef(currentItems);
            const allSentCodesCacheRef = useRef(allSentCodesCache);
            const showUrgencyModalRef = useRef(false);

            useEffect(() => { dueDateRef.current = dueDate; }, [dueDate]);
            useEffect(() => { deliveryTypeRef.current = deliveryType; }, [deliveryType]);
            useEffect(() => { deliveryZoneRef.current = deliveryZone; }, [deliveryZone]);
            useEffect(() => { currentItemsRef.current = currentItems; }, [currentItems]);
            useEffect(() => { allSentCodesCacheRef.current = allSentCodesCache; }, [allSentCodesCache]);
            useEffect(() => { showUrgencyModalRef.current = showUrgencyModal; }, [showUrgencyModal]);

            const updateCartInFirebase = (newItems) => {
                if (userProfile && userProfile.userId) {
                    database.ref('carts/' + userProfile.userId).set(newItems);
                }
            };

            useEffect(() => {
                if (userProfile && userProfile.userId) {
                    const cartRef = database.ref('carts/' + userProfile.userId);
                    cartRef.on('value', (snapshot) => {
                        const data = snapshot.val();
                        setCurrentItems(data || []);
                    });
                    return () => cartRef.off();
                } else {
                    setCurrentItems([]);
                }
            }, [userProfile]);

            useEffect(() => {
                const fetchAllCodes = async () => {
                    try {
                        const cachedCodes = localStorage.getItem('all_sent_codes_backup');
                        if (cachedCodes) setAllSentCodesCache(new Set(JSON.parse(cachedCodes)));
                    } catch(e) {}
                    try {
                        const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getAllCodes`);
                        const text = await res.text();
                        if (text.trim().startsWith('<')) return;
                        const json = JSON.parse(text);
                        if (json.status === 'success' && json.data) {
                            const uppercaseCodes = json.data.map(code => String(code).trim().toUpperCase());
                            setAllSentCodesCache(new Set(uppercaseCodes));
                            try { 
                                const slicedCache = uppercaseCodes.slice(-10000); 
                                localStorage.setItem('all_sent_codes_backup', JSON.stringify(slicedCache)); 
                            } catch(e) {}
                        }
                    } catch (e) {}
                };
                fetchAllCodes();
                return () => { if (html5QrCodeRef.current && isScanning) html5QrCodeRef.current.stop().catch(() => {}); }
            }, []);

            const checkDuplicate = useCallback((code) => {
                const cleanCode = String(code).trim().toUpperCase(); 
                if (currentItemsRef.current.some(item => String(item.code).trim().toUpperCase() === cleanCode)) {
                    playDuplicateVoice();
                    setDuplicateWarning(`บิล ${cleanCode} สแกนไปแล้วในตะกร้า!`);
                    setTimeout(() => setDuplicateWarning(null), 5000); 
                    return true;
                }
                if (allSentCodesCacheRef.current.has(cleanCode)) {
                    playDuplicateVoice();
                    setDuplicateWarning(`บิล ${cleanCode} เคยถูกส่งไปแล้วในระบบ!`);
                    setTimeout(() => setDuplicateWarning(null), 5000); 
                    return true;
                }
                return false;
            }, []);

            const processNewItem = (finalCode, itemDueDate) => {
                if (checkDuplicate(finalCode)) return;
                if (checkIsUrgent(itemDueDate)) {
                    setPendingItem({ code: finalCode, dueDate: itemDueDate });
                    setShowUrgencyModal(true);
                } else {
                    playBeep();
                    const newItems = [{ code: finalCode, dueDate: itemDueDate, urgencyTag: null, remark: '' }, ...currentItemsRef.current];
                    updateCartInFirebase(newItems);
                }
            };

            const handleConfirmUrgency = (tag) => {
                if (pendingItem) {
                    playBeep();
                    const newItems = [{ ...pendingItem, urgencyTag: tag, remark: '' }, ...currentItemsRef.current];
                    updateCartInFirebase(newItems);
                }
                setShowUrgencyModal(false);
                setPendingItem(null);
            };

            const handleTypeToggle = (type) => {
                if (deliveryType === type) setShowZoneDropdown(!showZoneDropdown);
                else { setDeliveryType(type); setDeliveryZone('NORMAL'); setShowZoneDropdown(false); }
            };

            const startScanner = async () => {
                if (!window.Html5Qrcode) { setAlertMsg('ระบบสแกนกำลังโหลด...'); return; }
                const isLineApp = navigator.userAgent.indexOf("Line") > -1;
                if (isLineApp) setAlertMsg("ตรวจพบการใช้งานผ่านแอป LINE\nกรุณากดไอคอน '3 จุด' แล้วเลือก 'เปิดใน Safari / Browser'");

                try {
                    const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
                    tempCtx.resume();
                    if ('speechSynthesis' in window) {
                        const utterance = new SpeechSynthesisUtterance('');
                        utterance.volume = 0;
                        window.speechSynthesis.speak(utterance);
                    }
                } catch(e) {}

                setIsScanning(true);
                setTimeout(() => {
                    const html5QrCode = new window.Html5Qrcode("reader");
                    html5QrCodeRef.current = html5QrCode;
                    const config = {
                        fps: 10,
                        qrbox: (vw, vh) => ({ width: Math.min(250, vw * 0.8), height: 150 }),
                        aspectRatio: 1.0, 
                        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
                    };

                    html5QrCode.start(
                        { facingMode: "environment" }, config,
                        (decodedText) => {
                            if (showUrgencyModalRef.current) return;
                            if (lastScannedRef.current !== decodedText) {
                                lastScannedRef.current = decodedText;
                                
                                let rawCode = decodedText.trim();
                                const yy = String(new Date().getFullYear()).slice(-2);
                                
                                if (rawCode.length !== 10 || !rawCode.startsWith(yy)) {
                                    setAlertMsg(`บาร์โค้ดไม่ถูกต้อง!\nต้องมี 10 หลัก และขึ้นต้นด้วยปี ${yy} เท่านั้น\n(คุณสแกนได้: ${rawCode})`);
                                    setTimeout(() => { lastScannedRef.current = null }, 3000);
                                    return;
                                }

                                let finalCode = deliveryTypeRef.current === 'FACTORY' ? `${rawCode}(รับโรงตัด)` : rawCode;
                                if (deliveryZoneRef.current === 'UPCOUNTRY') finalCode += '(ตจว.)';
                                processNewItem(finalCode, dueDateRef.current);
                                setTimeout(() => { lastScannedRef.current = null }, 1500);
                            }
                        }, 
                        (err) => {}
                    ).catch((err) => { setIsScanning(false); setAlertMsg("ไม่สามารถเปิดกล้องได้"); });
                }, 300);
            };

            const stopScanner = () => {
                if (html5QrCodeRef.current) {
                    html5QrCodeRef.current.stop().then(() => {
                        html5QrCodeRef.current.clear(); 
                        setIsScanning(false); setIsFlashlightOn(false);
                    }).catch(() => setIsScanning(false));
                } else setIsScanning(false);
            };

            const toggleFlashlight = async () => {
                if (html5QrCodeRef.current && isScanning) {
                    try {
                        const newState = !isFlashlightOn;
                        await html5QrCodeRef.current.applyVideoConstraints({ advanced: [{ torch: newState }] });
                        setIsFlashlightOn(newState);
                    } catch (error) { setAlertMsg("อุปกรณ์ไม่รองรับไฟฉายผ่านเว็บ"); }
                }
            };

            const handleManualAdd = (e) => {
                e.preventDefault();
                let val = inputValue.trim();
                if (!val) return;

                if (val.length !== 4 && val.length !== 10) {
                    setAlertMsg("กรุณาพิมพ์เลขเที่ยว 4 หลัก หรือ 10 หลัก เท่านั้นครับ");
                    return;
                }
                
                const now = new Date();
                const yy = String(now.getFullYear()).slice(-2);
                
                if (val.length === 10 && !val.startsWith(yy)) {
                    setAlertMsg(`เลขบิล 10 หลักต้องขึ้นต้นด้วยปีปัจจุบัน (${yy}) เท่านั้นครับ`);
                    return;
                }

                if (val.length === 4) {
                    const mm = String(now.getMonth() + 1).padStart(2, '0');
                    val = `${yy}${mm}00${val}`; 
                }

                let finalCode = deliveryType === 'FACTORY' ? `${val}(รับโรงตัด)` : val;
                if (deliveryZone === 'UPCOUNTRY') finalCode += '(ตจว.)';
                processNewItem(finalCode, dueDate);
                setInputValue('');
            };

            const saveEditItem = () => {
                if (editingIndex === null) return;
                const newItems = [...currentItemsRef.current];
                let baseCode = newItems[editingIndex].code.replace('(รับโรงตัด)', '').replace('(ตจว.)', '').trim();
                
                let finalCode = editIsFactory ? `${baseCode}(รับโรงตัด)` : baseCode;
                if (editIsUpcountry) finalCode += '(ตจว.)';
                
                const upperFinalCode = finalCode.toUpperCase();
                const isDuplicateInCart = newItems.some((item, idx) => idx !== editingIndex && String(item.code).trim().toUpperCase() === upperFinalCode);
                const isDuplicateInHistory = allSentCodesCacheRef.current.has(upperFinalCode);
                
                if (isDuplicateInCart || isDuplicateInHistory) { 
                    playDuplicateVoice();
                    setDuplicateWarning(`แก้ไขไม่ได้! บิลนี้ซ้ำกับในระบบหรือในตะกร้าแล้ว`);
                    setTimeout(() => setDuplicateWarning(null), 5000); 
                    return; 
                }

                const existingTag = newItems[editingIndex].urgencyTag || null;
                newItems[editingIndex] = { ...newItems[editingIndex], code: finalCode, dueDate: editDueDate, urgencyTag: existingTag, remark: editRemark.trim() };
                
                updateCartInFirebase(newItems);
                setEditingIndex(null);
            };

            const executeSaveBatch = async () => {
                if (currentItemsRef.current.length === 0) return;
                setIsSaving(true); setSaveSuccess(false);

                const now = new Date();
                const currentDateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                const currentTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

                const newBatch = {
                    id: "BATCH-" + Date.now().toString().slice(-6),
                    items: [...currentItemsRef.current], date: currentDateStr, time: currentTimeStr, 
                    dueDate: dueDate, timestamp: now.getTime(),
                    userId: userProfile ? userProfile.userId : null
                };

                try {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(newBatch)
                    });

                    const text = await response.text();
                    if (text.trim().startsWith('<')) { setAlertMsg("เซิร์ฟเวอร์ตอบกลับผิดพลาด (URL อาจหมดอายุ)"); setIsSaving(false); return; }

                    const result = JSON.parse(text);
                    if (result.status === 'error') {
                        if (result.message === 'DUPLICATE_FOUND') { setAlertMsg(`ตรวจพบการซ้ำซ้อนในฐานข้อมูล!\nบิลเลขที่: ${result.duplicateCode}`); } 
                        else { setAlertMsg("เกิดข้อผิดพลาด: " + result.message); }
                        setIsSaving(false); return; 
                    }

                    updateCartInFirebase([]); 
                    try { localStorage.removeItem('delivery_basket'); } catch(e) {}
                    setSaveSuccess(true);
                    
                    if (window.confetti) {
                        confetti({
                            particleCount: 150, spread: 80, origin: { y: 0.6 },
                            colors: ['#d96a29', '#22c55e', '#f0e6d3', '#110e0c']
                        });
                    }
                    
                    if (result.lineMessage) {
                        setLineMessageToCopy(result.lineMessage);
                        setLastSavedMessage(result.lineMessage); 
                        try { localStorage.setItem('last_saved_message', result.lineMessage); } catch(e) {}
                        setTimeout(() => { setShowCopyModal(true); }, 1500); 
                    }
                    
                    onSaveSuccess();
                    
                    const newCodesSet = new Set(allSentCodesCache);
                    newBatch.items.forEach(item => newCodesSet.add(item.code.trim().toUpperCase()));
                    setAllSentCodesCache(newCodesSet);
                    try {
                        const updatedArray = Array.from(newCodesSet).slice(-10000);
                        localStorage.setItem('all_sent_codes_backup', JSON.stringify(updatedArray));
                    } catch(e) {}

                    setTimeout(() => setSaveSuccess(false), 3000);
                } catch (error) { 
                    setAlertMsg(`การเชื่อมต่อล้มเหลว`); 
                } finally { 
                    setIsSaving(false); 
                }
            };

            return (
                <div className={`pt-4 px-4 pb-6 w-full max-w-2xl mx-auto ${isActive ? 'block' : 'hidden'}`}>
                    <CustomAlertModal message={alertMsg} onClose={() => setAlertMsg(null)} />

                    {saveSuccess && (
                        <div className="fixed inset-0 bg-black/80 z-[150] flex flex-col items-center justify-center">
                            <div className="tva-box-accent p-8 text-center bg-[#1c1714]">
                                <i className="fa-solid fa-check-circle text-6xl text-[#22c55e] mb-4"></i>
                                <h2 className="font-tva text-3xl text-[#22c55e] mb-2 tracking-widest">สำเร็จ!</h2>
                                <p className="font-mono-tva text-[#f0e6d3] font-bold">ข้อมูลถูกส่งเข้าระบบเรียบร้อย</p>
                            </div>
                        </div>
                    )}

                    {duplicateWarning && (
                        <div className="fixed top-4 left-4 right-4 z-[110] bg-[#d96a29] text-[#110e0c] p-4 flex items-center gap-3 font-mono-tva font-bold shadow-[0px_4px_0px_#9c4919] border-2 border-[#110e0c] rounded-md max-w-5xl mx-auto">
                            <i className="fa-solid fa-triangle-exclamation text-xl"></i>
                            <div className="flex-1 text-sm uppercase leading-tight">{duplicateWarning}</div>
                        </div>
                    )}

                    {showUrgencyModal && pendingItem && (
                        <div className="fixed inset-0 bg-black/80 z-[160] flex items-center justify-center p-4">
                            <div className="tva-box-accent p-6 w-full max-w-sm bg-[#1c1714]">
                                <div className="text-center mb-6">
                                    <i className="fa-solid fa-triangle-exclamation text-5xl text-[#d96a29] mb-3"></i>
                                    <h3 className="text-xl font-bold font-mono-tva text-[#d96a29]">ระบุสาเหตุงานด่วน</h3>
                                    <p className="text-2xl font-bold text-[#f0e6d3] mt-2 font-crt">{pendingItem.code}</p>
                                </div>
                                <div className="flex flex-col gap-3 mb-5 font-mono-tva">
                                    <button onClick={() => handleConfirmUrgency('ด่วนมาก')} className="tva-btn-outline py-3 flex items-center justify-center gap-2">
                                        <i className="fa-solid fa-fire text-lg"></i> ด่วนมาก
                                    </button>
                                    <button onClick={() => handleConfirmUrgency('ขายพึ่งลง TMS')} className="tva-btn-outline py-3 flex items-center justify-center gap-2">
                                        <i className="fa-solid fa-clock-rotate-left text-lg"></i> ขายพึ่งลง TMS
                                    </button>
                                </div>
                                <button onClick={() => { setShowUrgencyModal(false); setPendingItem(null); }} className="w-full py-3 bg-[#26201c] border-2 border-[#3b322a] text-[#a89b8d] font-bold font-mono-tva rounded-md active:bg-[#3b322a]">
                                    ยกเลิก (ไม่เพิ่มบิลนี้)
                                </button>
                            </div>
                        </div>
                    )}

                    {showCopyModal && (
                        <div className="fixed inset-0 bg-black/80 z-[160] flex items-center justify-center p-4">
                            <div className="tva-box-accent p-6 w-full max-w-sm bg-[#1c1714]">
                                <div className="text-center mb-5 border-b-2 border-[#3b322a] pb-4">
                                    <i className="fa-regular fa-copy text-4xl text-[#d96a29] mb-2"></i>
                                    <h3 className="text-2xl font-bold font-tva text-[#d96a29] tracking-widest">คัดลอกข้อความ</h3>
                                </div>
                                <div className="bg-[#110e0c] border-2 border-[#3b322a] p-4 mb-6 max-h-[40vh] overflow-y-auto custom-scrollbar text-left rounded-md">
                                    <pre className="text-xs text-[#22c55e] font-crt whitespace-pre-wrap leading-relaxed">{lineMessageToCopy}</pre>
                                </div>
                                <div className="flex gap-4 font-mono-tva">
                                    <button onClick={() => setShowCopyModal(false)} className="w-full py-3 bg-[#26201c] border-2 border-[#3b322a] text-[#a89b8d] font-bold rounded-md active:bg-[#3b322a]">ปิดหน้าต่าง</button>
                                    <button onClick={() => handleCopyTextGlobal(lineMessageToCopy, () => setAlertMsg("คัดลอกข้อความสำเร็จ!"), () => setAlertMsg("ไม่สามารถคัดลอกได้"))} className="tva-btn w-full py-3 flex justify-center items-center gap-2"><i className="fa-solid fa-copy"></i> คัดลอกเลย</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showClearConfirmModal && (
                        <div className="fixed inset-0 bg-black/80 z-[160] flex items-center justify-center p-4">
                            <div className="tva-box p-6 w-full max-w-sm border-[#ef4444] shadow-[0px_4px_0px_#991b1b]">
                                <div className="text-center mb-6">
                                    <i className="fa-solid fa-trash-can text-5xl text-[#ef4444] mb-4"></i>
                                    <h3 className="text-2xl font-bold font-tva text-[#ef4444] tracking-widest">ล้างตะกร้า?</h3>
                                    <p className="text-sm font-mono-tva text-[#f0e6d3] mt-2">ข้อมูลที่สแกนมาจะหายหมดเลยนะ</p>
                                </div>
                                <div className="flex gap-4 font-mono-tva font-bold">
                                    <button onClick={() => setShowClearConfirmModal(false)} className="w-full py-3 bg-[#26201c] border-2 border-[#3b322a] text-[#a89b8d] rounded-md active:bg-[#3b322a]">เปลี่ยนใจ</button>
                                    <button onClick={() => { updateCartInFirebase([]); setShowClearConfirmModal(false); }} className="w-full py-3 bg-[#ef4444] border-2 border-[#110e0c] shadow-[0px_4px_0px_#991b1b] text-white rounded-md active:translate-y-1 active:shadow-none">ล้างทั้งหมด</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {editingIndex !== null && (
                        <div className="fixed inset-0 bg-black/90 z-[160] flex items-center justify-center p-4">
                            <div className="tva-box-accent p-6 w-full max-w-sm bg-[#1c1714]">
                                <div className="flex justify-between items-center mb-4 border-b-2 border-[#3b322a] pb-3">
                                    <h3 className="text-xl font-bold font-tva text-[#d96a29] tracking-widest flex items-center gap-2"><i className="fa-solid fa-pen-to-square"></i> แก้ไขบิล</h3>
                                    <button onClick={() => setEditingIndex(null)} className="text-[#a89b8d] hover:text-[#f0e6d3]"><i className="fa-solid fa-xmark text-2xl"></i></button>
                                </div>
                                <div className="space-y-4 mb-6 font-mono-tva">
                                    <div>
                                        <label className="text-sm font-bold text-[#d96a29] mb-1.5 block">> ประเภทการรับ_</label>
                                        <div className="flex gap-2">
                                            <button type="button" onClick={() => setEditIsFactory(false)} className={`flex-1 py-3 text-sm font-bold border-2 rounded-md ${!editIsFactory ? 'bg-[#d96a29] text-[#110e0c] border-[#d96a29]' : 'bg-[#26201c] text-[#a89b8d] border-[#3b322a]'}`}><i className="fa-solid fa-warehouse mr-1"></i> DC</button>
                                            <button type="button" onClick={() => setEditIsFactory(true)} className={`flex-1 py-3 text-sm font-bold border-2 rounded-md ${editIsFactory ? 'bg-[#d96a29] text-[#110e0c] border-[#d96a29]' : 'bg-[#26201c] text-[#a89b8d] border-[#3b322a]'}`}><i className="fa-solid fa-scissors mr-1"></i> โรงตัด</button>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-sm font-bold text-[#d96a29] mb-1.5 block">> โซนพื้นที่_</label>
                                        <div className="flex gap-2">
                                            <button type="button" onClick={() => setEditIsUpcountry(false)} className={`flex-1 py-3 text-sm font-bold border-2 rounded-md ${!editIsUpcountry ? 'bg-[#d96a29] text-[#110e0c] border-[#d96a29]' : 'bg-[#26201c] text-[#a89b8d] border-[#3b322a]'}`}>พื้นที่ปกติ</button>
                                            <button type="button" onClick={() => setEditIsUpcountry(true)} className={`flex-1 py-3 text-sm font-bold border-2 rounded-md ${editIsUpcountry ? 'bg-[#d96a29] text-[#110e0c] border-[#d96a29]' : 'bg-[#26201c] text-[#a89b8d] border-[#3b322a]'}`}><i className="fa-solid fa-truck-fast mr-1"></i> ตจว.</button>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-sm font-bold text-[#d96a29] mb-1.5 block">> วันที่กำหนดส่ง_</label>
                                        <input type="date" value={editDueDate} onChange={(e) => setEditDueDate(e.target.value)} className="w-full px-4 py-3 tva-input font-crt text-lg text-center" />
                                    </div>
                                    <div>
                                        <label className="text-sm font-bold text-[#d96a29] mb-1.5 block">> หมายเหตุ (ถ้ามี)_</label>
                                        <input type="text" value={editRemark} onChange={(e) => setEditRemark(e.target.value)} placeholder="เช่น ลูกค้าขอรับเช้า, ลังแตก" className="w-full px-4 py-3 tva-input text-sm" />
                                    </div>
                                </div>
                                <button onClick={saveEditItem} className="tva-btn w-full py-4 font-tva text-xl tracking-widest">บันทึกการแก้ไข</button>
                            </div>
                        </div>
                    )}

                    {showConfirmModal && (
                        <div className="fixed inset-0 bg-black/80 z-[160] flex items-center justify-center p-4">
                            <div className="tva-box-accent p-6 w-full max-w-sm bg-[#1c1714]">
                                <div className="text-center mb-6">
                                    <i className="fa-solid fa-paper-plane text-5xl text-[#d96a29] mb-4"></i>
                                    <h3 className="text-2xl font-bold font-tva text-[#d96a29] tracking-widest">ส่งข้อมูล?</h3>
                                    <p className="text-sm font-mono-tva text-[#f0e6d3] mt-2">จำนวนทั้งหมด <span className="font-bold text-[#22c55e] text-xl mx-1 font-crt">{currentItems.length}</span> เที่ยว</p>
                                </div>
                                <div className="flex gap-4 font-mono-tva font-bold">
                                    <button onClick={() => setShowConfirmModal(false)} className="w-full py-3 bg-[#26201c] border-2 border-[#3b322a] text-[#a89b8d] rounded-md active:bg-[#3b322a]">ไว้ก่อน</button>
                                    <button onClick={() => { setShowConfirmModal(false); executeSaveBatch(); }} className="tva-btn w-full py-3 text-[#110e0c]">ยืนยันการส่ง</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 🟢 Responsive Grid (จัดเรียงเป็นคอลัมน์เดียวสำหรับแบ่งครึ่งจอ) */}
                    <div className="flex flex-col gap-6 items-start">
                        
                        {/* ส่วนสแกนและตั้งค่า */}
                        <div className="w-full flex flex-col gap-5">
                            <div className="tva-box p-5 space-y-5">
                                {isScanning ? (
                                    <div className="relative border-2 border-[#d96a29] bg-black h-[260px] rounded-md overflow-hidden flex items-center justify-center">
                                        <div id="reader" className="w-full h-full"></div>
                                        <div className="absolute inset-0 border-[4px] border-[#d96a29] pointer-events-none opacity-40 flex justify-center items-center">
                                            <div className="w-[75%] h-[60%] border-2 border-dashed border-[#22c55e]"></div>
                                        </div>
                                        <button onClick={stopScanner} className="absolute top-3 right-3 bg-red-600 text-white w-10 h-10 border-2 border-[#110e0c] rounded-md shadow-[0px_2px_0px_#110e0c] z-10 flex items-center justify-center active:translate-y-1 active:shadow-none"><i className="fa-solid fa-xmark text-xl"></i></button>
                                        <button onClick={toggleFlashlight} className={`absolute top-3 left-3 w-10 h-10 border-2 border-[#110e0c] rounded-md shadow-[0px_2px_0px_#110e0c] z-10 flex items-center justify-center active:translate-y-1 active:shadow-none ${isFlashlightOn ? 'bg-yellow-400 text-black' : 'bg-[#26201c] text-[#a89b8d]'}`}><i className="fa-solid fa-bolt text-xl"></i></button>
                                    </div>
                                ) : (
                                    <div className="flex flex-col gap-4">
                                        <button onClick={startScanner} className="tva-btn w-full h-[110px] font-tva text-3xl flex items-center justify-center gap-3">
                                            <i className="fa-solid fa-camera"></i> สแกนบิล
                                        </button>
                                        <form onSubmit={handleManualAdd} className="flex gap-2">
                                            <div className="flex-1 relative">
                                                <span className="absolute left-4 top-1/2 -translate-y-1/2 text-[#d96a29] font-bold text-xl">{'>'}</span>
                                                <input type="text" value={inputValue} onChange={(e) => setInputValue(e.target.value)} placeholder="พิมพ์เลขบิล 4 หรือ 10 หลัก..." className="w-full pl-10 pr-4 py-4 tva-input font-crt text-xl h-[56px]" />
                                            </div>
                                            <button type="submit" className="tva-btn w-[56px] h-[56px] text-xl flex items-center justify-center"><i className="fa-solid fa-plus font-bold"></i></button>
                                        </form>
                                    </div>
                                )}

                                <div className="h-px bg-[#3b322a]"></div>

                                <div className="relative font-mono-tva">
                                    <div className="flex gap-2">
                                        <button onClick={() => handleTypeToggle('DC')} className={`flex-1 py-4 text-sm font-bold border-2 rounded-md flex justify-center items-center gap-2 transition-colors ${deliveryType === 'DC' ? 'bg-[#d96a29] border-[#d96a29] text-[#110e0c]' : 'bg-transparent border-[#d96a29] text-[#d96a29]'}`}>
                                            <i className="fa-solid fa-warehouse"></i> รับ DC {deliveryType === 'DC' && deliveryZone === 'UPCOUNTRY' && '(ตจว.)'}
                                            {deliveryType === 'DC' && <i className={`fa-solid fa-chevron-down text-[10px] transition-transform ${showZoneDropdown ? 'rotate-180' : ''}`}></i>}
                                        </button>
                                        <button onClick={() => handleTypeToggle('FACTORY')} className={`flex-1 py-4 text-sm font-bold border-2 rounded-md flex justify-center items-center gap-2 transition-colors ${deliveryType === 'FACTORY' ? 'bg-[#d96a29] border-[#d96a29] text-[#110e0c]' : 'bg-transparent border-[#d96a29] text-[#d96a29]'}`}>
                                            <i className="fa-solid fa-scissors"></i> โรงตัด {deliveryType === 'FACTORY' && deliveryZone === 'UPCOUNTRY' && '(ตจว.)'}
                                            {deliveryType === 'FACTORY' && <i className={`fa-solid fa-chevron-down text-[10px] transition-transform ${showZoneDropdown ? 'rotate-180' : ''}`}></i>}
                                        </button>
                                    </div>

                                    {showZoneDropdown && (
                                        <div className="absolute top-full left-0 right-0 mt-2 p-2 bg-[#1c1714] border-2 border-[#d96a29] rounded-md z-20 flex gap-2 shadow-[0px_4px_0px_rgba(0,0,0,0.5)]">
                                            <button onClick={() => { setDeliveryZone('NORMAL'); setShowZoneDropdown(false); }} className={`flex-1 py-3 text-sm font-bold border-2 rounded-md transition-colors ${deliveryZone === 'NORMAL' ? 'bg-[#f59e0b] text-[#110e0c] border-[#f59e0b]' : 'bg-[#26201c] text-[#a89b8d] border-[#3b322a]'}`}>พื้นที่ปกติ</button>
                                            <button onClick={() => { setDeliveryZone('UPCOUNTRY'); setShowZoneDropdown(false); }} className={`flex-1 py-3 text-sm font-bold border-2 rounded-md transition-colors ${deliveryZone === 'UPCOUNTRY' ? 'bg-[#8b5cf6] text-white border-[#8b5cf6]' : 'bg-[#26201c] text-[#a89b8d] border-[#3b322a]'}`}><i className="fa-solid fa-truck-fast mr-1"></i> งาน ตจว.</button>

                                </div>

                                <div className={`relative p-1 border-2 rounded-md transition-colors ${checkIsUrgent(dueDate) ? 'border-red-500 bg-red-950/30' : 'border-[#3b322a]'}`}>
                                    {checkIsUrgent(dueDate) && <span className="absolute -top-3 right-4 bg-red-600 text-white text-[10px] px-2 py-0.5 font-bold z-10 border border-[#110e0c] uppercase font-mono-tva"><i className="fa-solid fa-bolt"></i> ด่วนพิเศษ</span>}
                                    <input type="date" required value={dueDate} onChange={(e) => setDueDate(e.target.value)} className={`w-full px-4 py-3 bg-transparent outline-none font-crt text-xl text-center ${checkIsUrgent(dueDate) ? 'text-red-400' : 'text-[#f0e6d3]'}`} />
                                </div>
                            </div>
                        </div>

                        {/* ตะกร้าบิล */}
                        <div className="w-full flex flex-col gap-5">
                            <div className="tva-box flex flex-col min-h-0">
                                <div className="flex justify-between items-center p-4 bg-[#3b322a] border-b-2 border-[#1c1714]">
                                    <span className="font-tva tracking-widest text-lg text-[#f0e6d3] flex items-center gap-2"><i className="fa-solid fa-box-open text-[#d96a29]"></i> ตะกร้าบิล</span>
                                    <div className="flex items-center gap-2 font-mono-tva font-bold">
                                        {currentItems.length > 0 && <button onClick={() => setShowClearConfirmModal(true)} className="text-red-400 bg-[#1c1714] border border-[#ef4444] text-[10px] px-3 py-1.5 rounded-md active:bg-red-900"><i className="fa-solid fa-trash-can mr-1"></i> ล้าง</button>}
                                        <span className="bg-[#1c1714] border border-[#d96a29] text-[#d96a29] px-3 py-1.5 font-crt text-sm rounded-md">{currentItems.length} เที่ยว</span>

                                <div className="h-[320px] lg:h-[450px] overflow-y-auto custom-scrollbar p-3 space-y-3 relative bg-[#14110f]">

                                            const isFactory = item.code.includes('(รับโรงตัด)');
                                            const isUpcountry = item.code.includes('(ตจว.)');
                                            
                                            return (
                                                <div key={index} className={`border-l-4 p-3 flex justify-between bg-[#1c1714] rounded-md border-y border-r border-[#3b322a] ${isUrgent ? 'border-l-red-500' : 'border-l-[#d96a29]'}`}>
