                                                    <div className="flex flex-col justify-center overflow-hidden">
                                                        <span className={`font-crt text-2xl tracking-wider font-bold ${isFactory ? 'text-amber-600' : 'text-slate-800'}`}>{item.code}</span>
                                                        <span className="text-[10px] font-mono-tva font-bold mt-1.5 flex flex-wrap gap-1.5 text-slate-600">
                                                            <span className="border border-slate-200 bg-white px-2 py-0.5 rounded-full flex items-center">ดิว: {formatThaiDate(item.dueDate)}</span> 
                                                            
                                                            {item.urgencyTag === 'ด่วนมาก' && <span className="text-red-600 border border-red-200 bg-red-50 px-2 py-0.5 rounded-full flex items-center"><i className="fa-solid fa-fire mr-1"></i> ด่วนมาก</span>}
                                                            {item.urgencyTag === 'ขายพึ่งลง TMS' && <span className="text-amber-700 border border-amber-200 bg-amber-50 px-2 py-0.5 rounded-full flex items-center"><i className="fa-solid fa-clock-rotate-left mr-1"></i> ขายพึ่งลง TMS</span>}
                                                            {!item.urgencyTag && isUrgent && <span className="text-red-600 border border-red-200 bg-red-50 px-2 py-0.5 rounded-full flex items-center"><i className="fa-solid fa-bolt"></i></span>}
                                                            
                                                            {isUpcountry && <span className="text-purple-600 border border-purple-200 bg-purple-50 px-2 py-0.5 rounded-full flex items-center"><i className="fa-solid fa-truck-fast mr-1"></i> ตจว.</span>}
                                                            {item.remark && <span className="text-amber-700 border border-amber-200 bg-amber-50 px-2 py-0.5 rounded-full truncate max-w-[120px] flex items-center"><i className="fa-solid fa-pen text-[9px] mr-1"></i> {item.remark}</span>}
                                                        </span>
                                                    </div>
                                                    <div className="flex gap-2 items-center shrink-0 ml-2">
                                                        <button onClick={() => { setEditingIndex(index); setEditDueDate(item.dueDate); setEditIsFactory(isFactory); setEditIsUpcountry(isUpcountry); setEditRemark(item.remark || ''); }} className="w-10 h-10 bg-slate-50 border border-slate-200 text-slate-500 flex items-center justify-center rounded-full hover:bg-white active:scale-95 transition-all shadow-sm"><i className="fa-solid fa-pen-to-square"></i></button>
                                                        <button onClick={() => updateCartInFirebase(currentItemsRef.current.filter((_, i) => i !== index))} className="w-10 h-10 bg-red-50 border border-red-200 text-red-500 flex items-center justify-center rounded-full hover:bg-red-100 active:scale-95 transition-all shadow-sm"><i className="fa-solid fa-trash-can"></i></button>
                                                    </div>
                                                </div>
                                            )
                                        })
                                    )}
                                </div>
                                <div className="p-4 border-t border-white/60 bg-white/50 backdrop-blur-md">
                                    <button onClick={() => setShowConfirmModal(true)} disabled={currentItems.length === 0 || isSaving} className="glass-btn-primary w-full py-4 font-tva text-xl tracking-widest flex justify-center items-center gap-3">
                                        <i className="fa-solid fa-paper-plane"></i> ส่งข้อมูลเข้าระบบ
                                    </button>
                                </div>
                            </div>

                            {lastSavedMessage && (
                                <div className="liquid-glass p-5 flex flex-col gap-3">
                                    <div className="flex items-center gap-2 text-green-600 font-mono-tva font-bold text-sm">
                                        <i className="fa-solid fa-clock-rotate-left"></i> ข้อความแจ้งเตือนล่าสุด
                                    </div>
                                    <p className="text-xs text-slate-600 font-mono-tva truncate">กดเพื่อดูสรุปข้อความที่ส่งเข้าระบบครั้งล่าสุด</p>
                                    <button onClick={() => { setLineMessageToCopy(lastSavedMessage); setShowCopyModal(true); }} className="glass-btn w-full py-3 font-mono-tva font-bold text-sm flex items-center justify-center gap-2">
                                        <i className="fa-solid fa-copy"></i> ดูข้อความ / คัดลอก
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const HistoryTab = ({ isActive, refreshTrigger }) => {
            const [selectedMonth, setSelectedMonth] = useState(new Date().toLocaleDateString('en-CA').substring(0, 7));
            const [summaryDate, setSummaryDate] = useState(new Date().toLocaleDateString('en-CA'));
            const [monthHistoryData, setMonthHistoryData] = useState([]);
            const [isLoadingHistory, setIsLoadingHistory] = useState(false);
            const [isExporting, setIsExporting] = useState(false);
            const [isFetchingSummary, setIsFetchingSummary] = useState(false); 
            const [alertMsg, setAlertMsg] = useState(null);
            
            const [showCopyModal, setShowCopyModal] = useState(false);
            const [lineMessageToCopy, setLineMessageToCopy] = useState('');
            const [lastFetchedMonth, setLastFetchedMonth] = useState(null);

            useEffect(() => {
                if (!isActive) return;

                const fetchHistory = async () => {
                    setIsLoadingHistory(true);
                    const cacheKey = `history_data_${selectedMonth}`;
                    try {
                        const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getHistory&month=${selectedMonth}`);
                        const text = await res.text();
                        if (text.trim().startsWith('<')) throw new Error("เซิร์ฟเวอร์ส่งกลับเป็นหน้า HTML");
                        const json = JSON.parse(text);
                        if (json.status === 'success' && json.data) {
                            setMonthHistoryData(json.data);
                            try { localStorage.setItem(cacheKey, JSON.stringify(json.data)); } catch(e){}
                        }
                    } catch (error) { 
                        try {
                            const cachedData = localStorage.getItem(cacheKey);
                            if (cachedData) { setMonthHistoryData(JSON.parse(cachedData)); }
                        } catch(e) {}
                    } finally { 
                        setIsLoadingHistory(false); 
                        setLastFetchedMonth(selectedMonth);
                    }
                };

                if (selectedMonth !== lastFetchedMonth || refreshTrigger > 0) {
                    const cacheKey = `history_data_${selectedMonth}`;
                    try {
                        const cachedData = localStorage.getItem(cacheKey);
                        if (cachedData && selectedMonth !== lastFetchedMonth) setMonthHistoryData(JSON.parse(cachedData));
                    } catch(e) {}
                    fetchHistory();
                }
            }, [isActive, selectedMonth, refreshTrigger]);

            const getMonthlyStats = () => {
                const year = parseInt(selectedMonth.split('-')[0]);
                const month = parseInt(selectedMonth.split('-')[1]);
                const daysInMonth = new Date(year, month, 0).getDate();
                
                const stats = Array.from({length: daysInMonth}, () => ({ 
                    morning:0, afternoon:0, evening:0, 
                    urgent:0, total:0, 
                    before1Day: 0, before2DaysPlus: 0, sameDay: 0, afterDue: 0,
                    evening_before1Day: 0, evening_before2Days: 0, evening_before3DaysPlus: 0, evening_afterDue: 0
                }));
                
                let totalMonthCount = 0;
                let todayTotal = 0, todayMorning = 0, todayAfternoon = 0, todayEvening = 0;
                const todayStr = new Date().toLocaleDateString('en-CA');

                monthHistoryData.forEach(item => {
                    const day = parseInt(item.date.split('-')[2]) - 1;
                    const count = Number(item.count) || 0;
                    
                    if (day >= 0 && day < daysInMonth) {
                        totalMonthCount += count;
                        stats[day].total += count;

                        const hour = parseInt(item.time.split(':')[0], 10);
                        if (hour < 12) stats[day].morning += count;
                        else if (hour < 18) stats[day].afternoon += count;
                        else stats[day].evening += count;

                        const scanDateObj = parseDateSafe(item.date);
                        const dueDateObj = parseDateSafe(item.dueDate);
                        
                        const diffTime = dueDateObj.getTime() - scanDateObj.getTime();
                        const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

                        if (hour < 18) {
                            if (diffDays === 1) stats[day].before1Day += count; 
                            else if (diffDays >= 2) stats[day].before2DaysPlus += count; 
                            else if (diffDays === 0) stats[day].sameDay += count;    
                            else if (diffDays < 0) stats[day].afterDue += count;   
                        } else {
                            if (diffDays === 1) stats[day].evening_before1Day += count;
                            else if (diffDays === 2) stats[day].evening_before2Days += count;
                            else if (diffDays >= 3) stats[day].evening_before3DaysPlus += count;
                            else if (diffDays < 0) stats[day].evening_afterDue += count;
                        }

                        const sendDate = parseDateSafe(item.date); sendDate.setHours(0,0,0,0);
                        const nextDay = new Date(sendDate); nextDay.setDate(sendDate.getDate() + 1);
                        const dDate = parseDateSafe(item.dueDate); dDate.setHours(0,0,0,0);
                        if (dDate.getTime() <= nextDay.getTime()) stats[day].urgent += count;
                    }

                    if (item.date === todayStr) {
                        todayTotal += count;
                        const hour = parseInt(item.time.split(':')[0], 10);
                        if (hour < 12) todayMorning += count;
                        else if (hour < 18) todayAfternoon += count;
                        else todayEvening += count;
                    }
                });
                return { stats, daysInMonth, totalMonthCount, todayTotal, todayMorning, todayAfternoon, todayEvening };
            };

            const { stats, daysInMonth, totalMonthCount, todayTotal, todayMorning, todayAfternoon, todayEvening } = getMonthlyStats();
            const maxTotal = Math.max(...stats.map(s => s.total), 1);

            const handleExportExcel = async () => {
                if (!window.ExcelJS) { setAlertMsg('ระบบสร้างไฟล์กำลังโหลด...'); return; }
                setIsExporting(true);
                try {
                    const workbook = new window.ExcelJS.Workbook();
                    const sheet = workbook.addWorksheet('สรุปยอดส่งบิล');
                    const year = parseInt(selectedMonth.split('-')[0]);
                    const month = parseInt(selectedMonth.split('-')[1]);
                    const thaiMonth = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"][month-1];
                    const thaiYear = year + 543;

                    const compHeader = ['วันที่'];
                    const compTotal = ['จำนวนเที่ยวทั้งหมด'];
                    const compBefore1Day = ['ส่งบิลก่อนวันนัดส่ง 1 วัน (งานด่วน)'];
                    const compBefore2DaysPlus = ['ส่งบิลก่อนดิวส่ง 2 วันขึ้นไป'];
                    const compSameDay = ['ส่งบิลในวันนัดส่ง'];
                    const compAfterDue = ['ส่งบิลหลังคิวส่ง (ล่าช้า)'];
                    const compEvening = ['ส่งบิลหลัง 18.00 น. (รวม)'];
                    const compEvening_b1 = ['    - ดิวส่งล่วงหน้า 1 วัน'];
                    const compEvening_b2 = ['    - ดิวส่งล่วงหน้า 2 วัน'];
                    const compEvening_b3p = ['    - ดิวส่งล่วงหน้า 3 วันขึ้นไป'];
                    const compEvening_after = ['    - ดิวส่งล่าช้า (หลังคิวส่ง)'];

                    let sumTotal=0, sumCompBefore1Day=0, sumCompBefore2DaysPlus=0, sumCompSameDay=0, sumCompAfterDue=0;
                    let sumEvening=0, sumCompEvening_b1=0, sumCompEvening_b2=0, sumCompEvening_b3p=0, sumCompEvening_after=0;

                    for(let i=0; i<daysInMonth; i++) {
                        compHeader.push(i+1);
                        compTotal.push(stats[i].total); sumTotal += stats[i].total;
                        compBefore1Day.push(stats[i].before1Day); sumCompBefore1Day += stats[i].before1Day;
                        compBefore2DaysPlus.push(stats[i].before2DaysPlus); sumCompBefore2DaysPlus += stats[i].before2DaysPlus;
                        compSameDay.push(stats[i].sameDay); sumCompSameDay += stats[i].sameDay;
                        compAfterDue.push(stats[i].afterDue); sumCompAfterDue += stats[i].afterDue;
                        compEvening.push(stats[i].evening); sumEvening += stats[i].evening;
                        compEvening_b1.push(stats[i].evening_before1Day); sumCompEvening_b1 += stats[i].evening_before1Day;
                        compEvening_b2.push(stats[i].evening_before2Days); sumCompEvening_b2 += stats[i].evening_before2Days;
                        compEvening_b3p.push(stats[i].evening_before3DaysPlus); sumCompEvening_b3p += stats[i].evening_before3DaysPlus;
                        compEvening_after.push(stats[i].evening_afterDue); sumCompEvening_after += stats[i].evening_afterDue;
                    }

                    compHeader.push('Total');
                    compTotal.push(sumTotal);
                    compBefore1Day.push(sumCompBefore1Day);
                    compBefore2DaysPlus.push(sumCompBefore2DaysPlus);
                    compSameDay.push(sumCompSameDay);
                    compAfterDue.push(sumCompAfterDue);
                    compEvening.push(sumEvening);
                    compEvening_b1.push(sumCompEvening_b1);
                    compEvening_b2.push(sumCompEvening_b2);
                    compEvening_b3p.push(sumCompEvening_b3p);
                    compEvening_after.push(sumCompEvening_after);

                    sheet.addRow([`เดือน ${thaiMonth} ${thaiYear}`]);
                    const titleCell = sheet.getCell('A1');
                    titleCell.font = { name: 'Angsana New', bold: true, size: 16 };
                    sheet.mergeCells('A1:C1');

                    const rComp1 = sheet.addRow(compHeader);
                    const rComp2 = sheet.addRow(compTotal);
                    const rComp3 = sheet.addRow(compBefore1Day); 
                    const rComp4 = sheet.addRow(compBefore2DaysPlus); 
                    const rComp5 = sheet.addRow(compSameDay);
                    const rComp6 = sheet.addRow(compAfterDue);
                    const rComp7 = sheet.addRow(compEvening);
                    const rComp7_1 = sheet.addRow(compEvening_b1);
                    const rComp7_2 = sheet.addRow(compEvening_b2);
                    const rComp7_3 = sheet.addRow(compEvening_b3p);
                    const rComp7_4 = sheet.addRow(compEvening_after);

                    const styleCompRow = (row, bgArgb, fontColorArgb, isBold = false) => {
                        row.eachCell((cell, colNumber) => {
                            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bgArgb } };
                            cell.font = { name: 'Angsana New', size: 12, color: { argb: fontColorArgb }, bold: isBold };
                            cell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
                            cell.alignment = { vertical: 'middle', horizontal: colNumber === 1 ? 'left' : 'center' };
                        });
                        const lastColNumber = daysInMonth + 2;
                        const lastCell = row.getCell(lastColNumber);
                        lastCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFF00' } };
                        lastCell.font = { name: 'Angsana New', size: 12, color: { argb: fontColorArgb }, bold: true };
                    };

                    rComp1.eachCell((cell, colNumber) => {
                        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFB4C6E7' } };
                        cell.font = { name: 'Angsana New', size: 12, color: { argb: 'FF000000' }, bold: true };
                        cell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
                        cell.alignment = { vertical: 'middle', horizontal: 'center' };
                    });

                    styleCompRow(rComp2, 'FFFFFFFF', 'FFFF0000', true); 
                    rComp2.getCell(1).font = { name: 'Angsana New', size: 12, color: { argb: 'FF000000' }, bold: true }; 

                    styleCompRow(rComp3, 'FFFFFFFF', 'FF000000');
                    styleCompRow(rComp4, 'FFFFFFFF', 'FF000000');
                    styleCompRow(rComp5, 'FFFFFFFF', 'FF000000');
                    styleCompRow(rComp6, 'FFFFFFFF', 'FF000000');

                    styleCompRow(rComp7, 'FFEFF6FF', 'FF1E40AF', true); 
                    styleCompRow(rComp7_1, 'FFFFFFFF', 'FF475569'); 
                    styleCompRow(rComp7_2, 'FFFFFFFF', 'FF475569');
                    styleCompRow(rComp7_3, 'FFFFFFFF', 'FF475569');
                    styleCompRow(rComp7_4, 'FFFFFFFF', 'FF475569');
                    
                    rComp7_1.getCell(1).alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
                    rComp7_2.getCell(1).alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
                    rComp7_3.getCell(1).alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
                    rComp7_4.getCell(1).alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };

                    sheet.getColumn(1).width = 40; 
                    for(let i=2; i<=daysInMonth+1; i++) sheet.getColumn(i).width = 5; 
                    sheet.getColumn(daysInMonth+2).width = 8;

                    const buffer = await workbook.xlsx.writeBuffer();
                    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    window.saveAs(blob, `สรุปยอดส่งบิล_${thaiMonth}_${thaiYear}.xlsx`);
                } catch (err) { setAlertMsg('เกิดข้อผิดพลาดในการสร้างไฟล์ Excel'); } finally { setIsExporting(false); }
            };

            const handleGetDailySummary = async () => {
                setIsFetchingSummary(true);
                try {
                    const targetDateStr = summaryDate || new Date().toLocaleDateString('en-CA');
                    const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getDailySummaryText&date=${targetDateStr}`);
                    const text = await response.text();
                    if (text.trim().startsWith('<')) { setAlertMsg("เซิร์ฟเวอร์ตอบกลับผิดพลาด"); return; }
                    
                    const result = JSON.parse(text);
                    if (result.status === 'success') {
                        setLineMessageToCopy(result.data);
                        setShowCopyModal(true);
                    } else { setAlertMsg("เกิดข้อผิดพลาดจากเซิร์ฟเวอร์"); }
                } catch (error) { setAlertMsg("ไม่สามารถดึงข้อมูลสรุปได้"); } finally { setIsFetchingSummary(false); }
            };

            const forceRefresh = () => {
                setLastFetchedMonth(null); 
            };

            return (
                <div className={`pt-4 px-2 sm:px-4 pb-6 space-y-5 w-full max-w-2xl mx-auto ${isActive ? 'block' : 'hidden'}`}>
                    
                    <CustomAlertModal message={alertMsg} onClose={() => setAlertMsg(null)} />

                    {showCopyModal && (
                        <div className="fixed inset-0 bg-slate-900/30 backdrop-blur-md z-[160] flex items-center justify-center p-4">
                            <div className="liquid-glass p-8 w-full max-w-sm">
                                <div className="text-center mb-5 border-b border-slate-200/50 pb-4">
                                    <div className="w-16 h-16 bg-white text-blue-500 rounded-full flex items-center justify-center mx-auto mb-3 border border-white shadow-sm">
                                        <i className="fa-regular fa-copy text-3xl"></i>
                                    </div>
                                    <h3 className="text-2xl font-bold font-tva text-slate-800 tracking-widest">คัดลอกสรุปยอด</h3>
                                </div>
                                <div className="bg-white/40 border border-white/80 p-4 mb-6 max-h-[40vh] overflow-y-auto custom-scrollbar text-left rounded-2xl shadow-inner backdrop-blur-sm">
                                    <pre className="text-sm text-green-700 font-mono whitespace-pre-wrap leading-relaxed">{lineMessageToCopy}</pre>
                                </div>
                                <div className="flex gap-4 font-mono-tva font-bold">
                                    <button onClick={() => setShowCopyModal(false)} className="w-full py-3 bg-white/60 text-slate-600 rounded-[18px] hover:bg-white transition-colors border border-white shadow-sm">ปิด</button>
                                    <button onClick={() => handleCopyTextGlobal(lineMessageToCopy, () => setAlertMsg("คัดลอกข้อความสำเร็จ!"), () => setAlertMsg("ไม่สามารถคัดลอกได้"))} className="glass-btn-primary w-full py-3 flex justify-center items-center gap-2"><i className="fa-solid fa-copy"></i> คัดลอก</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 🟢 Responsive Grid */}
                    <div className="flex flex-col xl:flex-row gap-5">
                        {/* แผงควบคุม (ซ้าย) */}
                        <div className="liquid-glass p-6 flex flex-col justify-center gap-5 font-mono-tva w-full xl:w-1/2">
                            <div className="flex justify-between items-end border-b border-white/60 pb-4">
                                <div className="flex-1 mr-4">
                                    <label className="text-xs text-slate-500 block mb-1">เลือกวันที่ดึงสรุปยอด</label>
                                    <input type="date" value={summaryDate} onChange={(e) => setSummaryDate(e.target.value)} className="w-full bg-transparent text-amber-600 font-crt text-xl outline-none" />
                                </div>
                                <button onClick={handleGetDailySummary} disabled={isFetchingSummary} className="glass-btn px-4 py-2 font-bold text-xs flex items-center gap-2">
                                    {isFetchingSummary ? <i className="fa-solid fa-circle-notch animate-spin"></i> : <i className="fa-solid fa-magic"></i>} ดึงข้อความ
                                </button>
                            </div>
                            <div className="flex justify-between items-end">
                                <div className="flex-1 mr-4">
                                    <label className="text-xs text-slate-500 block mb-1">เลือกเดือนที่ต้องการ</label>
                                    <input type="month" value={selectedMonth} onChange={(e) => setSelectedMonth(e.target.value)} className="w-full bg-transparent text-green-600 font-crt text-xl outline-none" />
                                </div>
                                <button onClick={handleExportExcel} disabled={isLoadingHistory || isExporting} className="glass-btn px-4 py-2 font-bold text-xs flex items-center gap-2">
                                    {isExporting ? <i className="fa-solid fa-circle-notch animate-spin"></i> : <i className="fa-solid fa-file-excel"></i>} โหลดไฟล์ Excel
                                </button>
                            </div>
                        </div>

                        {/* กล่องยอดรวมใหญ่ (ขวา) */}
                        <div className="liquid-glass bg-white/40 p-6 text-center overflow-hidden relative w-full xl:w-1/2 flex flex-col justify-center min-h-[140px]">
                            <div className="relative z-10">
                                <h3 className="text-slate-500 text-xs font-bold uppercase tracking-widest mb-1 font-mono-tva">รวมยอดส่งบิลเดือนนี้</h3>
                                <div className="flex justify-center items-baseline gap-2">
                                    <span className="text-6xl font-crt text-slate-800 drop-shadow-sm">{totalMonthCount}</span>
                                    <span className="text-blue-600 font-bold font-mono-tva">เที่ยว</span>
                                </div>
                            </div>
                            <button onClick={forceRefresh} className="absolute top-4 right-4 text-slate-400 hover:text-blue-500 transition-colors z-20 bg-white/80 w-8 h-8 rounded-full shadow-sm border border-white flex items-center justify-center"><i className={`fa-solid fa-rotate-right text-sm ${isLoadingHistory ? 'animate-spin' : ''}`}></i></button>
                        </div>
                    </div>
                    
                    {/* สถิติ 4 ช่อง */}
                    <div className="grid grid-cols-2 xl:grid-cols-4 gap-3 xl:gap-4 font-mono-tva">
                        <div className="liquid-glass !bg-white/40 p-4 flex flex-col items-center justify-center !rounded-[20px]">
                            <span className="text-xs font-bold text-slate-500 mb-1">รวมวันนี้</span><span className="text-2xl font-crt text-slate-800">{todayTotal}</span>
                        </div>
                        <div className="liquid-glass !bg-white/40 p-4 flex flex-col items-center justify-center !rounded-[20px]">
                            <span className="text-xs font-bold text-amber-600 mb-1">ก่อนเที่ยง</span><span className="text-2xl font-crt text-amber-600">{todayMorning}</span>
                        </div>
                        <div className="liquid-glass !bg-white/40 p-4 flex flex-col items-center justify-center !rounded-[20px]">
                            <span className="text-xs font-bold text-blue-600 mb-1">รอบบ่าย</span><span className="text-2xl font-crt text-blue-600">{todayAfternoon}</span>
                        </div>
                        <div className="liquid-glass !bg-white/40 p-4 flex flex-col items-center justify-center !rounded-[20px]">
                            <span className="text-xs font-bold text-purple-600 mb-1">หลัง 18.00</span><span className="text-2xl font-crt text-purple-600">{todayEvening}</span>
                        </div>
                    </div>

                    {/* กราฟเครื่องทอเวลา Temporal Loom */}
                    <div className="liquid-glass p-5 w-full bg-white/50">
                        <div className="text-[10px] text-slate-500 font-mono-tva font-bold mb-4 uppercase border-b border-white/60 pb-2 flex justify-between">
                            <span>[ ข้อมูลเส้นเวลารายวัน ]</span>
                            <span className="text-blue-600">TEMPORAL LOOM</span>
                        </div>
                        
                        <div className="w-full overflow-x-auto custom-scrollbar rounded-[20px] relative bg-white/30 border border-white shadow-inner backdrop-blur-md">
                            <div className="absolute inset-0 bg-gradient-to-t from-white/60 to-transparent pointer-events-none rounded-[20px]"></div>
                            
                            <div className="min-w-[600px] h-[250px] relative px-4 py-6 flex items-end justify-between">
                                {/* เส้นแนวนอนหลัก */}
                                <div className="absolute top-[80%] left-0 right-0 h-0.5 bg-blue-500 opacity-20 animate-yggdrasil pointer-events-none"></div>
                                <div className="absolute top-[80%] left-0 right-0 h-[1px] bg-white pointer-events-none"></div>

                                {stats.map((d, i) => {
                                    const total = d.total;
                                    const ratio = total / maxTotal;
                                    const heightPx = total === 0 ? 5 : 10 + (ratio * 120);
                                    const isHigh = ratio > 0.6;
                                    
                                    const bgColor = total === 0 ? 'rgba(255,255,255,0.8)' : (isHigh ? '#007AFF' : '#60a5fa');
                                    const textColor = isHigh ? '#1e293b' : '#64748b';

                                    return (
                                        <div key={i} className="flex flex-col items-center justify-end h-full group z-10" style={{ width: `${100/daysInMonth}%` }}>
                                            {total > 0 && (
                                                <span className="font-crt text-sm font-bold mb-1" style={{ color: textColor }}>{total}</span>
                                            )}
                                            <div 
                                                className="w-2.5 rounded-t-[4px] transition-all duration-500 ease-out shadow-sm"
                                                style={{ height: `${heightPx}px`, backgroundColor: bgColor }}
                                            ></div>
                                            <div className="w-3 h-3 rounded-full bg-white border border-slate-200 mt-[-6px] z-20 hidden group-hover:block" style={{ borderColor: bgColor }}></div>
                                            <span className="font-mono-tva text-[10px] font-bold mt-2" style={{ color: total > 0 ? '#334155' : '#94a3b8' }}>{i+1}</span>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [userProfile, setUserProfile] = useState(() => {
                try {
                    const saved = localStorage.getItem('liff_profile_cache');
                    return saved ? JSON.parse(saved) : null;
                } catch(e) { return null; }
            });
            const [isLiffReady, setIsLiffReady] = useState(false);
            const [activeTab, setActiveTab] = useState('scan');
            const [refreshHistoryTrigger, setRefreshHistoryTrigger] = useState(0); 
            const [isProfileMenuOpen, setIsProfileMenuOpen] = useState(false);

            const wakeLockRef = useRef(null);

            const requestWakeLock = async () => {
                if ('wakeLock' in navigator) {
                    try { wakeLockRef.current = await navigator.wakeLock.request('screen'); } 
                    catch (err) {}
                }
            };

            useEffect(() => {
                const initLiff = async () => {
                    try {
                        await liff.init({ liffId: '2009934240-M2LO3My9' });
                        if (liff.isLoggedIn()) {
                            const profile = await liff.getProfile();
                            setUserProfile(profile);
                            try { localStorage.setItem('liff_profile_cache', JSON.stringify(profile)); } catch(e) {}
                        } else {
                            setUserProfile(null);
                            try { localStorage.removeItem('liff_profile_cache'); } catch(e) {}
                        }
                        setIsLiffReady(true);
                    } catch (err) {
                        setIsLiffReady(true); 
                    }
                };
                initLiff();

                requestWakeLock();
                const handleVisibilityChange = () => { if (document.visibilityState === 'visible') requestWakeLock(); };
                document.addEventListener('visibilitychange', handleVisibilityChange);

                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    if (wakeLockRef.current !== null) wakeLockRef.current.release().catch(()=>{});
                };
            }, []);

            if (!isLiffReady) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center font-crt text-slate-800 bg-[hsl(var(--background))]">
                        <div className="w-16 h-16 border-[5px] border-slate-200 border-t-blue-500 rounded-full animate-spin mb-6"></div>
                        <p className="text-slate-500 text-xl animate-pulse tracking-widest">กำลังเตรียมความพร้อม...</p>
                    </div>
                );
            }

            if (!userProfile) {
                return (
                    <div className="min-h-screen relative flex items-center justify-center p-6 bg-[hsl(var(--background))]">
                        {/* 🎬 Video Background for Login (Light blur) */}
                        <video autoPlay loop muted playsInline className="fixed inset-0 w-full h-full object-cover z-0 pointer-events-none opacity-[0.35] grayscale-[20%]">
                            <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260314_131748_f2ca2a28-fed7-44c8-b9a9-bd9acdd5ec31.mp4" type="video/mp4" />
                        </video>
                        <div className="fixed inset-0 bg-slate-50/60 backdrop-blur-md z-0 pointer-events-none"></div>

                        <div className="liquid-glass p-10 max-w-sm w-full text-center relative z-10 shadow-2xl">
                            <div className="w-24 h-24 bg-white/60 border border-white text-blue-500 rounded-[32px] flex items-center justify-center mx-auto mb-8 shadow-sm backdrop-blur-md">
                                <i className="fa-solid fa-qrcode text-5xl"></i>
                            </div>
                            <h2 className="font-tva text-4xl text-slate-800 tracking-widest mb-3">สแกนส่งบิล</h2>
                            <p className="font-mono-tva text-xs text-slate-500 font-bold mb-10 tracking-widest">เชื่อมต่อผ่าน LINE เพื่อยืนยันตัวตนก่อนเข้าใช้งาน</p>
                            
                            <button onClick={() => liff.login()} className="glass-btn-primary w-full py-4 flex items-center justify-center gap-3">
                                <i className="fa-brands fa-line text-3xl"></i> ล็อกอินด้วย LINE
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen relative flex flex-col">
                    
                    {/* 🎬 Video Background for Main App (Ultra Frosted Glass) */}
                    <video autoPlay loop muted playsInline className="fixed inset-0 w-full h-full object-cover z-0 pointer-events-none opacity-[0.35] grayscale-[20%]">
                        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260314_131748_f2ca2a28-fed7-44c8-b9a9-bd9acdd5ec31.mp4" type="video/mp4" />
                    </video>
                    {/* Overlay ทับวิดีโอเพื่อให้พื้นหลังดูเหมือนกระจกฝ้าสว่างๆ แบบ iPhone Wallpaper */}
                    <div className="fixed inset-0 bg-slate-100/50 backdrop-blur-[15px] z-0 pointer-events-none"></div>

                    {/* ป้ายชื่อ Profile ด้านบนขวา */}
                    <div className="fixed inset-x-0 top-4 z-[100] max-w-[1800px] mx-auto flex justify-end px-4 pointer-events-none">
                        <div className="relative">
                            <button onClick={() => setIsProfileMenuOpen(!isProfileMenuOpen)} className="block outline-none active:scale-95 transition-transform pointer-events-auto">
                                <div className="liquid-glass !bg-white/70 px-4 py-2.5 flex items-center gap-2 font-mono-tva text-xs text-slate-700 hover:text-blue-600 transition-colors !rounded-full shadow-sm">
                                    <i className="fa-solid fa-user-shield text-blue-500"></i>
                                    <span className="font-bold truncate max-w-[120px] uppercase">{userProfile.displayName}</span>
                                </div>
                            </button>

                            {isProfileMenuOpen && (
                                <>
                                    <div className="fixed inset-0 z-40 pointer-events-auto cursor-default" onClick={() => setIsProfileMenuOpen(false)}></div>
                                    <div className="absolute right-0 mt-3 w-48 liquid-glass p-2 z-50 font-mono-tva bg-white/95 pointer-events-auto shadow-2xl">
                                        <button 
                                            onClick={() => {
                                                liff.logout(); 
                                                setUserProfile(null); 
                                                try { localStorage.removeItem('liff_profile_cache'); } catch(e){} 
                                            }} 
                                            className="w-full text-left px-4 py-3 text-sm font-bold text-red-600 bg-red-50 rounded-[20px] hover:bg-red-100 flex items-center gap-3 transition-colors"
                                        >
                                            <i className="fa-solid fa-arrow-right-from-bracket"></i> ออกจากระบบ
                                        </button>
                                    </div>
                                </>
                            )}
                        </div>
                    </div>

                    {/* 🟢 Main Content */}
                    <div className="relative z-10 flex-1 flex flex-col lg:flex-row w-full max-w-[1800px] mx-auto pt-16 lg:pt-20 pb-28 lg:pb-10 px-0 sm:px-4">
                        
                        {/* คอลัมน์ซ้าย (Scanner) */}
                        <div className={`w-full lg:w-1/2 lg:border-r lg:border-white/40 lg:pr-4 ${activeTab === 'scan' ? 'block' : 'hidden'} lg:block`}>
                            <ScannerTab 
                                isActive={true} 
                                userProfile={userProfile} 
                                onSaveSuccess={() => setRefreshHistoryTrigger(prev => prev + 1)} 
                            />
                        </div>
                        
                        {/* คอลัมน์ขวา (History) */}
                        <div className={`w-full lg:w-1/2 lg:pl-4 ${activeTab === 'history' ? 'block' : 'hidden'} lg:block`}>
                            <HistoryTab 
                                isActive={true} 
                                refreshTrigger={refreshHistoryTrigger} 
                            />
                        </div>

                    </div>

                    {/* 🟢 Bottom Navigation (Mobile - iOS Style) */}
                    <div className="fixed bottom-0 left-0 right-0 z-40 bg-white/70 backdrop-blur-[24px] border-t border-white/80 pb-[env(safe-area-inset-bottom)] pt-1 px-1 lg:hidden rounded-t-[32px] shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
                        <div className="flex max-w-md mx-auto w-full overflow-hidden transition-all pb-2 pt-1">
                            <button onClick={() => setActiveTab('scan')} className={`flex-1 py-2 flex flex-col items-center justify-center font-tva tracking-widest transition-colors ${activeTab === 'scan' ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>
                                <i className={`fa-solid fa-barcode text-2xl mb-1 ${activeTab === 'scan' ? 'scale-110 transition-transform' : ''}`}></i><span className="text-[10px] font-bold">สแกนบิล</span>
                            </button>
                            <button onClick={() => setActiveTab('history')} className={`flex-1 py-2 flex flex-col items-center justify-center font-tva tracking-widest transition-colors ${activeTab === 'history' ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>
                                <i className={`fa-solid fa-chart-pie text-2xl mb-1 ${activeTab === 'history' ? 'scale-110 transition-transform' : ''}`}></i><span className="text-[10px] font-bold">สรุปยอด</span>
                            </button>
                        </div>
                        {/* Home indicator bar (iPhone style) */}
                        <div className="w-1/3 h-1.5 bg-slate-300 rounded-full mx-auto mb-2 opacity-50"></div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
