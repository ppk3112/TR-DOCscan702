    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* iOS Light Mode Palette */
            --ios-bg: #F2F2F7;
            --ios-card: #FFFFFF;
            --ios-card-hover: #F2F2F7;
            --ios-gray-bg: #E5E5EA; /* Light gray for inputs/controls */
            --ios-blue: #007AFF;
            --ios-green: #34C759;
            --ios-red: #FF3B30;
            --ios-orange: #FF9500;
            --ios-yellow: #FFCC00;
            --ios-gray: #8E8E93;
            --ios-separator: rgba(60, 60, 67, 0.29);
            --ios-overlay: rgba(0, 0, 0, 0.4);
            --text-main: #000000;
            --text-secondary: #3C3C43;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, 'Prompt', sans-serif;
            -webkit-tap-highlight-color: transparent; 
            margin: 0;
            background-color: var(--ios-bg); 
            color: var(--text-main);
            min-height: 100vh;
            /* รองรับจอติ่ง/Dynamic Island และ Tab bar ด้านล่าง */
            padding-top: env(safe-area-inset-top);
            padding-bottom: calc(env(safe-area-inset-bottom) + 90px);
            overscroll-behavior-y: none;
        }

        /* iOS Input & Buttons */
        .ios-input {
            background-color: var(--ios-gray-bg);
            border: none;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 17px;
            outline: none;
            transition: background-color 0.2s;
        }
        .ios-input:focus {
            background-color: #D1D1D6;
        }
        .ios-input::placeholder { color: var(--ios-gray); }

        .ios-btn-primary {
            background-color: var(--ios-blue);
            color: #FFFFFF;
            border-radius: 14px;
            font-weight: 600;
            font-size: 17px;
            transition: all 0.2s;
        }
        .ios-btn-primary:active {
            transform: scale(0.96);
            opacity: 0.8;
        }
        .ios-btn-primary:disabled {
            background-color: var(--ios-gray-bg);
            color: var(--ios-gray);
            transform: none;
            opacity: 1;
        }

        .ios-btn-success {
            background-color: var(--ios-green);
            color: #FFFFFF;
            border-radius: 14px;
            font-weight: 600;
            font-size: 17px;
            transition: all 0.2s;
        }
        .ios-btn-success:active {
            transform: scale(0.96);
            opacity: 0.8;
        }

        /* iOS Segmented Control (Light Mode) */
        .ios-segmented-control {
            background-color: var(--ios-gray-bg);
            padding: 3px;
            border-radius: 9px;
            display: flex;
        }
        .ios-segment {
            flex: 1;
            text-align: center;
            padding: 6px 0;
            font-size: 13px;
            font-weight: 500;
            border-radius: 7px;
            color: var(--text-main);
            transition: all 0.2s;
        }
        .ios-segment.active {
            background-color: #FFFFFF;
            box-shadow: 0 3px 1px rgba(0,0,0,0.04), 0 3px 8px rgba(0,0,0,0.12);
        }

        /* Grouped List Style */
        .ios-list-group {
            background-color: var(--ios-card);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .ios-list-item {
            position: relative;
        }
        .ios-list-item:not(:last-child)::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 16px;
            right: 0;
            height: 1px;
            background-color: var(--ios-separator);
        }

        /* Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: var(--ios-separator); border-radius: 10px; }

        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="month"]::-webkit-calendar-picker-indicator {
            opacity: 0.5;
            cursor: pointer;
        }
    </style>

<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react,env">
        window.addEventListener('error', (event) => {
            document.getElementById('root').innerHTML = `
                <div style="padding: 20px; font-family: -apple-system, 'Prompt'; text-align: center; margin-top: 50px;">
                    <i class="fa-solid fa-triangle-exclamation" style="font-size: 50px; color: #FF9500; margin-bottom: 20px;"></i>
                    <h3 style="font-size: 20px; font-weight: 600; margin-bottom: 10px; color: black;">พบข้อผิดพลาด</h3>
                    <p style="font-size: 14px; margin-bottom: 15px; color: #8E8E93;">ระบบอาจโดนบล็อกการทำงาน หรือแคชมีปัญหา</p>
                    <pre style="text-align: left; background: #E5E5EA; padding: 15px; font-size: 12px; overflow-x: auto; color: #FF3B30; border-radius: 10px; margin-bottom: 20px;">${event.message}</pre>
                    <button onclick="window.location.reload(true)" style="padding: 14px 24px; background: #007AFF; color: white; border: none; font-weight: 600; border-radius: 14px; width: 100%;">ลองใหม่อีกครั้ง</button>
                </div>
            `;
        });

        const { useState, useEffect, useRef, useCallback } = React;
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyYAYulOU-9KV7t4y08pz_GhicwWL2S9laTWsRkTqHvo5Fk_UIbGPF_EI0-kHzyY1P57A/exec';

        const firebaseConfig = {
            apiKey: "AIzaSyAbqUh6x0KiIL5rK3VhWc1ECE4R5X_gq2w",
            authDomain: "bill-pj.firebaseapp.com",
            databaseURL: "https://bill-pj-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bill-pj",
            storageBucket: "bill-pj.firebasestorage.app",
            messagingSenderId: "99092363681",
            appId: "1:99092363681:web:629ddf90c27a1d0db333e0"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        // 🟢 iOS Alert Dialog (Light Mode)
        const CustomAlertModal = ({ message, onClose, title = "แจ้งเตือน", isError = false }) => {
            if (!message) return null;
            return (
                <div className="fixed inset-0 bg-black/30 backdrop-blur-[2px] z-[200] flex items-center justify-center p-4">
                    <div className="bg-white/95 backdrop-blur-xl w-full max-w-[270px] rounded-[14px] text-center overflow-hidden shadow-2xl animate-in zoom-in-95 duration-200">
                        <div className="p-5 pt-6">
                            <h3 className="text-[17px] font-semibold text-black mb-1.5">{title}</h3>
                            <p className="text-[13px] text-[#3C3C43] whitespace-pre-wrap leading-snug">{message}</p>
                        </div>
                        <div className="border-t border-black/10 flex">
                            <button onClick={onClose} className={`w-full py-3.5 text-[17px] font-semibold active:bg-black/5 transition-colors ${isError ? 'text-[#FF3B30]' : 'text-[#007AFF]'}`}>
                                ตกลง
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const parseDateSafe = (dateString) => {
            if (!dateString) return new Date();
            if (dateString.includes('-')) {
                const [y, m, d] = dateString.split('-');
                return new Date(parseInt(y, 10), parseInt(m, 10) - 1, parseInt(d, 10));
            }
            return new Date(dateString);
        };

        const formatThaiDate = (dateString) => {
            const d = parseDateSafe(dateString);
            if (isNaN(d.getTime())) return dateString;
            return new Intl.DateTimeFormat('th-TH', { year: '2-digit', month: 'short', day: 'numeric' }).format(d);
        };

        const checkIsUrgent = (dateStr) => {
            if (!dateStr) return false;
            const targetDate = parseDateSafe(dateStr); 
            targetDate.setHours(0, 0, 0, 0);
            const today = new Date(); 
            today.setHours(0, 0, 0, 0);
            const tomorrow = new Date(today); 
            tomorrow.setDate(today.getDate() + 1);
            return targetDate.getTime() <= tomorrow.getTime();
        };

        const playBeep = () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();
                osc.type = 'square'; osc.frequency.setValueAtTime(600, ctx.currentTime);
                gainNode.gain.setValueAtTime(0.05, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.connect(gainNode); gainNode.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            } catch (e) {}
        };

        const playDuplicateVoice = () => {
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance('บิลซ้ำค่ะ');
                    utterance.lang = 'th-TH'; 
                    const voices = window.speechSynthesis.getVoices();
                    const thaiVoice = voices.find(voice => voice.lang.includes('th'));
                    if (thaiVoice) utterance.voice = thaiVoice;
                    utterance.pitch = 0.8; utterance.rate = 1.0;
                    window.speechSynthesis.speak(utterance);
                }
            } catch (e) {}
        };

        const handleCopyTextGlobal = async (text, onSuccess, onError) => {
            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(text);
                    if (onSuccess) onSuccess();
                    return;
                } catch (err) {
                    console.warn("Clipboard API failed");
                }
            }
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed"; 
            textArea.style.top = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try { 
                document.execCommand('copy'); 
                if (onSuccess) onSuccess(); 
            } catch (err) { 
                if (onError) onError(); 
            }
            document.body.removeChild(textArea);
        };

        const ScannerTab = ({ isActive, userProfile, onSaveSuccess }) => {
            const [currentItems, setCurrentItems] = useState([]);
            
            const [inputValue, setInputValue] = useState('');
            const [dueDate, setDueDate] = useState(() => {
                const now = new Date(); now.setDate(now.getDate() + 2);
                return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            });
            
            const [deliveryType, setDeliveryType] = useState('DC');
            const [deliveryZone, setDeliveryZone] = useState('NORMAL'); 
            const [showZoneDropdown, setShowZoneDropdown] = useState(false); 
            
            const [allSentCodesCache, setAllSentCodesCache] = useState(new Set());
            const [duplicateWarning, setDuplicateWarning] = useState(null);
            const [alertMsg, setAlertMsg] = useState(null); 
            const [isAlertError, setIsAlertError] = useState(false);
            
            const [isScanning, setIsScanning] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [saveSuccess, setSaveSuccess] = useState(false);
            const [isFlashlightOn, setIsFlashlightOn] = useState(false);

            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [showClearConfirmModal, setShowClearConfirmModal] = useState(false);
            const [showCopyModal, setShowCopyModal] = useState(false);
            const [lineMessageToCopy, setLineMessageToCopy] = useState('');
            const [lastSavedMessage, setLastSavedMessage] = useState(() => {
                try { return localStorage.getItem('last_saved_message') || ''; } catch (e) { return ''; }
            });
            
            const [editingIndex, setEditingIndex] = useState(null);
            const [editDueDate, setEditDueDate] = useState('');
            const [editIsFactory, setEditIsFactory] = useState(false);
            const [editIsUpcountry, setEditIsUpcountry] = useState(false); 
            const [editRemark, setEditRemark] = useState(''); 

            const [showUrgencyModal, setShowUrgencyModal] = useState(false);
            const [pendingItem, setPendingItem] = useState(null);

            const html5QrCodeRef = useRef(null);
            const lastScannedRef = useRef(null);
            const dueDateRef = useRef(dueDate);
            const deliveryTypeRef = useRef(deliveryType);
            const deliveryZoneRef = useRef(deliveryZone);
            const currentItemsRef = useRef(currentItems);
            const allSentCodesCacheRef = useRef(allSentCodesCache);
            const showUrgencyModalRef = useRef(false);

            useEffect(() => { dueDateRef.current = dueDate; }, [dueDate]);
            useEffect(() => { deliveryTypeRef.current = deliveryType; }, [deliveryType]);
            useEffect(() => { deliveryZoneRef.current = deliveryZone; }, [deliveryZone]);
            useEffect(() => { currentItemsRef.current = currentItems; }, [currentItems]);
            useEffect(() => { allSentCodesCacheRef.current = allSentCodesCache; }, [allSentCodesCache]);
            useEffect(() => { showUrgencyModalRef.current = showUrgencyModal; }, [showUrgencyModal]);

            const updateCartInFirebase = (newItems) => {
                if (userProfile && userProfile.userId) {
                    database.ref('carts/' + userProfile.userId).set(newItems);
                }
            };

            const showAlert = (msg, error = false) => {
                setIsAlertError(error);
                setAlertMsg(msg);
            };

            useEffect(() => {
                if (userProfile && userProfile.userId) {
                    const cartRef = database.ref('carts/' + userProfile.userId);
                    cartRef.on('value', (snapshot) => {
                        const data = snapshot.val();
                        setCurrentItems(data || []);
                    });
                    return () => cartRef.off();
                } else {
                    setCurrentItems([]);
                }
            }, [userProfile]);

            useEffect(() => {
                const fetchAllCodes = async () => {
                    try {
                        const cachedCodes = localStorage.getItem('all_sent_codes_backup');
                        if (cachedCodes) setAllSentCodesCache(new Set(JSON.parse(cachedCodes)));
                    } catch(e) {}
                    try {
                        const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getAllCodes`);
                        const text = await res.text();
                        if (text.trim().startsWith('<')) return;
                        const json = JSON.parse(text);
                        if (json.status === 'success' && json.data) {
                            const uppercaseCodes = json.data.map(code => String(code).trim().toUpperCase());
                            setAllSentCodesCache(new Set(uppercaseCodes));
                            try { 
                                const slicedCache = uppercaseCodes.slice(-10000); 
                                localStorage.setItem('all_sent_codes_backup', JSON.stringify(slicedCache)); 
                            } catch(e) {}
                        }
                    } catch (e) {}
                };
                fetchAllCodes();
                return () => { if (html5QrCodeRef.current && isScanning) html5QrCodeRef.current.stop().catch(() => {}); }
            }, []);

            const checkDuplicate = useCallback((code) => {
                const cleanCode = String(code).trim().toUpperCase(); 
                if (currentItemsRef.current.some(item => String(item.code).trim().toUpperCase() === cleanCode)) {
                    playDuplicateVoice();
                    setDuplicateWarning(`สแกนไปแล้วในตะกร้า\n${cleanCode}`);
                    setTimeout(() => setDuplicateWarning(null), 4000); 
                    return true;
                }
                if (allSentCodesCacheRef.current.has(cleanCode)) {
                    playDuplicateVoice();
                    setDuplicateWarning(`เคยถูกส่งไปแล้วในระบบ\n${cleanCode}`);
                    setTimeout(() => setDuplicateWarning(null), 4000); 
                    return true;
                }
                return false;
            }, []);

            const processNewItem = (finalCode, itemDueDate) => {
                if (checkDuplicate(finalCode)) return;
                if (checkIsUrgent(itemDueDate)) {
                    setPendingItem({ code: finalCode, dueDate: itemDueDate });
                    setShowUrgencyModal(true);
                } else {
                    playBeep();
                    const newItems = [{ code: finalCode, dueDate: itemDueDate, urgencyTag: null, remark: '' }, ...currentItemsRef.current];
                    updateCartInFirebase(newItems);
                }
            };

            const handleConfirmUrgency = (tag) => {
                if (pendingItem) {
                    playBeep();
                    const newItems = [{ ...pendingItem, urgencyTag: tag, remark: '' }, ...currentItemsRef.current];
                    updateCartInFirebase(newItems);
                }
                setShowUrgencyModal(false);
                setPendingItem(null);
            };

            const handleTypeToggle = (type) => {
                if (deliveryType === type) setShowZoneDropdown(!showZoneDropdown);
                else { setDeliveryType(type); setDeliveryZone('NORMAL'); setShowZoneDropdown(false); }
            };

            const startScanner = async () => {
                if (!window.Html5Qrcode) { showAlert('กำลังโหลดระบบสแกน...', false); return; }
                const isLineApp = navigator.userAgent.indexOf("Line") > -1;
                if (isLineApp) showAlert("ตรวจพบแอป LINE\nกรุณากดไอคอน '3 จุด' เลือก 'เปิดใน Safari / Browser'", true);

                try {
                    const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
                    tempCtx.resume();
                    if ('speechSynthesis' in window) {
                        const utterance = new SpeechSynthesisUtterance('');
                        utterance.volume = 0;
                        window.speechSynthesis.speak(utterance);
                    }
                } catch(e) {}

                setIsScanning(true);
                setTimeout(() => {
                    const html5QrCode = new window.Html5Qrcode("reader");
                    html5QrCodeRef.current = html5QrCode;
                    const config = {
                        fps: 10,
                        qrbox: (vw, vh) => ({ width: Math.min(250, vw * 0.8), height: 150 }),
                        aspectRatio: 1.0, 
                        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
                    };

                    html5QrCode.start(
                        { facingMode: "environment" }, config,
                        (decodedText) => {
                            if (showUrgencyModalRef.current) return;
                            if (lastScannedRef.current !== decodedText) {
                                lastScannedRef.current = decodedText;
                                
                                let rawCode = decodedText.trim();
                                const yy = String(new Date().getFullYear()).slice(-2);
                                
                                if (rawCode.length !== 10 || !rawCode.startsWith(yy)) {
                                    showAlert(`บาร์โค้ดไม่ถูกต้อง!\nคุณสแกนได้: ${rawCode}\nต้องมี 10 หลัก และขึ้นต้นปี ${yy}`, true);
                                    setTimeout(() => { lastScannedRef.current = null }, 3000);
                                    return;
                                }

                                let finalCode = deliveryTypeRef.current === 'FACTORY' ? `${rawCode}(รับโรงตัด)` : rawCode;
                                if (deliveryZoneRef.current === 'UPCOUNTRY') finalCode += '(ตจว.)';
                                processNewItem(finalCode, dueDateRef.current);
                                setTimeout(() => { lastScannedRef.current = null }, 1500);
                            }
                        }, 
                        (err) => {}
                    ).catch((err) => { setIsScanning(false); showAlert("ไม่สามารถเปิดกล้องได้ กรุณาให้สิทธิ์การเข้าถึงกล้อง", true); });
                }, 300);
            };

            const stopScanner = () => {
                if (html5QrCodeRef.current) {
                    html5QrCodeRef.current.stop().then(() => {
                        html5QrCodeRef.current.clear(); 
                        setIsScanning(false); setIsFlashlightOn(false);
                    }).catch(() => setIsScanning(false));
                } else setIsScanning(false);
            };

            const toggleFlashlight = async () => {
                if (html5QrCodeRef.current && isScanning) {
                    try {
                        const newState = !isFlashlightOn;
                        await html5QrCodeRef.current.applyVideoConstraints({ advanced: [{ torch: newState }] });
                        setIsFlashlightOn(newState);
                    } catch (error) { showAlert("อุปกรณ์ไม่รองรับไฟฉายผ่านเว็บ", false); }
                }
            };

            const handleManualAdd = (e) => {
                e.preventDefault();
                let val = inputValue.trim();
                if (!val) return;

                if (val.length !== 4 && val.length !== 10) {
                    showAlert("กรุณาพิมพ์เลข 4 หลัก หรือ 10 หลัก เท่านั้น", true);
                    return;
                }
                
                const now = new Date();
                const yy = String(now.getFullYear()).slice(-2);
                
                if (val.length === 10 && !val.startsWith(yy)) {
                    showAlert(`เลขบิล 10 หลักต้องขึ้นต้นด้วยปี ${yy}`, true);
                    return;
                }

                if (val.length === 4) {
                    const mm = String(now.getMonth() + 1).padStart(2, '0');
                    val = `${yy}${mm}00${val}`; 
                }

                let finalCode = deliveryType === 'FACTORY' ? `${val}(รับโรงตัด)` : val;
                if (deliveryZone === 'UPCOUNTRY') finalCode += '(ตจว.)';
                processNewItem(finalCode, dueDate);
                setInputValue('');
            };

            const saveEditItem = () => {
                if (editingIndex === null) return;
                const newItems = [...currentItemsRef.current];
                let baseCode = newItems[editingIndex].code.replace('(รับโรงตัด)', '').replace('(ตจว.)', '').trim();
                
                let finalCode = editIsFactory ? `${baseCode}(รับโรงตัด)` : baseCode;
                if (editIsUpcountry) finalCode += '(ตจว.)';
                
                const upperFinalCode = finalCode.toUpperCase();
                const isDuplicateInCart = newItems.some((item, idx) => idx !== editingIndex && String(item.code).trim().toUpperCase() === upperFinalCode);
                const isDuplicateInHistory = allSentCodesCacheRef.current.has(upperFinalCode);
                
                if (isDuplicateInCart || isDuplicateInHistory) { 
                    playDuplicateVoice();
                    setDuplicateWarning(`แก้ไขไม่ได้! บิลนี้มีซ้ำอยู่แล้ว\n${upperFinalCode}`);
                    setTimeout(() => setDuplicateWarning(null), 4000); 
                    return; 
                }

                const existingTag = newItems[editingIndex].urgencyTag || null;
                newItems[editingIndex] = { ...newItems[editingIndex], code: finalCode, dueDate: editDueDate, urgencyTag: existingTag, remark: editRemark.trim() };
                
                updateCartInFirebase(newItems);
                setEditingIndex(null);
            };

            const executeSaveBatch = async () => {
                if (currentItemsRef.current.length === 0) return;
                setIsSaving(true); setSaveSuccess(false);

                const now = new Date();
                const currentDateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                const currentTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

                const newBatch = {
                    id: "BATCH-" + Date.now().toString().slice(-6),
                    items: [...currentItemsRef.current], date: currentDateStr, time: currentTimeStr, 
                    dueDate: dueDate, timestamp: now.getTime(),
                    userId: userProfile ? userProfile.userId : null
                };

                try {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(newBatch)
                    });

                    const text = await response.text();
                    if (text.trim().startsWith('<')) { showAlert("ระบบตอบกลับผิดพลาด", true); setIsSaving(false); return; }

                    const result = JSON.parse(text);
                    if (result.status === 'error') {
                        if (result.message === 'DUPLICATE_FOUND') { showAlert(`ตรวจพบการซ้ำซ้อน!\nบิลเลขที่: ${result.duplicateCode}`, true); } 
                        else { showAlert("ข้อผิดพลาด: " + result.message, true); }
                        setIsSaving(false); return; 
                    }

                    updateCartInFirebase([]); 
                    setSaveSuccess(true);
                    
                    if (window.confetti) {
                        confetti({
                            particleCount: 120, spread: 70, origin: { y: 0.6 },
                            colors: ['#007AFF', '#34C759', '#FFCC00', '#FF3B30']
                        });
                    }
                    
                    if (result.lineMessage) {
                        setLineMessageToCopy(result.lineMessage);
                        setLastSavedMessage(result.lineMessage); 
                        try { localStorage.setItem('last_saved_message', result.lineMessage); } catch(e) {}
                        setTimeout(() => { setShowCopyModal(true); }, 1500); 
                    }
                    
                    onSaveSuccess();
                    
                    const newCodesSet = new Set(allSentCodesCache);
                    newBatch.items.forEach(item => newCodesSet.add(item.code.trim().toUpperCase()));
                    setAllSentCodesCache(newCodesSet);
                    try {
                        const updatedArray = Array.from(newCodesSet).slice(-10000);
                        localStorage.setItem('all_sent_codes_backup', JSON.stringify(updatedArray));
                    } catch(e) {}

                    setTimeout(() => setSaveSuccess(false), 3000);
                } catch (error) { 
                    showAlert(`การเชื่อมต่อล้มเหลว ตรวจสอบอินเทอร์เน็ต`, true); 
                } finally { 
                    setIsSaving(false); 
                }
            };

            return (
                <div className={`pt-2 px-4 pb-6 w-full max-w-2xl mx-auto ${isActive ? 'block' : 'hidden'}`}>
                    <CustomAlertModal message={alertMsg} onClose={() => setAlertMsg(null)} isError={isAlertError} />

                    {/* iOS Success Overlay */}
                    {saveSuccess && (
                        <div className="fixed inset-0 bg-black/30 backdrop-blur-sm z-[150] flex flex-col items-center justify-center animate-in fade-in duration-300">
                            <div className="bg-white/95 backdrop-blur-xl p-8 rounded-[24px] text-center shadow-2xl animate-in zoom-in-90 duration-300 border border-black/5">
                                <div className="w-20 h-20 bg-[#34C759]/10 text-[#34C759] rounded-full flex items-center justify-center mx-auto mb-4">
                                    <i className="fa-solid fa-check text-4xl"></i>
                                </div>
                                <h2 className="text-xl font-semibold text-black mb-1">ส่งข้อมูลสำเร็จ</h2>
                                <p className="text-[15px] text-[#3C3C43]">บิลเข้าสู่ระบบเรียบร้อยแล้ว</p>
                            </div>
                        </div>
                    )}

                    {/* iOS Notification Toast (Top) */}
                    {duplicateWarning && (
                        <div className="fixed top-[env(safe-area-inset-top)] mt-4 left-4 right-4 z-[110] flex justify-center animate-in slide-in-from-top-4 duration-300">
                            <div className="bg-white/95 backdrop-blur-xl text-black px-5 py-3 rounded-full flex items-center gap-3 shadow-lg border border-black/5 max-w-sm w-full">
                                <div className="bg-[#FF3B30] w-8 h-8 rounded-full flex items-center justify-center shrink-0">
                                    <i className="fa-solid fa-exclamation text-white text-sm"></i>
                                </div>
                                <div className="flex-1 text-[14px] font-medium leading-tight whitespace-pre-wrap">{duplicateWarning}</div>
                            </div>
                        </div>
                    )}

                    {/* iOS Action Sheet for Urgency */}
                    {showUrgencyModal && pendingItem && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-[160] flex items-end justify-center sm:items-center sm:p-4">
                            <div className="bg-[#F2F2F7] w-full max-w-sm rounded-t-[24px] sm:rounded-[24px] pb-8 pt-6 px-4 animate-in slide-in-from-bottom-full sm:slide-in-from-bottom-0 sm:zoom-in-95 duration-300">
                                <div className="text-center mb-6 px-4">
                                    <h3 className="text-[15px] font-semibold text-[#8E8E93] uppercase tracking-wide">ระบุสาเหตุงานด่วน</h3>
                                    <p className="text-2xl font-bold text-black mt-1">{pendingItem.code}</p>
                                </div>
                                <div className="space-y-3 mb-4">
                                    <button onClick={() => handleConfirmUrgency('ด่วนมาก')} className="w-full bg-white py-4 rounded-xl text-[17px] font-semibold text-[#FF3B30] active:bg-gray-100 transition-colors shadow-sm flex items-center justify-center gap-2">
                                        <i className="fa-solid fa-fire"></i> ด่วนมาก
                                    </button>
                                    <button onClick={() => handleConfirmUrgency('ขายพึ่งลง TMS')} className="w-full bg-white py-4 rounded-xl text-[17px] font-semibold text-[#FF9500] active:bg-gray-100 transition-colors shadow-sm flex items-center justify-center gap-2">
                                        <i className="fa-solid fa-clock-rotate-left"></i> ขายพึ่งลง TMS
                                    </button>
                                </div>
                                <button onClick={() => { setShowUrgencyModal(false); setPendingItem(null); }} className="w-full bg-white py-4 rounded-xl text-[17px] font-semibold text-[#007AFF] active:bg-gray-100 transition-colors shadow-sm">
                                    ยกเลิก
                                </button>
                            </div>
                        </div>
                    )}

                    {/* iOS Alert Modal for Copy */}
                    {showCopyModal && (
                        <div className="fixed inset-0 bg-black/30 backdrop-blur-[2px] z-[160] flex items-center justify-center p-4">
                            <div className="bg-white/95 backdrop-blur-xl w-full max-w-[300px] rounded-[14px] overflow-hidden shadow-2xl text-center border border-black/5">
                                <div className="p-5">
                                    <h3 className="text-[17px] font-semibold text-black mb-3">คัดลอกข้อความ</h3>
                                    <div className="bg-[#F2F2F7] p-3 max-h-[30vh] overflow-y-auto custom-scrollbar text-left rounded-lg text-[13px] text-[#3C3C43] font-mono border border-black/5">
                                        {lineMessageToCopy}
                                    </div>
                                </div>
                                <div className="flex border-t border-black/10">
                                    <button onClick={() => setShowCopyModal(false)} className="flex-1 py-3.5 text-[17px] text-[#3C3C43] active:bg-black/5 transition-colors border-r border-black/10">ปิด</button>
                                    <button onClick={() => handleCopyTextGlobal(lineMessageToCopy, () => showAlert("คัดลอกสำเร็จ", false), () => showAlert("ไม่สามารถคัดลอกได้", true))} className="flex-1 py-3.5 text-[17px] text-[#007AFF] font-semibold active:bg-black/5 transition-colors">คัดลอก</button>
                                </div>
                            </div>
                        </div>

                    {/* iOS Action Sheet for Clear Cart */}
                    {showClearConfirmModal && (

                                <div className="bg-white/90 backdrop-blur-xl rounded-[14px] overflow-hidden mb-2 shadow-sm">
                                    <div className="p-4 text-center border-b border-black/10">
                                        <p className="text-[13px] text-[#8E8E93] font-medium">ข้อมูลที่สแกนมาจะหายทั้งหมด<br/>คุณแน่ใจหรือไม่?</p>
                                    </div>
                                    <button onClick={() => { updateCartInFirebase([]); setShowClearConfirmModal(false); }} className="w-full py-4 text-[17px] text-[#FF3B30] font-semibold active:bg-black/5 transition-colors">ล้างตะกร้าทั้งหมด</button>
                                </div>
                                <button onClick={() => setShowClearConfirmModal(false)} className="w-full bg-white py-4 rounded-[14px] text-[17px] text-[#007AFF] font-semibold active:bg-gray-100 transition-colors shadow-sm">ยกเลิก</button>
                            </div>
                        </div>
                    )}

                    {/* iOS Edit Modal */}
                    {editingIndex !== null && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-[160] flex flex-col justify-end sm:justify-center p-0 sm:p-4">
                            <div className="bg-white w-full sm:max-w-sm rounded-t-[20px] sm:rounded-[20px] h-auto max-h-[90vh] overflow-y-auto animate-in slide-in-from-bottom-full sm:slide-in-from-bottom-0 sm:zoom-in-95 duration-300 shadow-xl">
                                <div className="sticky top-0 bg-white/90 backdrop-blur z-10 flex justify-between items-center px-4 py-3 border-b border-[#E5E5EA]">
                                    <button onClick={() => setEditingIndex(null)} className="text-[#007AFF] text-[17px]">ยกเลิก</button>
                                    <h3 className="text-[17px] font-semibold text-black">แก้ไขบิล</h3>
                                    <button onClick={saveEditItem} className="text-[#007AFF] text-[17px] font-semibold">บันทึก</button>
                                </div>
                                <div className="p-4 space-y-5 bg-[#F2F2F7] min-h-[50vh]">
                                    <div className="bg-[#E5E5EA] rounded-xl p-1 flex shadow-inner">
                                        <button onClick={() => setEditIsFactory(false)} className={`flex-1 py-2 text-[14px] font-medium rounded-lg transition-all ${!editIsFactory ? 'bg-white text-black shadow-sm' : 'text-[#8E8E93]'}`}>รับ DC</button>
                                        <button onClick={() => setEditIsFactory(true)} className={`flex-1 py-2 text-[14px] font-medium rounded-lg transition-all ${editIsFactory ? 'bg-white text-black shadow-sm' : 'text-[#8E8E93]'}`}>รับโรงตัด</button>
                                    </div>
                                    <div className="bg-[#E5E5EA] rounded-xl p-1 flex shadow-inner">
                                        <button onClick={() => setEditIsUpcountry(false)} className={`flex-1 py-2 text-[14px] font-medium rounded-lg transition-all ${!editIsUpcountry ? 'bg-white text-black shadow-sm' : 'text-[#8E8E93]'}`}>พื้นที่ปกติ</button>
                                        <button onClick={() => setEditIsUpcountry(true)} className={`flex-1 py-2 text-[14px] font-medium rounded-lg transition-all ${editIsUpcountry ? 'bg-white text-black shadow-sm' : 'text-[#8E8E93]'}`}>ส่ง ตจว.</button>
                                    </div>
                                    <div className="ios-list-group">
                                        <div className="ios-list-item px-4 py-3 flex justify-between items-center bg-white">
                                            <span className="text-[15px] text-black">วันที่ส่ง</span>
                                            <input type="date" value={editDueDate} onChange={(e) => setEditDueDate(e.target.value)} className="bg-transparent text-right text-[15px] text-[#007AFF] outline-none" />
                                        </div>
                                    </div>
                                    <div className="ios-list-group">
                                        <div className="px-4 py-3 bg-white">
                                            <input type="text" value={editRemark} onChange={(e) => setEditRemark(e.target.value)} placeholder="หมายเหตุ (เช่น ลังแตก)" className="w-full bg-transparent text-[15px] text-black outline-none placeholder:text-[#8E8E93]" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* iOS Confirm Modal */}
                    {showConfirmModal && (
                        <div className="fixed inset-0 bg-black/30 backdrop-blur-[2px] z-[160] flex items-center justify-center p-4">
                            <div className="bg-white/95 backdrop-blur-xl w-full max-w-[270px] rounded-[14px] text-center overflow-hidden shadow-2xl border border-black/5">
                                <div className="p-5 pt-6">
                                    <h3 className="text-[17px] font-semibold text-black mb-1.5">ยืนยันการส่งข้อมูล</h3>
                                    <p className="text-[13px] text-[#3C3C43]">ต้องการส่งบิลจำนวน <span className="text-black font-bold">{currentItems.length}</span> เที่ยว เข้าระบบใช่หรือไม่?</p>
                                </div>
                                <div className="border-t border-black/10 flex">
                                    <button onClick={() => setShowConfirmModal(false)} className="flex-1 py-3.5 text-[17px] font-semibold text-[#007AFF] active:bg-black/5 transition-colors border-r border-black/10">ยกเลิก</button>
                                    <button onClick={() => { setShowConfirmModal(false); executeSaveBatch(); }} className="flex-1 py-3.5 text-[17px] font-semibold text-[#34C759] active:bg-black/5 transition-colors">ยืนยัน</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="flex flex-col gap-6">
                        
                        {/* ส่วนสแกนและตั้งค่า */}
                        <div className="w-full flex flex-col gap-4">
                            
                            {/* Card ควบคุมหลัก */}
                            <div className="bg-white rounded-[20px] p-4 shadow-sm border border-[#E5E5EA]">
                                
                                <div className="ios-segmented-control mb-4">
                                    <button onClick={() => handleTypeToggle('DC')} className={`ios-segment ${deliveryType === 'DC' ? 'active' : ''}`}>
                                        รับ DC {deliveryType === 'DC' && deliveryZone === 'UPCOUNTRY' && '(ตจว.)'}
                                        {deliveryType === 'DC' && <i className={`fa-solid fa-chevron-down text-[10px] ml-1 transition-transform ${showZoneDropdown ? 'rotate-180' : ''}`}></i>}
                                    </button>
                                    <button onClick={() => handleTypeToggle('FACTORY')} className={`ios-segment ${deliveryType === 'FACTORY' ? 'active' : ''}`}>
                                        รับโรงตัด {deliveryType === 'FACTORY' && deliveryZone === 'UPCOUNTRY' && '(ตจว.)'}
                                        {deliveryType === 'FACTORY' && <i className={`fa-solid fa-chevron-down text-[10px] ml-1 transition-transform ${showZoneDropdown ? 'rotate-180' : ''}`}></i>}
                                    </button>
                                </div>

                                {showZoneDropdown && (
                                    <div className="ios-segmented-control mb-4 bg-[#E5E5EA] border border-black/5">
                                        <button onClick={() => { setDeliveryZone('NORMAL'); setShowZoneDropdown(false); }} className={`ios-segment ${deliveryZone === 'NORMAL' ? 'active' : ''}`}>พื้นที่ปกติ</button>
                                        <button onClick={() => { setDeliveryZone('UPCOUNTRY'); setShowZoneDropdown(false); }} className={`ios-segment ${deliveryZone === 'UPCOUNTRY' ? 'active' : ''}`}><i className="fa-solid fa-truck-fast mr-1"></i> งาน ตจว.</button>
                                    </div>
                                )}

                                {/* Date Picker สไตล์ iOS Row */}
                                <div className={`ios-list-group mb-4 border ${checkIsUrgent(dueDate) ? 'border-[#FF3B30]/30 bg-[#FF3B30]/5' : 'border-transparent'}`}>
                                    <div className="ios-list-item px-4 py-3 flex justify-between items-center relative">
                                        <div className="flex items-center gap-2">
                                            <div className={`w-7 h-7 rounded-md flex items-center justify-center ${checkIsUrgent(dueDate) ? 'bg-[#FF3B30]' : 'bg-[#007AFF]'}`}>
                                                <i className="fa-regular fa-calendar text-white text-xs"></i>
                                            </div>
                                            <span className="text-[15px] font-medium text-black">ดิวจัดส่ง</span>
                                            {checkIsUrgent(dueDate) && <span className="bg-[#FF3B30] text-white text-[10px] px-2 py-0.5 rounded-full font-bold uppercase"><i className="fa-solid fa-bolt"></i> ด่วน</span>}
                                        </div>
                                        <input type="date" required value={dueDate} onChange={(e) => setDueDate(e.target.value)} className={`bg-transparent text-right text-[15px] font-medium outline-none ${checkIsUrgent(dueDate) ? 'text-[#FF3B30]' : 'text-[#8E8E93]'}`} />
                                    </div>
                                </div>

                                {isScanning ? (
                                    <div className="relative bg-black h-[260px] rounded-[16px] overflow-hidden flex items-center justify-center">
                                        <div id="reader" className="w-full h-full"></div>
                                        <div className="absolute inset-0 pointer-events-none opacity-60 flex justify-center items-center">
                                            <div className="w-[70%] h-[60%] border-[2px] border-dashed border-[#FFCC00] rounded-[16px]"></div>
                                        </div>
                                        <button onClick={stopScanner} className="absolute top-3 right-3 bg-black/40 backdrop-blur-md text-white w-9 h-9 rounded-full flex items-center justify-center active:bg-white/20 z-10"><i className="fa-solid fa-xmark"></i></button>
                                        <button onClick={toggleFlashlight} className={`absolute top-3 left-3 w-9 h-9 rounded-full flex items-center justify-center z-10 backdrop-blur-md transition-colors ${isFlashlightOn ? 'bg-[#FFCC00] text-black' : 'bg-black/40 text-white'}`}><i className="fa-solid fa-bolt text-sm"></i></button>
                                    </div>
                                ) : (
                                    <div className="flex flex-col gap-3">
                                        <button onClick={startScanner} className="ios-btn-primary w-full py-4 text-lg flex items-center justify-center gap-2 shadow-sm">

                                        </button>
                                        <form onSubmit={handleManualAdd} className="flex gap-2">
                                            <div className="flex-1 relative">
                                                <input type="text" inputMode="numeric" value={inputValue} onChange={(e) => setInputValue(e.target.value)} placeholder="พิมพ์เลข 4 หรือ 10 หลัก..." className="ios-input w-full px-4 py-3.5" />
                                            </div>
                                            <button type="submit" className="ios-btn-primary bg-[#E5E5EA] text-[#007AFF] w-[52px] flex items-center justify-center active:bg-[#D1D1D6] shadow-none"><i className="fa-solid fa-plus text-xl"></i></button>

                        {/* ตะกร้าบิล */}
                        <div className="w-full flex flex-col gap-4">
                            <div className="bg-white rounded-[20px] overflow-hidden shadow-sm flex flex-col border border-[#E5E5EA]">
                                <div className="flex justify-between items-center p-4 border-b border-[#E5E5EA] bg-white">
                                    <span className="font-semibold text-[17px] text-black">ตะกร้าบิล</span>
                                    <div className="flex items-center gap-3">
                                        {currentItems.length > 0 && <button onClick={() => setShowClearConfirmModal(true)} className="text-[#FF3B30] text-[15px]">ล้าง</button>}
                                        <span className="bg-[#F2F2F7] text-[#8E8E93] px-2.5 py-1 text-[13px] font-semibold rounded-full">{currentItems.length} เที่ยว</span>

                                <div className="h-[320px] lg:h-[450px] overflow-y-auto custom-scrollbar relative bg-[#F2F2F7]">

                                                            {item.urgencyTag === 'ขายพึ่งลง TMS' && <span className="text-[#FF9500] bg-[#FF9500]/10 px-1.5 py-0.5 rounded"><i className="fa-solid fa-clock-rotate-left text-[9px]"></i> ขายพึ่งลง TMS</span>}
