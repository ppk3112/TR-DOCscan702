                                    )}
                                </div>
                                <div className="p-3 border-t border-[#E5E5EA] bg-white">
                                    <button onClick={() => setShowConfirmModal(true)} disabled={currentItems.length === 0 || isSaving} className="ios-btn-success w-full py-3.5 text-[17px] flex justify-center items-center gap-2 shadow-sm">
                                        <i className="fa-solid fa-paper-plane"></i> ส่งเข้าระบบ
                                    </button>
                                </div>
                            </div>

                            {lastSavedMessage && (
                                <div className="bg-white rounded-[20px] p-4 flex flex-col gap-3 shadow-sm border border-[#E5E5EA]">
                                    <div className="flex items-center gap-2 text-[#34C759] font-semibold text-[15px]">
                                        <i className="fa-solid fa-check-circle"></i> ข้อความที่ส่งล่าสุด
                                    </div>
                                    <button onClick={() => { setLineMessageToCopy(lastSavedMessage); setShowCopyModal(true); }} className="w-full py-3 bg-[#F2F2F7] text-[#007AFF] font-semibold rounded-[12px] text-[15px] flex items-center justify-center gap-2 active:bg-[#E5E5EA]">
                                        <i className="fa-solid fa-copy"></i> ดูและคัดลอกข้อความ
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const HistoryTab = ({ isActive, refreshTrigger }) => {
            const [selectedMonth, setSelectedMonth] = useState(new Date().toLocaleDateString('en-CA').substring(0, 7));
            const [summaryDate, setSummaryDate] = useState(new Date().toLocaleDateString('en-CA'));
            const [monthHistoryData, setMonthHistoryData] = useState([]);
            const [isLoadingHistory, setIsLoadingHistory] = useState(false);
            const [isExporting, setIsExporting] = useState(false);
            const [isFetchingSummary, setIsFetchingSummary] = useState(false); 
            const [alertMsg, setAlertMsg] = useState(null);
            
            const [showCopyModal, setShowCopyModal] = useState(false);
            const [lineMessageToCopy, setLineMessageToCopy] = useState('');
            const [lastFetchedMonth, setLastFetchedMonth] = useState(null);

            useEffect(() => {
                if (!isActive) return;

                const fetchHistory = async () => {
                    setIsLoadingHistory(true);
                    const cacheKey = `history_data_${selectedMonth}`;
                    try {
                        const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getHistory&month=${selectedMonth}`);
                        const text = await res.text();
                        if (text.trim().startsWith('<')) throw new Error("เซิร์ฟเวอร์ส่งกลับเป็นหน้า HTML");
                        const json = JSON.parse(text);
                        if (json.status === 'success' && json.data) {
                            setMonthHistoryData(json.data);
                            try { localStorage.setItem(cacheKey, JSON.stringify(json.data)); } catch(e){}
                        }
                    } catch (error) { 
                        try {
                            const cachedData = localStorage.getItem(cacheKey);
                            if (cachedData) { setMonthHistoryData(JSON.parse(cachedData)); }
                        } catch(e) {}
                    } finally { 
                        setIsLoadingHistory(false); 
                        setLastFetchedMonth(selectedMonth);
                    }
                };

                if (selectedMonth !== lastFetchedMonth || refreshTrigger > 0) {
                    const cacheKey = `history_data_${selectedMonth}`;
                    try {
                        const cachedData = localStorage.getItem(cacheKey);
                        if (cachedData && selectedMonth !== lastFetchedMonth) setMonthHistoryData(JSON.parse(cachedData));
                    } catch(e) {}
                    fetchHistory();
                }
            }, [isActive, selectedMonth, refreshTrigger]);

            const getMonthlyStats = () => {
                const year = parseInt(selectedMonth.split('-')[0]);
                const month = parseInt(selectedMonth.split('-')[1]);
                const daysInMonth = new Date(year, month, 0).getDate();
                
                const stats = Array.from({length: daysInMonth}, () => ({ 
                    morning:0, afternoon:0, evening:0, 
                    urgent:0, total:0, 
                    before1Day: 0, before2DaysPlus: 0, sameDay: 0, afterDue: 0,
                    evening_before1Day: 0, evening_before2Days: 0, evening_before3DaysPlus: 0, evening_afterDue: 0
                }));
                
                let totalMonthCount = 0;
                let todayTotal = 0, todayMorning = 0, todayAfternoon = 0, todayEvening = 0;
                const todayStr = new Date().toLocaleDateString('en-CA');

                monthHistoryData.forEach(item => {
                    const day = parseInt(item.date.split('-')[2]) - 1;
                    const count = Number(item.count) || 0;
                    
                    if (day >= 0 && day < daysInMonth) {
                        totalMonthCount += count;
                        stats[day].total += count;

                        const hour = parseInt(item.time.split(':')[0], 10);
                        if (hour < 12) stats[day].morning += count;
                        else if (hour < 18) stats[day].afternoon += count;
                        else stats[day].evening += count;

                        const scanDateObj = parseDateSafe(item.date);
                        const dueDateObj = parseDateSafe(item.dueDate);
                        
                        const diffTime = dueDateObj.getTime() - scanDateObj.getTime();
                        const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

                        if (hour < 18) {
                            if (diffDays === 1) stats[day].before1Day += count; 
                            else if (diffDays >= 2) stats[day].before2DaysPlus += count; 
                            else if (diffDays === 0) stats[day].sameDay += count;    
                            else if (diffDays < 0) stats[day].afterDue += count;   
                        } else {
                            if (diffDays === 1) stats[day].evening_before1Day += count;
                            else if (diffDays === 2) stats[day].evening_before2Days += count;
                            else if (diffDays >= 3) stats[day].evening_before3DaysPlus += count;
                            else if (diffDays < 0) stats[day].evening_afterDue += count;
                        }

                        const sendDate = parseDateSafe(item.date); sendDate.setHours(0,0,0,0);
                        const nextDay = new Date(sendDate); nextDay.setDate(sendDate.getDate() + 1);
                        const dDate = parseDateSafe(item.dueDate); dDate.setHours(0,0,0,0);
                        if (dDate.getTime() <= nextDay.getTime()) stats[day].urgent += count;
                    }

                    if (item.date === todayStr) {
                        todayTotal += count;
                        const hour = parseInt(item.time.split(':')[0], 10);
                        if (hour < 12) todayMorning += count;
                        else if (hour < 18) todayAfternoon += count;
                        else todayEvening += count;
                    }
                });
                return { stats, daysInMonth, totalMonthCount, todayTotal, todayMorning, todayAfternoon, todayEvening };
            };

            const { stats, daysInMonth, totalMonthCount, todayTotal, todayMorning, todayAfternoon, todayEvening } = getMonthlyStats();
            const maxTotal = Math.max(...stats.map(s => s.total), 1);

            const handleExportExcel = async () => {
                if (!window.ExcelJS) { setAlertMsg('กำลังโหลด...'); return; }
                setIsExporting(true);
                try {
                    const workbook = new window.ExcelJS.Workbook();
                    const sheet = workbook.addWorksheet('สรุปยอดส่งบิล');
                    const year = parseInt(selectedMonth.split('-')[0]);
                    const month = parseInt(selectedMonth.split('-')[1]);
                    const thaiMonth = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"][month-1];
                    const thaiYear = year + 543;

                    const compHeader = ['วันที่'];
                    const compTotal = ['จำนวนเที่ยวทั้งหมด'];
                    const compBefore1Day = ['ส่งบิลก่อนวันนัดส่ง 1 วัน (งานด่วน)'];
                    const compBefore2DaysPlus = ['ส่งบิลก่อนดิวส่ง 2 วันขึ้นไป'];
                    const compSameDay = ['ส่งบิลในวันนัดส่ง'];
                    const compAfterDue = ['ส่งบิลหลังคิวส่ง (ล่าช้า)'];
                    const compEvening = ['ส่งบิลหลัง 18.00 น. (รวม)'];
                    const compEvening_b1 = ['    - ดิวส่งล่วงหน้า 1 วัน'];
                    const compEvening_b2 = ['    - ดิวส่งล่วงหน้า 2 วัน'];
                    const compEvening_b3p = ['    - ดิวส่งล่วงหน้า 3 วันขึ้นไป'];
                    const compEvening_after = ['    - ดิวส่งล่าช้า (หลังคิวส่ง)'];

                    let sumTotal=0, sumCompBefore1Day=0, sumCompBefore2DaysPlus=0, sumCompSameDay=0, sumCompAfterDue=0;
                    let sumEvening=0, sumCompEvening_b1=0, sumCompEvening_b2=0, sumCompEvening_b3p=0, sumCompEvening_after=0;

                    for(let i=0; i<daysInMonth; i++) {
                        compHeader.push(i+1);
                        compTotal.push(stats[i].total); sumTotal += stats[i].total;
                        compBefore1Day.push(stats[i].before1Day); sumCompBefore1Day += stats[i].before1Day;
                        compBefore2DaysPlus.push(stats[i].before2DaysPlus); sumCompBefore2DaysPlus += stats[i].before2DaysPlus;
                        compSameDay.push(stats[i].sameDay); sumCompSameDay += stats[i].sameDay;
                        compAfterDue.push(stats[i].afterDue); sumCompAfterDue += stats[i].afterDue;
                        compEvening.push(stats[i].evening); sumEvening += stats[i].evening;
                        compEvening_b1.push(stats[i].evening_before1Day); sumCompEvening_b1 += stats[i].evening_before1Day;
                        compEvening_b2.push(stats[i].evening_before2Days); sumCompEvening_b2 += stats[i].evening_before2Days;
                        compEvening_b3p.push(stats[i].evening_before3DaysPlus); sumCompEvening_b3p += stats[i].evening_before3DaysPlus;
                        compEvening_after.push(stats[i].evening_afterDue); sumCompEvening_after += stats[i].evening_afterDue;
                    }

                    compHeader.push('Total');
                    compTotal.push(sumTotal);
                    compBefore1Day.push(sumCompBefore1Day);
                    compBefore2DaysPlus.push(sumCompBefore2DaysPlus);
                    compSameDay.push(sumCompSameDay);
                    compAfterDue.push(sumCompAfterDue);
                    compEvening.push(sumEvening);
                    compEvening_b1.push(sumCompEvening_b1);
                    compEvening_b2.push(sumCompEvening_b2);
                    compEvening_b3p.push(sumCompEvening_b3p);
                    compEvening_after.push(sumCompEvening_after);

                    sheet.addRow([`เดือน ${thaiMonth} ${thaiYear}`]);
                    const titleCell = sheet.getCell('A1');
                    titleCell.font = { name: 'Angsana New', bold: true, size: 16 };
                    sheet.mergeCells('A1:C1');

                    const rComp1 = sheet.addRow(compHeader);
                    const rComp2 = sheet.addRow(compTotal);
                    const rComp3 = sheet.addRow(compBefore1Day); 
                    const rComp4 = sheet.addRow(compBefore2DaysPlus); 
                    const rComp5 = sheet.addRow(compSameDay);
                    const rComp6 = sheet.addRow(compAfterDue);
                    const rComp7 = sheet.addRow(compEvening);
                    const rComp7_1 = sheet.addRow(compEvening_b1);
                    const rComp7_2 = sheet.addRow(compEvening_b2);
                    const rComp7_3 = sheet.addRow(compEvening_b3p);
                    const rComp7_4 = sheet.addRow(compEvening_after);

                    const styleCompRow = (row, bgArgb, fontColorArgb, isBold = false) => {
                        row.eachCell((cell, colNumber) => {
                            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bgArgb } };
                            cell.font = { name: 'Angsana New', size: 12, color: { argb: fontColorArgb }, bold: isBold };
                            cell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
                            cell.alignment = { vertical: 'middle', horizontal: colNumber === 1 ? 'left' : 'center' };
                        });
                        const lastColNumber = daysInMonth + 2;
                        const lastCell = row.getCell(lastColNumber);
                        lastCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFF00' } };
                        lastCell.font = { name: 'Angsana New', size: 12, color: { argb: fontColorArgb }, bold: true };
                    };

                    rComp1.eachCell((cell, colNumber) => {
                        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFB4C6E7' } };
                        cell.font = { name: 'Angsana New', size: 12, color: { argb: 'FF000000' }, bold: true };
                        cell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
                        cell.alignment = { vertical: 'middle', horizontal: 'center' };
                    });

                    styleCompRow(rComp2, 'FFFFFFFF', 'FFFF0000', true); 
                    rComp2.getCell(1).font = { name: 'Angsana New', size: 12, color: { argb: 'FF000000' }, bold: true }; 

                    styleCompRow(rComp3, 'FFFFFFFF', 'FF000000');
                    styleCompRow(rComp4, 'FFFFFFFF', 'FF000000');
                    styleCompRow(rComp5, 'FFFFFFFF', 'FF000000');
                    styleCompRow(rComp6, 'FFFFFFFF', 'FF000000');

                    styleCompRow(rComp7, 'FFEFF6FF', 'FF1E40AF', true); 
                    styleCompRow(rComp7_1, 'FFFFFFFF', 'FF475569'); 
                    styleCompRow(rComp7_2, 'FFFFFFFF', 'FF475569');
                    styleCompRow(rComp7_3, 'FFFFFFFF', 'FF475569');
                    styleCompRow(rComp7_4, 'FFFFFFFF', 'FF475569');
                    
                    rComp7_1.getCell(1).alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
                    rComp7_2.getCell(1).alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
                    rComp7_3.getCell(1).alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
                    rComp7_4.getCell(1).alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };

                    sheet.getColumn(1).width = 40; 
                    for(let i=2; i<=daysInMonth+1; i++) sheet.getColumn(i).width = 5; 
                    sheet.getColumn(daysInMonth+2).width = 8;

                    const buffer = await workbook.xlsx.writeBuffer();
                    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    window.saveAs(blob, `สรุปยอดส่งบิล_${thaiMonth}_${thaiYear}.xlsx`);
                } catch (err) { setAlertMsg('เกิดข้อผิดพลาดในการสร้างไฟล์ Excel'); } finally { setIsExporting(false); }
            };

            const handleGetDailySummary = async () => {
                setIsFetchingSummary(true);
                try {
                    const targetDateStr = summaryDate || new Date().toLocaleDateString('en-CA');
                    const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getDailySummaryText&date=${targetDateStr}`);
                    const text = await response.text();
                    if (text.trim().startsWith('<')) { setAlertMsg("เซิร์ฟเวอร์ตอบกลับผิดพลาด"); return; }
                    
                    const result = JSON.parse(text);
                    if (result.status === 'success') {
                        setLineMessageToCopy(result.data);
                        setShowCopyModal(true);
                    } else { setAlertMsg("เกิดข้อผิดพลาดจากเซิร์ฟเวอร์"); }
                } catch (error) { setAlertMsg("ไม่สามารถดึงข้อมูลสรุปได้"); } finally { setIsFetchingSummary(false); }
            };

            const forceRefresh = () => {
                setLastFetchedMonth(null); 
            };

            return (
                <div className={`pt-2 px-4 pb-6 space-y-4 w-full max-w-2xl mx-auto ${isActive ? 'block' : 'hidden'}`}>
                    
                    <CustomAlertModal message={alertMsg} onClose={() => setAlertMsg(null)} />

                    {showCopyModal && (
                        <div className="fixed inset-0 bg-black/30 backdrop-blur-[2px] z-[160] flex items-center justify-center p-4">
                            <div className="bg-white/95 backdrop-blur-xl w-full max-w-[300px] rounded-[14px] overflow-hidden shadow-2xl text-center border border-black/5">
                                <div className="p-5">
                                    <h3 className="text-[17px] font-semibold text-black mb-3">สรุปยอดประจำวัน</h3>
                                    <div className="bg-[#F2F2F7] p-3 max-h-[30vh] overflow-y-auto custom-scrollbar text-left rounded-lg text-[13px] text-[#3C3C43] font-mono border border-black/5">
                                        {lineMessageToCopy}
                                    </div>
                                </div>
                                <div className="flex border-t border-black/10">
                                    <button onClick={() => setShowCopyModal(false)} className="flex-1 py-3.5 text-[17px] text-[#3C3C43] active:bg-black/5 transition-colors border-r border-black/10">ปิด</button>
                                    <button onClick={() => handleCopyTextGlobal(lineMessageToCopy, () => setAlertMsg("คัดลอกสำเร็จ"), () => setAlertMsg("ไม่สามารถคัดลอกได้"))} className="flex-1 py-3.5 text-[17px] text-[#007AFF] font-semibold active:bg-black/5 transition-colors">คัดลอก</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ยอดรวมเดือนนี้ */}
                    <div className="bg-white rounded-[20px] p-6 text-center relative shadow-sm mt-2 border border-[#E5E5EA]">
                        <div className="flex flex-col items-center">
                            <span className="text-[13px] font-medium text-[#8E8E93] uppercase tracking-wide mb-1">ยอดรวมเดือนนี้</span>
                            <div className="flex items-baseline gap-1.5">
                                <span className="text-[54px] font-bold text-black tracking-tight leading-none">{totalMonthCount}</span>
                                <span className="text-[17px] font-semibold text-[#8E8E93]">บิล</span>
                            </div>
                        </div>
                        <button onClick={forceRefresh} className="absolute top-4 right-4 w-8 h-8 bg-[#F2F2F7] rounded-full flex items-center justify-center text-[#007AFF] active:bg-[#E5E5EA] transition-colors"><i className={`fa-solid fa-arrow-rotate-right text-sm ${isLoadingHistory ? 'animate-spin' : ''}`}></i></button>
                    </div>

                    <div className="flex flex-col xl:flex-row gap-4">
                        {/* แผงควบคุม (ซ้าย) */}
                        <div className="bg-white rounded-[20px] p-4 flex flex-col justify-center gap-2 w-full xl:w-1/2 shadow-sm border border-[#E5E5EA]">
                            <div className="ios-list-group shadow-none">
                                <div className="ios-list-item pl-4 pr-3 py-2 flex justify-between items-center">
                                    <span className="text-[15px] text-black">สรุปรายวัน</span>
                                    <div className="flex items-center gap-2">
                                        <input type="date" value={summaryDate} onChange={(e) => setSummaryDate(e.target.value)} className="bg-transparent text-right text-[15px] text-[#007AFF] outline-none w-[110px]" />
                                        <button onClick={handleGetDailySummary} disabled={isFetchingSummary} className="w-8 h-8 bg-[#F2F2F7] rounded-full flex justify-center items-center text-[#007AFF] active:bg-[#E5E5EA]">
                                            {isFetchingSummary ? <i className="fa-solid fa-circle-notch animate-spin text-xs"></i> : <i className="fa-solid fa-chevron-right text-xs"></i>}
                                        </button>
                                    </div>
                                </div>
                                <div className="ios-list-item pl-4 pr-3 py-2 flex justify-between items-center">
                                    <span className="text-[15px] text-black">โหลด Excel</span>
                                    <div className="flex items-center gap-2">
                                        <input type="month" value={selectedMonth} onChange={(e) => setSelectedMonth(e.target.value)} className="bg-transparent text-right text-[15px] text-[#34C759] outline-none w-[100px]" />
                                        <button onClick={handleExportExcel} disabled={isLoadingHistory || isExporting} className="w-8 h-8 bg-[#F2F2F7] rounded-full flex justify-center items-center text-[#34C759] active:bg-[#E5E5EA]">
                                            {isExporting ? <i className="fa-solid fa-circle-notch animate-spin text-xs"></i> : <i className="fa-solid fa-download text-xs"></i>}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    {/* สถิติ 4 ช่อง */}
                    <div className="grid grid-cols-2 gap-3">
                        <div className="bg-white rounded-[16px] p-3 flex flex-col justify-center pl-4 relative overflow-hidden shadow-sm border border-[#E5E5EA]">
                            <div className="absolute left-0 top-0 bottom-0 w-1 bg-[#007AFF]"></div>
                            <span className="text-[12px] font-medium text-[#8E8E93] mb-0.5">รวมวันนี้</span>
                            <span className="text-[22px] font-semibold text-black">{todayTotal}</span>
                        </div>
                        <div className="bg-white rounded-[16px] p-3 flex flex-col justify-center pl-4 relative overflow-hidden shadow-sm border border-[#E5E5EA]">
                            <div className="absolute left-0 top-0 bottom-0 w-1 bg-[#FF9500]"></div>
                            <span className="text-[12px] font-medium text-[#8E8E93] mb-0.5">ก่อนเที่ยง</span>
                            <span className="text-[22px] font-semibold text-black">{todayMorning}</span>
                        </div>
                        <div className="bg-white rounded-[16px] p-3 flex flex-col justify-center pl-4 relative overflow-hidden shadow-sm border border-[#E5E5EA]">
                            <div className="absolute left-0 top-0 bottom-0 w-1 bg-[#FFCC00]"></div>
                            <span className="text-[12px] font-medium text-[#8E8E93] mb-0.5">รอบบ่าย</span>
                            <span className="text-[22px] font-semibold text-black">{todayAfternoon}</span>
                        </div>
                        <div className="bg-white rounded-[16px] p-3 flex flex-col justify-center pl-4 relative overflow-hidden shadow-sm border border-[#E5E5EA]">
                            <div className="absolute left-0 top-0 bottom-0 w-1 bg-[#AF52DE]"></div>
                            <span className="text-[12px] font-medium text-[#8E8E93] mb-0.5">หลัง 18.00 น.</span>
                            <span className="text-[22px] font-semibold text-black">{todayEvening}</span>
                        </div>
                    </div>

                    {/* กราฟแท่ง */}
                    <div className="bg-white rounded-[20px] p-4 w-full shadow-sm border border-[#E5E5EA]">
                        <div className="text-[15px] font-semibold text-black mb-4">
                            ยอดรวมรายวัน
                        </div>
                        
                        <div className="w-full overflow-x-auto custom-scrollbar relative pb-2">
                            <div className="min-w-[500px] h-[180px] relative px-2 flex items-end justify-between border-b border-[#E5E5EA]">
                                {stats.map((d, i) => {
                                    const total = d.total;
                                    const ratio = total / maxTotal;
                                    const heightPx = total === 0 ? 4 : Math.max(10, ratio * 140);
                                    const isHigh = ratio > 0.7;
                                    
                                    const bgColor = total === 0 ? '#E5E5EA' : (isHigh ? '#34C759' : '#007AFF');
                                    const textColor = total === 0 ? 'transparent' : '#8E8E93';

                                    return (
                                        <div key={i} className="flex flex-col items-center justify-end h-full group z-10" style={{ width: `${100/daysInMonth}%` }}>
                                            <span className={`text-[10px] font-semibold mb-1 opacity-80`} style={{ color: textColor }}>{total}</span>
                                            <div 
                                                className="w-1.5 sm:w-2.5 rounded-full transition-all duration-500 ease-out"
                                                style={{ height: `${heightPx}px`, backgroundColor: bgColor }}
                                            ></div>
                                            <span className="text-[10px] font-medium mt-2 text-[#8E8E93]">{i+1}</span>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [userProfile, setUserProfile] = useState(() => {
                try {
                    const saved = localStorage.getItem('liff_profile_cache');
                    return saved ? JSON.parse(saved) : null;
                } catch(e) { return null; }
            });
            const [isLiffReady, setIsLiffReady] = useState(false);
            const [activeTab, setActiveTab] = useState('scan');
            const [refreshHistoryTrigger, setRefreshHistoryTrigger] = useState(0); 

            const wakeLockRef = useRef(null);

            const requestWakeLock = async () => {
                if ('wakeLock' in navigator) {
                    try { wakeLockRef.current = await navigator.wakeLock.request('screen'); } 
                    catch (err) {}
                }
            };

            useEffect(() => {
                const initLiff = async () => {
                    try {
                        await liff.init({ liffId: '2009934240-M2LO3My9' });
                        if (liff.isLoggedIn()) {
                            const profile = await liff.getProfile();
                            setUserProfile(profile);
                            try { localStorage.setItem('liff_profile_cache', JSON.stringify(profile)); } catch(e) {}
                        } else {
                            setUserProfile(null);
                            try { localStorage.removeItem('liff_profile_cache'); } catch(e) {}
                        }
                        setIsLiffReady(true);
                    } catch (err) {
                        setIsLiffReady(true); 
                    }
                };
                initLiff();

                requestWakeLock();
                const handleVisibilityChange = () => { if (document.visibilityState === 'visible') requestWakeLock(); };
                document.addEventListener('visibilitychange', handleVisibilityChange);

                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    if (wakeLockRef.current !== null) wakeLockRef.current.release().catch(()=>{});
                };
            }, []);

            if (!isLiffReady) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-[#F2F2F7]">
                        <i className="fa-solid fa-circle-notch animate-spin text-3xl mb-4 text-[#8E8E93]"></i>
                    </div>
                );
            }

            if (!userProfile) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-[#F2F2F7]">
                        <div className="bg-white p-8 max-w-sm w-full text-center rounded-[24px] shadow-sm border border-black/5">
                            <div className="w-20 h-20 bg-[#007AFF] text-white rounded-[18px] flex items-center justify-center mx-auto mb-6 shadow-md shadow-[#007AFF]/20">
                                <i className="fa-solid fa-qrcode text-4xl"></i>
                            </div>
                            <h2 className="text-[22px] font-semibold text-black mb-2 tracking-tight">สแกนส่งบิล</h2>
                            <p className="text-[15px] text-[#8E8E93] mb-8">เข้าสู่ระบบเพื่อดำเนินการต่อ</p>
                            
                            <button onClick={() => liff.login()} className="w-full py-3.5 bg-[#34C759] text-white font-semibold rounded-[14px] text-[17px] flex items-center justify-center gap-2 active:scale-95 transition-transform shadow-sm">
                                <i className="fa-brands fa-line text-xl"></i> เข้าสู่ระบบด้วย LINE
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen relative flex flex-col bg-[#F2F2F7]">
                    
                    {/* iOS Navigation Bar (Top) */}
                    <div className="fixed top-0 left-0 right-0 z-40 bg-white/85 backdrop-blur-xl border-b border-black/10 pt-[env(safe-area-inset-top)]">
                        <div className="flex justify-between items-center px-4 h-14">
                            <h1 className="text-[17px] font-semibold text-black">{activeTab === 'scan' ? 'สแกนส่งบิล' : 'สรุปยอด'}</h1>
                            <div className="flex items-center gap-2">
                                <div className="bg-[#F2F2F7] px-3 py-1.5 rounded-full flex items-center gap-2 border border-black/5">
                                    <img src={userProfile.pictureUrl} alt="profile" className="w-5 h-5 rounded-full object-cover" />
                                    <span className="text-[13px] font-medium text-black truncate max-w-[80px]">{userProfile.displayName}</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col lg:flex-row w-full max-w-[1200px] mx-auto pt-[calc(env(safe-area-inset-top)+56px)]">
                        
                        {/* คอลัมน์ซ้าย (Scanner) */}
                        <div className={`w-full lg:w-1/2 lg:border-r lg:border-[#E5E5EA] lg:pr-2 ${activeTab === 'scan' ? 'block' : 'hidden'} lg:block`}>
                            <ScannerTab 
                                isActive={true} 
                                userProfile={userProfile} 
                                onSaveSuccess={() => setRefreshHistoryTrigger(prev => prev + 1)} 
                            />
                        </div>
                        
                        {/* คอลัมน์ขวา (History) */}
                        <div className={`w-full lg:w-1/2 lg:pl-2 ${activeTab === 'history' ? 'block' : 'hidden'} lg:block`}>
                            <HistoryTab 
                                isActive={true} 
                                refreshTrigger={refreshHistoryTrigger} 
                            />
                        </div>

                    </div>

                    {/* iOS Bottom Tab Bar */}
                    <div className="fixed bottom-0 left-0 right-0 z-40 bg-white/85 backdrop-blur-2xl border-t border-black/10 pb-[env(safe-area-inset-bottom)] lg:hidden">
                        <div className="flex max-w-md mx-auto w-full h-[60px]">
                            <button onClick={() => setActiveTab('scan')} className={`flex-1 flex flex-col items-center justify-center pt-2 transition-colors ${activeTab === 'scan' ? 'text-[#007AFF]' : 'text-[#8E8E93]'}`}>
                                <i className="fa-solid fa-barcode text-[22px] mb-1"></i>
                                <span className="text-[10px] font-medium">สแกน</span>
                            </button>
                            <button onClick={() => setActiveTab('history')} className={`flex-1 flex flex-col items-center justify-center pt-2 transition-colors ${activeTab === 'history' ? 'text-[#007AFF]' : 'text-[#8E8E93]'}`}>
                                <i className="fa-solid fa-chart-pie text-[22px] mb-1"></i>
                                <span className="text-[10px] font-medium">สรุปยอด</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
