                            <h3 className="text-[#15803d] text-xs font-bold uppercase tracking-widest mb-1 font-mono-tva">รวมยอดส่งบิลเดือนนี้</h3>
                            <div className="flex justify-center items-baseline gap-2">
                                <span className="text-6xl font-crt text-[#eab308] drop-shadow-[0_0_8px_rgba(234,179,8,0.5)]">{totalMonthCount}</span>
                                <span className="text-[#15803d] font-bold font-mono-tva">เที่ยว</span>
                            </div>
                        </div>
                        <button onClick={forceRefresh} className="absolute top-2 right-2 text-[#15803d] hover:text-[#22c55e]"><i className={`fa-solid fa-rotate-right ${isLoadingHistory ? 'animate-spin' : ''}`}></i></button>
                    </div>
                    
                    <div className="grid grid-cols-4 gap-2 font-mono-tva">
                        <div className="bg-[#050a06] border border-[#15803d] p-2 flex flex-col items-center justify-center">
                            <span className="text-[10px] font-bold text-[#15803d] mb-1">รวมวันนี้</span><span className="text-xl font-crt text-white">{todayTotal}</span>
                        </div>
                        <div className="bg-[#050a06] border border-[#15803d] p-2 flex flex-col items-center justify-center">
                            <span className="text-[10px] font-bold text-[#f97316] mb-1">ก่อนเที่ยง</span><span className="text-xl font-crt text-[#f97316]">{todayMorning}</span>
                        </div>
                        <div className="bg-[#050a06] border border-[#15803d] p-2 flex flex-col items-center justify-center">
                            <span className="text-[10px] font-bold text-[#eab308] mb-1">รอบบ่าย</span><span className="text-xl font-crt text-[#eab308]">{todayAfternoon}</span>
                        </div>
                        <div className="bg-[#050a06] border border-[#15803d] p-2 flex flex-col items-center justify-center">
                            <span className="text-[10px] font-bold text-indigo-400 mb-1">หลัง 18.00</span><span className="text-xl font-crt text-indigo-400">{todayEvening}</span>
                        </div>
                    </div>

                    <div className="border-2 border-[#15803d] bg-[#020604] p-2 shadow-[0_4px_0_rgba(0,0,0,0.5)]">
                        <div className="text-[10px] text-[#15803d] font-mono-tva font-bold mb-2 uppercase">[ กราฟจำนวนเที่ยวรายวัน ]</div>
                        <div className="w-full h-48 relative">
                            <canvas ref={chartRef}></canvas>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [userProfile, setUserProfile] = useState(() => {
                try {
                    const saved = localStorage.getItem('liff_profile_cache');
                    return saved ? JSON.parse(saved) : null;
                } catch(e) { return null; }
            });
            const [isLiffReady, setIsLiffReady] = useState(false);
            const [activeTab, setActiveTab] = useState('scan');
            const [refreshHistoryTrigger, setRefreshHistoryTrigger] = useState(0); 
            const [currentTime, setCurrentTime] = useState('');

            const wakeLockRef = useRef(null);

            const requestWakeLock = async () => {
                if ('wakeLock' in navigator) {
                    try { wakeLockRef.current = await navigator.wakeLock.request('screen'); } 
                    catch (err) {}
                }
            };

            useEffect(() => {
                const initLiff = async () => {
                    try {
                        await liff.init({ liffId: '2009934240-M2LO3My9' });
                        if (liff.isLoggedIn()) {
                            const profile = await liff.getProfile();
                            setUserProfile(profile);
                            try { localStorage.setItem('liff_profile_cache', JSON.stringify(profile)); } catch(e) {}
                        } else {
                            setUserProfile(null);
                            try { localStorage.removeItem('liff_profile_cache'); } catch(e) {}
                        }
                        setIsLiffReady(true);
                    } catch (err) {
                        setIsLiffReady(true); 
                    }
                };
                initLiff();

                requestWakeLock();
                const handleVisibilityChange = () => { if (document.visibilityState === 'visible') requestWakeLock(); };
                document.addEventListener('visibilitychange', handleVisibilityChange);

                const timer = setInterval(() => setCurrentTime(new Date().toLocaleTimeString('th-TH')), 1000);

                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    if (wakeLockRef.current !== null) wakeLockRef.current.release().catch(()=>{});
                    clearInterval(timer);
                };
            }, []);

            if (!isLiffReady) {
                return (
                    <div className="min-h-screen bg-black flex flex-col items-center justify-center font-crt text-[#22c55e]">
                        <div className="w-16 h-16 border-4 border-[#15803d] border-t-[#22c55e] rounded-full animate-spin mb-6"></div>
                        <p className="text-[#eab308] text-xl animate-pulse tracking-widest">กำลังเตรียมความพร้อม...</p>
                    </div>
                );
            }

            if (!userProfile) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="bg-[#4a362a] p-4 rounded-3xl border-8 border-[#1a1311] shadow-[0_20px_50px_rgba(0,0,0,0.9)] max-w-sm w-full relative">
                            <div className="bg-[#1a1311] p-4 rounded-xl border-4 border-[#3d2c23] shadow-inner text-center font-mono-tva">
                                <h1 className="font-tva text-4xl text-[#a67c00] tracking-widest mb-1 mt-2">สแกนส่งบิล</h1>
                                <p className="text-[10px] text-[#b49050] mb-8 font-bold">เชื่อมต่อผ่าน LINE เพื่อยืนยันตัวตนก่อนเข้าใช้งาน</p>
                                
                                <div className="bg-[#050a06] border-2 border-[#15803d] p-6 mb-8 shadow-[inset_0_0_15px_rgba(0,0,0,1)]">
                                    <i className="fa-solid fa-fingerprint text-6xl text-[#15803d] mb-4"></i>
                                </div>
                                
                                <button onClick={() => liff.login()} className="hw-button w-full bg-[#06C755] text-black font-tva text-2xl py-3 rounded">
                                    [ ล็อกอินด้วย LINE ]
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex items-center justify-center md:p-4">
                    {/* The Physical Device Casing */}
                    <div className="w-full max-w-md h-[100dvh] md:h-[90vh] bg-[#4a362a] md:rounded-[2.5rem] p-3 border-x-[8px] md:border-[12px] border-[#2c1e16] shadow-[0_20px_50px_rgba(0,0,0,0.8),inset_0_5px_10px_rgba(255,255,255,0.1)] relative flex flex-col">
                        
                        {/* Screws */}
                        <div className="absolute top-4 left-4 w-2 h-2 bg-[#1a1311] rounded-full hidden md:block"></div>
                        <div className="absolute top-4 right-4 w-2 h-2 bg-[#1a1311] rounded-full hidden md:block"></div>

                        {/* Screen Area */}
                        <div className="flex-1 bg-[#1a1311] p-2 rounded-xl border-4 border-[#3d2c23] shadow-inner relative flex flex-col min-h-0">
                            <div className="temppad-screen flex-1 rounded-lg flex flex-col relative overflow-hidden">
                                
                                {/* Status Bar (Replaces floating profile) */}
                                <div className="flex justify-between items-center border-b border-[#15803d] px-2 py-1 font-mono-tva text-[10px] text-[#22c55e] z-20 bg-[#050a06]">
                                    <div className="flex items-center space-x-1 truncate max-w-[120px]">
                                        <span className="opacity-50">เข้าสู่ระบบโดย</span>
                                        <span className="font-bold text-[#eab308] truncate">{userProfile.displayName}</span>
                                    </div>
                                    <div className="text-[#22c55e] font-bold">{currentTime || '00:00:00'}</div>
                                    <div className="flex items-center">
                                        <button onClick={() => { liff.logout(); window.location.reload(); }} className="text-red-500 font-bold px-1">[ออกจากระบบ]</button>
                                    </div>
                                </div>

                                {/* Content Router */}
                                <div className="flex-1 relative z-10 bg-[#050a06]">
                                    <ScannerTab 
                                        isActive={activeTab === 'scan'} 
                                        userProfile={userProfile} 
                                        onSaveSuccess={() => setRefreshHistoryTrigger(prev => prev + 1)} 
                                    />
                                    <HistoryTab 
                                        isActive={activeTab === 'history'} 
                                        refreshTrigger={refreshHistoryTrigger} 
                                    />
                                </div>
                            </div>
                        </div>

                        {/* Hardware Buttons Panel (Bottom) */}
                        <div className="mt-3 grid grid-cols-2 gap-3 px-2 shrink-0 mb-1">
                            <button 
                                onClick={() => setActiveTab('scan')}
                                className={`hw-button rounded-lg p-3 flex flex-col items-center justify-center font-tva text-xl tracking-widest ${activeTab === 'scan' ? 'bg-[#a67c00] text-[#1a1311] active' : 'bg-[#8c6b3e] text-[#2c1e16]'}`}
                            >
                                <i className="fa-solid fa-barcode mb-1"></i>
                                <span className="text-xs leading-none">สแกนบิล</span>
                            </button>
                            <button 
                                onClick={() => setActiveTab('history')}
                                className={`hw-button rounded-lg p-3 flex flex-col items-center justify-center font-tva text-xl tracking-widest ${activeTab === 'history' ? 'bg-[#a67c00] text-[#1a1311] active' : 'bg-[#8c6b3e] text-[#2c1e16]'}`}
                            >
                                <i className="fa-solid fa-chart-pie mb-1"></i>
                                <span className="text-xs leading-none">สรุปยอด</span>
                            </button>
                        </div>
                        
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
